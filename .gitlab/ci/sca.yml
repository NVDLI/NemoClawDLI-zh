# Self-contained SCA jobs. They deliberately inherit neither root defaults nor root variables.
# Change-sensitive rules name this file, so scanner-policy edits run both focused scans.
.sca_base: &sca_base
  inherit:
    default: false
    variables: false
  image: node:20-bookworm-slim@sha256:25070a03f077f5860e4f2db8d147380678ed40ead415a21eaffd5a6208f61948
  tags: [pages]
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
  before_script:
    - |
      set -euo pipefail
      retry_cmd() {
        attempt=1
        until "$@"; do
          if [ "$attempt" -ge 3 ]; then return 1; fi
          delay=$((attempt * 3))
          echo "retrying transient SCA setup in ${delay}s (attempt $((attempt + 1))/3)" >&2
          sleep "$delay"
          attempt=$((attempt + 1))
        done
      }
      retry_cmd apt-get update -qq
      retry_cmd apt-get install -y -qq --no-install-recommends python3 python3-pip python3-venv ca-certificates git >/dev/null

security_browser_sca:
  <<: *sca_base
  stage: test
  script:
    - mkdir -p scripts/security/reports
    # npm retries transport failures internally; advisory findings still fail immediately.
    - npm audit --prefix scripts/browser-vendor --package-lock-only --audit-level=moderate --json --fetch-retries=3 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000 --fetch-timeout=30000 > scripts/security/reports/browser-npm-audit.json
    - python3 scripts/validation/course_dependency_integrity.py
  artifacts:
    when: always
    name: "security-browser-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/browser-npm-audit.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/browser-vendor/package.json
        - scripts/browser-vendor/package-lock.json
        - scripts/browser-vendor/codemirror-entry.js
        - scripts/build/vendor_browser_dependencies.mjs
        - scripts/validation/course_dependency_integrity.py
        - web/nemoclaw/vendor/browser-dependencies.json
        - web/nemoclaw/vendor/browser-sbom.cdx.json
        - web/nemoclaw/vendor/codemirror-*
        - .gitlab/ci/sca.yml
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - when: never

security_sca:
  <<: *sca_base
  stage: test
  script:
    - mkdir -p scripts/security/reports
    - python3 -m venv .sca-tools-venv
    - .sca-tools-venv/bin/python -m pip install -q -r scripts/security/requirements-sca.lock
    - PATH="$CI_PROJECT_DIR/.sca-tools-venv/bin:$PATH" .sca-tools-venv/bin/python scripts/security/run_full_sca.py --execute --python-local --cyclonedx-env --out-dir scripts/security/reports
  artifacts:
    when: always
    name: "security-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - when: never

security_deep_sca:
  <<: *sca_base
  stage: test
  timeout: 2h
  script:
    - rm -rf .sca-runtime-venv .sca-tools-venv
    - python3 -m venv .sca-runtime-venv
    - python3 -m venv .sca-tools-venv
    - .sca-runtime-venv/bin/python -m pip install -q -r workspace/requirements.lock
    - .sca-tools-venv/bin/python -m pip install -q -r scripts/security/requirements-sca.lock
    - RUNTIME_SITE="$(.sca-runtime-venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
    - PATH="$CI_PROJECT_DIR/.sca-tools-venv/bin:$PATH" .sca-tools-venv/bin/python scripts/security/run_full_sca.py --execute --require-tools --python-local --cyclonedx-env --python-executable "$CI_PROJECT_DIR/.sca-runtime-venv/bin/python" --python-path "$RUNTIME_SITE" --out-dir scripts/security/reports/deep-workspace
    - .sca-tools-venv/bin/python scripts/security/audit_sbom_policy.py --sbom scripts/security/reports/deep-workspace/python-env.cdx.json --report scripts/security/reports/deep-workspace/sbom-policy.json
  artifacts:
    when: always
    name: "security-deep-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/deep-workspace/
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - workspace/requirements.txt
        - workspace/requirements.lock
        - workspace/Dockerfile
        - cpu/services/sandbox_admin/requirements.txt
        - cpu/services/docker_router/Dockerfile
        - cpu/services/llm_client/llm_client.Dockerfile
        - scripts/security/audit_python_dependencies.py
        - scripts/security/audit_vulnerability_waivers.py
        - scripts/security/audit_dependency_locks.py
        - scripts/security/audit_sbom_policy.py
        - scripts/security/requirements-sca.lock.in
        - scripts/security/requirements-sca.lock
        - scripts/security/run_full_sca.py
        - scripts/security/vulnerability-waivers.json
        - .gitlab/ci/sca.yml
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
