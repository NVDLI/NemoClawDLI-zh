worker_processes auto;
pid /etc/nginx/.nginx.pid;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	client_max_body_size 0;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	default_type application/octet-stream;

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
		ssl_prefer_server_ciphers on;

	access_log /var/log/access.log;
	error_log /var/log/error.log;

	gzip on;
	gzip_disable "msie6";

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

	## Runtime DNS resolution: the services (llm_client, openclaw, docker_router)
	## are resolved at REQUEST time via a `set` variable in proxy_pass, not at parse
	## time, so nginx starts cleanly even when a service is briefly absent, and a
	## transient outage never takes down :80/lab (the LMS health check).
	resolver 127.0.0.11 valid=10s ipv6=off;

	server {

		listen 80 default_server;
		listen [::]:80 default_server;

		# ── Course-bundle landing ──────────────────────────────────────────
		# / and several clean shortcut URLs all redirect to the foyer,
		# a small static page that lets the student choose between the
		# short course and the full course before entering either.
		#
		# A readiness probe should target /healthz (below), not :80/lab. With
		# default_url pointing at the static foyer, :80/lab returns
		# 302→foyer→200 without exercising JupyterLab, so it would report ready
		# even when Jupyter is broken. /healthz proxies /lab/api/status, which
		# actually touches the server.
		#
		# /lab/static/index.html resolves to /sandbox/dli/web/index.html, the
		# course picker, via Jupyter's --ServerApp.extra_static_paths (the web
		# root serves it; the repo root carries no index.html).
		# $is_args$args preserves a launch ?token= through the redirect, so the
		# foyer receives it and can establish the Jupyter session cookie. Without
		# it, a bare-origin launch (http://<lab>/?token=...) lands on the foyer
		# tokenless and the first gated click bounces to the login screen.
		location = / {
			return 302 /lab/static/index.html$is_args$args;
		}
		# Clean URL aliases. Every "welcome" path lands on the course picker.
		location = /courses       { return 302 /lab/static/index.html$is_args$args; }
		location = /start         { return 302 /lab/static/index.html$is_args$args; }
		location = /learn         { return 302 /lab/static/index.html$is_args$args; }
		location = /foyer         { return 302 /lab/static/index.html$is_args$args; }
		location = /welcome       { return 302 /lab/static/index.html$is_args$args; }
		location = /jupyter       { return 302 /lab/; }
		# The released course is web/nemoclaw (Securing Agents), whose integrated
		# home is nemoclaw/index.html. /securing-agents is its clean URL alias.
		location = /securing-agents { return 302 /lab/static/nemoclaw/index.html$is_args$args; }

		# ── JUPYTER_TOKEN-gated service proxies (/lab/svc/*) ──────────────
		# These let the in-lab nemoclaw pages reach the course's
		# llm_client sidecar WITHOUT a key, but only for an authenticated
		# student. They live UNDER /lab/ on purpose:
		# the browser auto-sends Jupyter's httponly session cookie (path /lab/)
		# to any /lab/* path, and auth_request validates it against
		# /lab/api/status. An unauthenticated caller (no valid session) gets
		# 401, so the page falls back to direct mode (the student's own key) and
		# the course keys in llm_client are never exposed by hostname or to an
		# unauthenticated request. The old ungated /api/* routes are removed.
		# (api.mjs / _shared.js probe these /lab/svc/* paths; on S3/edX the
		# probe fails cross-origin and the pages use direct mode as before.)
		location /lab/svc/llm/ {
			auth_request /__lab_auth;
			error_page 401 403 = @svc_denied;
			set $lab_token $arg_token;
			set $llm_upstream http://llm_client:9000;
			rewrite ^/lab/svc/llm/(.*)$ /$1 break;
			proxy_pass $llm_upstream;
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_buffering off;
			if ($request_method = OPTIONS) { return 204; }
		}

		# Unauthenticated access to a gated /lab/svc/* route → 401 (not a login
		# redirect): the page's probe treats this as "no proxy" and uses the
		# student's own key (direct mode). Course keys never leave llm_client.
		location @svc_denied {
			add_header WWW-Authenticate "Bearer" always;
			return 401;
		}

		# ── LMS readiness probe target ────────────────────────────────────
		# Point readiness probes at :80/healthz, not :80/lab. With default_url
		# at the static foyer, :80/lab returns 302→foyer→200 without exercising
		# Jupyter, so a broken server would still report ready. /healthz proxies
		# /lab/api/status, which touches the server: it returns 200 when up and
		# unauthenticated, and 403 (jupyter-server 2.x) or 401 on a
		# token-protected server. Both 401 and 403 mean "up, auth-gated" = alive
		# and map to 200 below; only 5xx/502/504/000 are real failures.
		location = /healthz {
			## Runtime DNS (resolver at http-level) so a recreated `lab`
			## (new container IP) is picked up without recreating nginx.
			## A literal proxy_pass caches the IP for the worker lifetime
			## and 502s after `docker compose up` rebuilds lab under a
			## still-running nginx.
			set $lab_upstream http://lab:8888;
			rewrite ^ /lab/api/status break;
			proxy_pass $lab_upstream;
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_intercept_errors on;
			# Map 401 AND 403 → 200 so a token-protected (but live) Jupyter
			# still counts as ready. jupyter-server 2.x returns 403 (not 401)
			# for a tokenless probe against a token-protected server. 5xx and
			# 502/504 stay errors.
			error_page 401 403 = @healthz_alive;
		}
		location @healthz_alive {
			return 200 "ok\n";
			add_header Content-Type "text/plain" always;
		}

		# ── /lab entrance gate ────────────────────────────────────────────
		# A bare /lab request is gated here so a tokenless or bad-token request
		# is sent to /lab/login (which proves the server is token-protected),
		# while an authenticated request (?token= or session cookie) is proxied
		# to Jupyter and lands on the foyer (default_url). This keeps a tokenless
		# readiness poll against :80/lab meaningful even though default_url=foyer
		# would otherwise serve index.html at HTTP 200. Everything under /lab/*
		# uses the prefix location below.
		location = /lab {
			set $lab_token $arg_token;          # captured here; auth subrequest inherits it
			auth_request /__lab_auth;
			error_page 401 403 = @lab_login;
			## Runtime DNS keeps this working across a `lab` recreate (see /healthz note).
			set $lab_upstream http://lab:8888;
			proxy_pass $lab_upstream;
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
		location = /__lab_auth {
			internal;
			## Runtime DNS keeps this working across a `lab` recreate (see /healthz note).
			set $lab_upstream http://lab:8888;
			rewrite ^ /lab/api/status break;   # 200 if authed, 401/403 if not
			proxy_pass $lab_upstream;
			proxy_pass_request_body off;
			proxy_set_header Content-Length "";
			proxy_set_header Content-Type "";            # clean GET; avoid a stray json type
			# Strip Origin on the auth subrequest. The page's same-origin POST to
			# /lab/svc/llm carries `Origin: <public host>`, which nginx would forward
			# here while proxying to Host `lab:8888`. Jupyter then sees Origin != Host,
			# blocks the request as cross-origin, and returns a 404 that the
			# resilience rule below turns into a 403/401, denying every probe behind
			# a 401. The auth check is internal and needs no Origin, so clear it.
			proxy_set_header Origin "";
			# Cookie is auto-forwarded (cookie entry); honor a URL ?token= by
			# presenting it as the header Jupyter accepts (empty when absent).
			proxy_set_header Authorization "token $lab_token";
			# Resilience: auth_request turns ANY non-2xx/401/403 subrequest status
			# into a hard 500 for the client. A transient /lab/api/status hiccup
			# (404/5xx while the lab restarts) would therefore 500 the playground.
			# Normalize those to 403 so the gate DENIES (page falls back to direct
			# mode) instead of erroring.
			proxy_intercept_errors on;
			error_page 404 405 500 502 503 504 = @auth_unavailable;
		}
		location @auth_unavailable { return 403; }
		location @lab_login { return 302 /lab/login?next=%2Flab%2Fstatic%2Findex.html; }

		# The foyer is the LMS landing (Jupyter default_url), opened as
		# /lab/static/index.html?token=<session>. Some Jupyter builds bounce a
		# token-carrying static GET to /lab/login (exactly the request the LMS
		# makes), even though they serve the same file fine WITHOUT a token (the
		# course links prove anonymous static works). Strip the query when proxying
		# the foyer upstream so Jupyter serves it anonymously and never bounces; the
		# browser still has ?token= in its address bar, so the foyer's own JS
		# exchanges it for the /lab/ session cookie (fetch /lab/api/status?token=)
		# and carries it onto the gated links. Exact-match wins over the /lab prefix.
		location = /lab/static/index.html {
			set $lab_upstream http://lab:8888;
			proxy_pass $lab_upstream/lab/static/index.html;   # no $args → token dropped upstream
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		## SECURITY GUARD: /lab/static now has /sandbox/dli (the whole repo) as a
		## fallback search root so every page (scripts/, web/, cpu/, mats/, docs/) is
		## renderable. In DEV the bind mount also exposes repo-root credentials, so block
		## them here. (In PROD the seed never copies these into the volume.) Regex wins
		## over the /lab prefix; 404 hides existence. Keep in sync with the dev secret set.
		location ~* ^/lab/static/.*(BEARER_TOKEN|CF_ACCESS|secret|\.env|\.key|\.pem|\.crt|\.p12|\.pfx|id_rsa|/\.) {
			return 404;
		}

		location /lab {
			## Runtime DNS keeps this working across a `lab` recreate (see /healthz note).
			set $lab_upstream http://lab:8888;
			proxy_pass $lab_upstream;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $http_host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-Host $host;
			# JupyterLab kernel spawns can take 2-3 min on cold start. nginx
			# default proxy_read_timeout (60s) makes those look like 504s
			# from the LMS side, indistinguishable from a dead lab.
			proxy_read_timeout 300s;
			proxy_buffering off;
		}

        # OpenClaw is JUPYTER_TOKEN-gated, served under /lab/openclaw so the
        # httponly Jupyter session cookie (path /lab/) authenticates it via
        # auth_request. Layer 1 already removed openclaw's host port; this closes
        # the nginx surface too, so the privileged agent shell is reachable ONLY
        # by an authenticated student. The foyer links here in-lab; openclaw.json
        # controlUi.basePath is /lab/openclaw to match. Unauthenticated full-page
        # nav → /lab/login. proxy_pass with no URI forwards /lab/openclaw* to the
        # gateway, which serves its control UI at that basePath. The openclaw
        # gateway token (separate from JUPYTER_TOKEN) is still injected below.
        # The WS endpoint stays at the gateway root (/ws).

        # Fallback for the control UI's base-path mangle. The 2026.5.28 UI derives
        # its gateway WS base from window.__OPENCLAW_CONTROL_UI_BASE_PATH__ (injected
        # below) and falls back to mangling location.pathname when that global is not
        # in effect at runtime -- which happens when a stale service worker serves a
        # pre-injection index.html from cache. The mangle turns /lab/openclaw/... into
        # /openclaw, so the UI opens ws://<host>/openclaw and the connection 404s.
        # Route that exact path to the gateway's control WS (same token gate + Origin
        # pin as /lab/openclaw) so the webchat connects regardless of whether the
        # injection took effect. A fresh visitor caches the injected page and uses
        # /lab/openclaw directly; this only catches the mangled fallback.
        location = /openclaw {
            auth_request /__lab_auth;
            error_page 401 403 = @svc_denied;
            set $lab_token $arg_token;
            set $openclaw_fallback_upstream http://openclaw:8995;
            proxy_pass $openclaw_fallback_upstream/lab/openclaw;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Origin "http://localhost:8088";
            proxy_read_timeout 86400;
        }

        location /lab/openclaw/ws {
            auth_request /__lab_auth;
            error_page 401 403 = @svc_denied;
            set $lab_token $arg_token;
            set $openclaw_ws_upstream http://openclaw:8995;
            proxy_pass $openclaw_ws_upstream/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Pin the WS Origin to a stock-allowlisted value (see the long note on
            # the /lab/openclaw block below). Must stay in openclaw.json
            # controlUi.allowedOrigins.
            proxy_set_header Origin "http://localhost:8088";
            proxy_read_timeout 86400;
        }

        location /lab/openclaw {
            auth_request /__lab_auth;
            error_page 401 403 = @lab_login;
            set $lab_token $arg_token;
            set $openclaw_upstream http://openclaw:8995;
            proxy_pass $openclaw_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Control UI WS origin pinning. The 2026.5.28 control UI opens its
            # gateway WebSocket at this basePath root and the gateway validates the
            # connect frame's Origin against gateway.controlUi.allowedOrigins. A
            # browser on the public lab host (port 80) sends Origin: http://<host>,
            # which is not in the allowlist; dangerouslyAllowHostHeaderOriginFallback
            # only accepts Origin==Host and fails for default-port origins (the
            # browser drops :80 from Host but not from the Origin comparison), so the
            # WS is rejected with CONTROL_UI_ORIGIN_NOT_ALLOWED -> the UI shows
            # "Could not connect (1006)". nginx is the trusted, token-gated, sole
            # path to the gateway, so it pins the Origin to a stock-allowlisted value
            # instead of enumerating every dev/prod hostname. Keep this literal in
            # sync with an entry in openclaw.json controlUi.allowedOrigins.
            proxy_set_header Origin "http://localhost:8088";
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' https://fonts.gstatic.com;" always;
            sub_filter '<head>' '<head><script>
            (function() {
                // OpenClaw 2026.5.28 control UI builds its gateway WS URL and its
                // client router base from this global (Ho -> Ni(window.
                // __OPENCLAW_CONTROL_UI_BASE_PATH__)). Without it the UI mangles
                // location.pathname (/lab/openclaw/) down to /openclaw and the
                // WebSocket never connects. The UI picks ws:// vs wss:// from the
                // page protocol itself, so we only set the path. The older
                // localStorage "gatewayUrl" hint this replaced is not read by this
                // UI version.
                window.__OPENCLAW_CONTROL_UI_BASE_PATH__ = "/lab/openclaw";
                if (!window.location.hash || !window.location.hash.includes("token=")) {
                    window.location.hash = "token=dli-openclaw-token";
                }
            })();
            </script>';
            sub_filter_once on;
            proxy_read_timeout 86400;
        }

        # Container-control bridge (restart/logs) is JUPYTER_TOKEN-gated under
        # /lab/ so the httponly Jupyter cookie authenticates it. This is the
        # most sensitive sidecar after llm_client/openclaw (it can restart
        # containers), so it must never be reachable unauthenticated. Old
        # ungated /docker-router/ is redirected here.
        location = /docker-router            { return 302 /lab/svc/docker-router/; }
        location = /lab/svc/docker-router    { return 302 /lab/svc/docker-router/; }

        location /lab/svc/docker-router/ {
            auth_request /__lab_auth;
            error_page 401 403 = @svc_denied;
            set $lab_token $arg_token;
            set $docker_router_upstream http://docker_router:8070;
            rewrite ^/lab/svc/docker-router/(.*)$ /$1 break;
            proxy_pass $docker_router_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sandbox control plane (OpenShell policy + cron) is JUPYTER_TOKEN-gated.
        # Lets the in-lab safety page read the active policy from the browser.
        # Reload restarts OpenClaw, so this must never be reachable anonymously.
        location = /lab/svc/sandbox-admin    { return 302 /lab/svc/sandbox-admin/; }
        location /lab/svc/sandbox-admin/ {
            auth_request /__lab_auth;
            error_page 401 403 = @svc_denied;
            set $lab_token $arg_token;
            set $sandbox_admin_upstream http://sandbox-admin:8099;
            rewrite ^/lab/svc/sandbox-admin/(.*)$ /$1 break;
            proxy_pass $sandbox_admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

	}
}
