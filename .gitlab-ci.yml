# GitLab CI for the NemoClaw course: static gates plus isolated GitLab Pages deploys.
#
# Jobs:
#   test            runs the static gate headless under node. No lab, GPU, or browser.
#   pages           deploys production manually, or deploys a manual branch preview on the
#                   same Pages host under $CI_PAGES_URL/$CI_COMMIT_REF_SLUG/web/nemoclaw/.
#   human_review    records the designated human operator's approval of the tested live preview.
#
# Isolation contract:
#   - branch previews are manual and live under public/<branch-slug>/web/nemoclaw;
#   - preview Pages artifacts rebuild the production root from a protected ref, then add the branch preview;
#   - downloadable Pages job artifacts expire quickly to avoid storage growth;
#   - the branch foyer at public/<branch-slug>/index.html reads a static branch manifest;
#   - production refs still require a manual job start;
#   - branch names are normalized through CI_COMMIT_REF_SLUG before becoming URLs.

stages: [test, deploy, verify, review]

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GIT_DEPTH: "20"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Open merge requests run one MR-context pipeline so the submission contract sees
# the actual MR body. Branch pipelines remain available before an MR exists.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

.with_python_node: &with_python_node
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip
  image: node:20-bookworm-slim
  # The available instance runners are all tagged; untagged jobs match none of them.
  # `pages` is the Shared Pages Runner (a Docker runner) that picks these up.
  tags: [pages]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-pip ca-certificates git >/dev/null
    # The materials vendorer needs these for the build-time pull + the live drift check; the
    # offline gate legs (validate_bundle's materials read) do not. Best-effort: if the install
    # fails, the pull is deps-guarded and falls back to the committed snapshots.
    - pip install --break-system-packages -q requests beautifulsoup4 markdownify lxml >/dev/null 2>&1 || true

test:
  <<: *with_python_node
  stage: test
  # Required gate: Pages may publish only after every required-tier release check passes.
  allow_failure: false
  script:
    # The canonical English course and sparse same-branch locale overlays ship together.
    # validate_bundle checks English prose plus locale-specific overlay integrity in one run.
    - python3 scripts/validation/validate_layout.py --quiet
    - python3 scripts/skills/skill_consistency.py
    - python3 scripts/skills/skill_contract.py
    - python3 scripts/validation/ci_storage_audit.py
    - python3 scripts/validation/branch_preview_manifest_audit.py --self-test
    - python3 scripts/validation/learner_flow_audit.py --self-test
    - python3 scripts/validation/html_structure_audit.py --self-test
    - python3 scripts/validation/slides_audit.py --self-test
    - python3 scripts/build/build_repository_overview_html.py --check
    - python3 scripts/figures/render_security_architecture.py --check
    - python3 scripts/validation/security_architecture_audit.py --self-test
    # Semantic verifier: derives release jobs, runtime hosts, dynamic host suffixes, and worker
    # inventory from source; topology changes require an explicit architecture review.
    - python3 scripts/validation/security_architecture_audit.py
    - python3 scripts/validation/release_evidence_audit.py --self-test
    - python3 scripts/validation/release_evidence_audit.py
    - python3 scripts/build/assemble_locale_overlay.py --self-test
    - python3 scripts/validation/localization_audit.py --self-test
    - 'for locale in scripts/translate/locales/*; do if [ -f "$locale/profile.json" ]; then code="$(basename "$locale")"; python3 scripts/validation/localization_audit.py --locale "$code"; fi; done'
    - python3 scripts/validation/contribution_safety_audit.py --self-test
    - python3 scripts/validation/contribution_safety_audit.py --report docs/validation/contribution-safety.json
    - 'if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then python3 scripts/validation/contribution_safety_audit.py --submission-env CI_MERGE_REQUEST_DESCRIPTION; else echo "Submission contract: no merge-request context in this pipeline; protected-ref policy remains authoritative."; fi'
    - 'if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then python3 scripts/validation/contribution_safety_audit.py --commit-range "${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${CI_COMMIT_SHA}"; else echo "DCO signoff: no merge-request commit range in this pipeline; pre-push and protected-ref policy remain authoritative."; fi'
    - python3 scripts/compliance/source_gate.py
    - python3 scripts/security/audit_python_dependencies.py
    - python3 scripts/security/audit_vulnerability_waivers.py
    - python3 scripts/security/audit_dependency_locks.py --self-test
    - python3 scripts/security/audit_dependency_locks.py
    - python3 scripts/security/audit_sbom_policy.py --self-test
    - python3 scripts/build/package_release.py --self-test
    - bash   scripts/runtime/run_engine.sh --self-test
    - python3 scripts/validation/validate_bundle.py --scope ship
    # Live materials drift check: keep ordinary branch pipelines offline so arXiv/devblog rate
    # limits do not make feature work noisy. validate_bundle still checks committed provenance on
    # every branch; production refs and schedules perform the live re-fetch.
    - |
      B="${CI_COMMIT_BRANCH:-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}}"
      if [ "${CI_PIPELINE_SOURCE:-}" = "schedule" ] || [ "$B" = "${CI_DEFAULT_BRANCH:-main}" ] || [ "$B" = "nemoclaw-only" ]; then
        python3 scripts/materials/pull_materials.py --check
      else
        echo "Skipping live materials drift check on branch '${B:-detached}' to avoid rate-limiting external sources."
        echo "Offline provenance still runs inside scripts/validation/validate_bundle.py."
      fi
  artifacts:
    when: always
    name: "gate-$CI_COMMIT_SHORT_SHA"
    paths:
      - docs/validation/
    expire_in: 30 days

security_sca:
  <<: *with_python_node
  stage: test
  script:
    - mkdir -p scripts/security/reports
    - pip install --break-system-packages -q --upgrade pip setuptools wheel pip-audit cyclonedx-bom >/dev/null
    - python3 scripts/security/run_full_sca.py --execute --python-local --cyclonedx-env --out-dir scripts/security/reports
  artifacts:
    when: always
    name: "security-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: false
    - when: never

security_deep_sca:
  <<: *with_python_node
  stage: test
  timeout: 2h
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-venv >/dev/null
    - rm -rf .sca-runtime-venv .sca-tools-venv
    - python3 -m venv .sca-runtime-venv
    - python3 -m venv .sca-tools-venv
    - .sca-runtime-venv/bin/python -m pip install -q -r workspace/requirements.lock
    - .sca-tools-venv/bin/python -m pip install -q -r scripts/security/requirements-sca.lock
    - RUNTIME_SITE="$(.sca-runtime-venv/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
    - PATH="$CI_PROJECT_DIR/.sca-tools-venv/bin:$PATH" .sca-tools-venv/bin/python scripts/security/run_full_sca.py --execute --require-tools --python-local --cyclonedx-env --python-executable "$CI_PROJECT_DIR/.sca-runtime-venv/bin/python" --python-path "$RUNTIME_SITE" --out-dir scripts/security/reports/deep-workspace
    - .sca-tools-venv/bin/python scripts/security/audit_sbom_policy.py --sbom scripts/security/reports/deep-workspace/python-env.cdx.json --report scripts/security/reports/deep-workspace/sbom-policy.json
  artifacts:
    when: always
    name: "security-deep-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/deep-workspace/
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - workspace/requirements.txt
        - workspace/requirements.lock
        - workspace/Dockerfile
        - cpu/services/sandbox_admin/requirements.txt
        - cpu/services/docker_router/Dockerfile
        - cpu/services/llm_client/llm_client.Dockerfile
        - scripts/security/audit_python_dependencies.py
        - scripts/security/audit_vulnerability_waivers.py
        - scripts/security/audit_dependency_locks.py
        - scripts/security/audit_sbom_policy.py
        - scripts/security/requirements-sca.lock.in
        - scripts/security/requirements-sca.lock
        - scripts/security/run_full_sca.py
        - scripts/security/vulnerability-waivers.json
        - .gitlab-ci.yml
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: false
    - when: never

pages:
  <<: *with_python_node
  stage: deploy
  needs: ["test"]
  resource_group: pages-site
  script:
    # This GitLab instance still uses classic Pages: only the job literally named
    # `pages` can publish. Branch previews therefore ship a combined artifact
    # with production rebuilt from a protected ref plus the branch under /<slug>/.
    - |
      set -euo pipefail
      refresh_branch_refs() {
        git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet 2>/dev/null || true
      }
      build_branch_preview() {
        test -n "$CI_COMMIT_REF_SLUG"
        preview_ref="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
        case "$CI_COMMIT_REF_SLUG" in *..*|*/*|*\*) echo "unsafe CI_COMMIT_REF_SLUG=$CI_COMMIT_REF_SLUG" >&2; exit 1;; esac
        refresh_branch_refs
        remote_sha="$(git rev-parse "refs/remotes/origin/$preview_ref^{commit}")"
        test "$remote_sha" = "$CI_COMMIT_SHA" || { echo "refusing stale preview: pipeline=$CI_COMMIT_SHA remote=$remote_sha" >&2; exit 1; }
        export BUILD_PAGES_COURSE_PREFIX="web"
        bash scripts/build/build_pages.sh "public/$CI_COMMIT_REF_SLUG"
        python3 scripts/build/build_branch_manifest.py --out "public/$CI_COMMIT_REF_SLUG/branches.json" --current-ref "$preview_ref" --current-slug "$CI_COMMIT_REF_SLUG"
        test -f "public/$CI_COMMIT_REF_SLUG/index.html"
        test -f "public/$CI_COMMIT_REF_SLUG/branches.json"
        test -f "public/$CI_COMMIT_REF_SLUG/languages.json"
        test -f "public/$CI_COMMIT_REF_SLUG/web/nemoclaw/index.html"
        test -f "public/$CI_COMMIT_REF_SLUG/validated-source/web/nemoclaw/index.html"
        grep -q 'href="web/nemoclaw/index.html"' "public/$CI_COMMIT_REF_SLUG/index.html"
        grep -q 'href="web/nemoclaw/assets/favicon.ico"' "public/$CI_COMMIT_REF_SLUG/index.html"
        grep -q 'return "web/nemoclaw/"' "public/$CI_COMMIT_REF_SLUG/index.html"
        grep -q 'web/nemoclaw/' "public/$CI_COMMIT_REF_SLUG/languages.json"
        for locale in i18n/*; do if [ -d "$locale/web/nemoclaw" ]; then code="$(basename "$locale")"; test -f "public/$CI_COMMIT_REF_SLUG/$code/nemoclaw/index.html"; grep -q "$code/nemoclaw/" "public/$CI_COMMIT_REF_SLUG/languages.json"; fi; done
      }
      build_production_root_from_ref() {
        preview_ref="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
        prod_ref="${PROD_PAGES_REF:-$CI_DEFAULT_BRANCH}"
        case "$prod_ref" in "$CI_DEFAULT_BRANCH"|nemoclaw-only) ;; *) echo "refusing unapproved PROD_PAGES_REF=$prod_ref" >&2; exit 1;; esac
        echo "building production root from protected ref: $prod_ref"
        rm -rf /tmp/nemoclaw-prod-root
        mkdir -p /tmp/nemoclaw-prod-root
        git fetch origin "$prod_ref:refs/remotes/origin/$prod_ref" --quiet
        git archive "origin/$prod_ref" | tar -x -C /tmp/nemoclaw-prod-root
        (cd /tmp/nemoclaw-prod-root && bash scripts/build/build_pages.sh "$CI_PROJECT_DIR/public")
        refresh_branch_refs
        python3 scripts/build/build_branch_manifest.py --out public/branches.json --current-ref "$prod_ref" --current-slug "$prod_ref" --published-ref "$preview_ref=$CI_COMMIT_REF_SLUG"
        test -f public/nemoclaw/index.html
        test -f public/index.html
        test -f public/branches.json
        test -f public/languages.json
        grep -q 'nemoclaw-branches/2' public/branches.json
        grep -Fq "$preview_ref" public/branches.json
      }
      if [ "${PAGES_PREVIEW:-0}" = "1" ]; then
        preview_ref="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
        rm -rf public
        export BUILD_PAGES_PULL_MATERIALS=0
        build_production_root_from_ref
        build_branch_preview
        python3 scripts/validation/branch_preview_manifest_audit.py --artifact-root public --manifest public/branches.json --expect-preview "$preview_ref=$CI_COMMIT_REF_SLUG"
        python3 scripts/validation/branch_preview_manifest_audit.py --artifact-root public --manifest "public/$CI_COMMIT_REF_SLUG/branches.json" --expect-preview "$preview_ref=$CI_COMMIT_REF_SLUG"
      else
        bash scripts/build/build_pages.sh public
        test -f public/nemoclaw/index.html
        test -f public/branches.json
        test -f public/languages.json
      fi
  artifacts:
    paths:
      - public
    expire_in: 3 days
  environment:
    name: "$PAGES_ENVIRONMENT_NAME"
    url: "$PAGES_ENVIRONMENT_URL"
    auto_stop_in: "$PAGES_AUTO_STOP_IN"
  rules:
    # Branch previews are real GitLab Pages deploys, but production root is rebuilt from the
    # protected production ref and the branch only gets /<slug>/ plus /<slug>/web/nemoclaw/.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != "nemoclaw-only" && $CI_COMMIT_BRANCH !~ /^translate-/ && $CI_PIPELINE_SOURCE != "schedule"'
      variables:
        PAGES_PREVIEW: "1"
        PAGES_ENVIRONMENT_NAME: "review/$CI_COMMIT_REF_SLUG"
        PAGES_ENVIRONMENT_URL: "$CI_PAGES_URL/$CI_COMMIT_REF_SLUG/web/nemoclaw/"
        PAGES_AUTO_STOP_IN: "3 days"
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^translate-/ && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "nemoclaw-only"'
      variables:
        PAGES_PREVIEW: "1"
        PAGES_ENVIRONMENT_NAME: "review/$CI_COMMIT_REF_SLUG"
        PAGES_ENVIRONMENT_URL: "$CI_PAGES_URL/$CI_COMMIT_REF_SLUG/web/nemoclaw/"
        PAGES_AUTO_STOP_IN: "3 days"
      when: manual
      allow_failure: false
    # Production lock: production deploys are manual only. Pushes to production refs run tests,
    # but no one gets a new production Pages artifact without explicitly starting this job.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        PAGES_ENVIRONMENT_NAME: "production"
        PAGES_ENVIRONMENT_URL: "$CI_PAGES_URL/nemoclaw/"
        PAGES_AUTO_STOP_IN: "never"
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "nemoclaw-only"'
      variables:
        PAGES_ENVIRONMENT_NAME: "production"
        PAGES_ENVIRONMENT_URL: "$CI_PAGES_URL/nemoclaw/"
        PAGES_AUTO_STOP_IN: "never"
      when: manual
      allow_failure: false
    - when: never

pages_smoke:
  image: python:3.11-slim
  tags: [pages]
  stage: verify
  needs: ["pages"]
  script:
    - |
      set -eu
      if [ "${PAGES_PREVIEW:-0}" = "1" ]; then
        preview_ref="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
        python3 scripts/validation/branch_preview_manifest_audit.py --base-url "$CI_PAGES_URL/" --expect-preview "$preview_ref=$CI_COMMIT_REF_SLUG" --attempts 30 --delay 5
      else
        python3 scripts/validation/branch_preview_manifest_audit.py --base-url "$CI_PAGES_URL/" --attempts 30 --delay 5
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != "nemoclaw-only" && $CI_COMMIT_BRANCH !~ /^translate-/ && $CI_PIPELINE_SOURCE != "schedule"'
      variables:
        PAGES_PREVIEW: "1"
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME !~ /^translate-/ && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "nemoclaw-only"'
      variables:
        PAGES_PREVIEW: "1"
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "nemoclaw-only"'
      when: on_success
      allow_failure: false
    - when: never

# A one-person maintainer project cannot honestly require an independent second reviewer.
# This blocking action still keeps merge authority human, explicit, protected, and observable:
# it becomes playable only after the exact commit's static gates and live preview both pass.
# Protect the `human-review` environment on the GitLab host and name eligible operators directly.
human_review:
  image: python:3.11-slim
  tags: [pages]
  stage: review
  needs: ["test", "pages_smoke"]
  environment:
    name: human-review
  script:
    - test -n "${CI_MERGE_REQUEST_IID:-}"
    - test -n "${CI_COMMIT_SHA:-}"
    - echo "Human operator accepted MR !$CI_MERGE_REQUEST_IID at $CI_COMMIT_SHA after required gates and live preview smoke."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
    - when: never
