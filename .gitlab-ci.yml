# GitLab CI for the NemoClaw course: static gates plus isolated GitLab Pages deploys.
#
# Jobs:
#   test            runs the static gate headless under node. No lab, GPU, or browser.
#   pages           deploys production manually, or deploys a manual branch preview on the
#                   same Pages host under $CI_PAGES_URL/$CI_COMMIT_REF_SLUG/web/nemoclaw/.
#
# Isolation contract:
#   - branch previews are manual and live under public/<branch-slug>/web/nemoclaw;
#   - preview Pages artifacts rebuild the production root from a protected ref, then add the branch preview;
#   - the branch foyer at public/<branch-slug>/index.html reads a static branch manifest;
#   - production refs still require a manual job start;
#   - branch names are normalized through CI_COMMIT_REF_SLUG before becoming URLs.

stages: [test, deploy]

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GIT_DEPTH: "20"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.with_python_node: &with_python_node
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .cache/pip
  image: node:20-bookworm-slim
  # The available instance runners are all tagged; untagged jobs match none of them.
  # `pages` is the Shared Pages Runner (a Docker runner) that picks these up.
  tags: [pages]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-pip ca-certificates git >/dev/null
    # The materials vendorer needs these for the build-time pull + the live drift check; the
    # offline gate legs (validate_bundle's materials read) do not. Best-effort: if the install
    # fails, the pull is deps-guarded and falls back to the committed snapshots.
    - pip install --break-system-packages -q requests beautifulsoup4 markdownify lxml >/dev/null 2>&1 || true

test:
  <<: *with_python_node
  stage: test
  # Advisory gate: it reports, but a failure here never blocks the Pages deploy.
  allow_failure: true
  script:
    # The structural gate is identical on every branch. A translate-<lang> branch additionally
    # passes --lang so validate_bundle skips the English-prose style suites (which would
    # false-positive on correct target-language text); the language is derived from the branch name.
    # The lang is derived inline per command so it does not depend on env persisting across lines.
    - python3 scripts/validation/validate_layout.py --quiet
    - python3 scripts/skills/skill_consistency.py
    - python3 scripts/skills/skill_contract.py
    - python3 scripts/compliance/source_gate.py
    - python3 scripts/security/audit_python_dependencies.py
    - python3 scripts/security/audit_vulnerability_waivers.py
    - bash   scripts/runtime/run_engine.sh --self-test
    - 'L=""; case "$CI_COMMIT_BRANCH" in translate-*) L="--lang ${CI_COMMIT_BRANCH#translate-}";; esac; python3 scripts/validation/validate_bundle.py --scope ship $L'
    # Live materials drift check: keep ordinary branch pipelines offline so arXiv/devblog rate
    # limits do not make feature work noisy. validate_bundle still checks committed provenance on
    # every branch; production refs and schedules perform the live re-fetch.
    - |
      if [ "${CI_PIPELINE_SOURCE:-}" = "schedule" ] || [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-main}" ] || [ "${CI_COMMIT_BRANCH:-}" = "nemoclaw-only" ]; then
        python3 scripts/materials/pull_materials.py --check
      else
        echo "Skipping live materials drift check on branch '${CI_COMMIT_BRANCH:-detached}' to avoid rate-limiting external sources."
        echo "Offline provenance still runs inside scripts/validation/validate_bundle.py."
      fi
    # On a translation branch, report what changed on the source since this translation's base so the
    # job log shows the re-translate list. Advisory: a translator syncs at their own cadence.
    - 'case "$CI_COMMIT_BRANCH" in translate-*) python3 scripts/translate/translation_status.py --check || echo "translation drift is advisory; sync at your cadence";; esac'
  artifacts:
    when: always
    name: "gate-$CI_COMMIT_SHORT_SHA"
    paths:
      - docs/validation/
    expire_in: 30 days

security_sca:
  <<: *with_python_node
  stage: test
  script:
    - mkdir -p scripts/security/reports
    - pip install --break-system-packages -q --upgrade pip setuptools wheel pip-audit cyclonedx-bom >/dev/null
    - python3 scripts/security/run_full_sca.py --execute --python-local --cyclonedx-env --out-dir scripts/security/reports
  artifacts:
    when: always
    name: "security-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: false
    - when: never

security_deep_sca:
  <<: *with_python_node
  stage: test
  timeout: 2h
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-venv >/dev/null
    - rm -rf .sca-venv
    - python3 -m venv .sca-venv
    - .sca-venv/bin/python -m pip install -q --upgrade pip setuptools wheel
    - .sca-venv/bin/python -m pip install -q -r workspace/requirements.txt
    - .sca-venv/bin/python -m pip install -q pip-audit cyclonedx-bom
    - PATH="$CI_PROJECT_DIR/.sca-venv/bin:$PATH" .sca-venv/bin/python scripts/security/run_full_sca.py --execute --python-local --cyclonedx-env --out-dir scripts/security/reports/deep-workspace
  artifacts:
    when: always
    name: "security-deep-sca-$CI_COMMIT_SHORT_SHA"
    paths:
      - scripts/security/reports/deep-workspace/
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: false
    - when: never

pages:
  <<: *with_python_node
  stage: deploy
  needs: ["test"]
  resource_group: pages-site
  script:
    # Classic GitLab Pages supports only one `pages` job. To make branch staging experiential
    # without replacing production, branch pipelines publish one combined Pages artifact:
    # production root rebuilt from a protected ref, plus this branch under /<slug>/web/nemoclaw/.
    - |
      set -euo pipefail
      refresh_branch_refs() {
        git fetch origin '+refs/heads/*:refs/remotes/origin/*' --quiet 2>/dev/null || true
      }
      stage_translations() {
        refresh_branch_refs
        for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/translate-*' 2>/dev/null); do
          lang="${ref##*translate-}"
          echo "staging i18n/$lang from $ref"
          mkdir -p "i18n/$lang"
          git archive "$ref" web | tar -x -C "i18n/$lang"
        done
      }
      build_branch_preview() {
        test -n "$CI_COMMIT_REF_SLUG"
        case "$CI_COMMIT_REF_SLUG" in *..*|*/*|*\*) echo "unsafe CI_COMMIT_REF_SLUG=$CI_COMMIT_REF_SLUG" >&2; exit 1;; esac
        refresh_branch_refs
        export BUILD_PAGES_COURSE_PREFIX="web"
        bash scripts/build/build_pages.sh "public/$CI_COMMIT_REF_SLUG"
        python3 scripts/build/build_branch_manifest.py --out "public/$CI_COMMIT_REF_SLUG/branches.json"
        test -f "public/$CI_COMMIT_REF_SLUG/index.html"
        test -f "public/$CI_COMMIT_REF_SLUG/branches.json"
        test -f "public/$CI_COMMIT_REF_SLUG/languages.json"
        test -f "public/$CI_COMMIT_REF_SLUG/web/nemoclaw/index.html"
        test -f "public/$CI_COMMIT_REF_SLUG/validated-source/web/nemoclaw/index.html"
        grep -q 'href="web/nemoclaw/index.html"' "public/$CI_COMMIT_REF_SLUG/index.html"
        grep -q 'href="web/nemoclaw/assets/favicon.ico"' "public/$CI_COMMIT_REF_SLUG/index.html"
        grep -q 'return "web/nemoclaw/"' "public/$CI_COMMIT_REF_SLUG/index.html"
        grep -q 'web/nemoclaw/' "public/$CI_COMMIT_REF_SLUG/languages.json"
        if [ -d i18n/pt/web/nemoclaw ]; then test -f "public/$CI_COMMIT_REF_SLUG/pt/nemoclaw/index.html"; grep -q 'pt/nemoclaw/' "public/$CI_COMMIT_REF_SLUG/languages.json"; fi
      }
      build_production_root_from_ref() {
        prod_ref="${PROD_PAGES_REF:-$CI_DEFAULT_BRANCH}"
        case "$prod_ref" in "$CI_DEFAULT_BRANCH"|nemoclaw-only) ;; *) echo "refusing unapproved PROD_PAGES_REF=$prod_ref" >&2; exit 1;; esac
        echo "building production root from protected ref: $prod_ref"
        rm -rf /tmp/nemoclaw-prod-root
        mkdir -p /tmp/nemoclaw-prod-root
        git fetch origin "$prod_ref:refs/remotes/origin/$prod_ref" --quiet
        git archive "origin/$prod_ref" | tar -x -C /tmp/nemoclaw-prod-root
        git fetch origin '+refs/heads/translate-*:refs/remotes/origin/translate-*' --quiet 2>/dev/null || true
        for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/translate-*' 2>/dev/null); do
          lang="${ref##*translate-}"
          echo "staging production i18n/$lang from $ref"
          mkdir -p "/tmp/nemoclaw-prod-root/i18n/$lang"
          git archive "$ref" web | tar -x -C "/tmp/nemoclaw-prod-root/i18n/$lang"
        done
        (cd /tmp/nemoclaw-prod-root && bash scripts/build/build_pages.sh "$CI_PROJECT_DIR/public")
        refresh_branch_refs
        python3 scripts/build/build_branch_manifest.py --out public/branches.json --current-ref "$prod_ref" --current-slug "$prod_ref"
        test -f public/nemoclaw/index.html
        test -f public/index.html
        test -f public/branches.json
        test -f public/languages.json
        grep -q 'nemoclaw-branches/1' public/branches.json
        grep -Fq "$CI_COMMIT_REF_NAME" public/branches.json
      }
      if [ "${PAGES_PREVIEW:-0}" = "1" ]; then
        rm -rf public
        export BUILD_PAGES_PULL_MATERIALS=0
        build_production_root_from_ref
        build_branch_preview
      else
        stage_translations
        bash scripts/build/build_pages.sh public
        test -f public/nemoclaw/index.html
        test -f public/branches.json
        test -f public/languages.json
      fi
  artifacts:
    paths:
      - public
  environment:
    name: "$PAGES_ENVIRONMENT_NAME"
    url: "$PAGES_ENVIRONMENT_URL"
  rules:
    # Branch previews are real GitLab Pages deploys, but production root is rebuilt from the
    # protected production ref and the branch only gets /<slug>/ plus /<slug>/web/nemoclaw/.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != "nemoclaw-only" && $CI_COMMIT_BRANCH !~ /^translate-/ && $CI_PIPELINE_SOURCE != "schedule"'
      variables:
        PAGES_PREVIEW: "1"
        PAGES_ENVIRONMENT_NAME: "review/$CI_COMMIT_REF_SLUG"
        PAGES_ENVIRONMENT_URL: "$CI_PAGES_URL/$CI_COMMIT_REF_SLUG/web/nemoclaw/"
      when: manual
      allow_failure: false
    # Production lock: production deploys are manual only. Pushes to production refs run tests,
    # but no one gets a new production Pages artifact without explicitly starting this job.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        PAGES_ENVIRONMENT_NAME: "production"
        PAGES_ENVIRONMENT_URL: "$CI_PAGES_URL/nemoclaw/"
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "nemoclaw-only"'
      variables:
        PAGES_ENVIRONMENT_NAME: "production"
        PAGES_ENVIRONMENT_URL: "$CI_PAGES_URL/nemoclaw/"
      when: manual
      allow_failure: false
    - when: never
