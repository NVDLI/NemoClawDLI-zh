# GitLab CI for the "Building Agents" course: a static gate, then a client-side Pages build.
#
# Two jobs:
#   test   runs the static gate (layout, skill-meta consistency, link-engine
#          self-test, grounding/bundle) headless under node. No lab, GPU, or
#          browser. Notebook EXECUTION tests need the lab and run there.
#   pages  builds the fully client-side static site and publishes it to GitLab
#          Pages, which serves it even on a private repo for an access-controlled
#          pre-release preview.

stages: [test, deploy]

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GIT_DEPTH: "20"

.with_python_node: &with_python_node
  image: node:20-bookworm-slim
  # The available instance runners are all tagged; untagged jobs match none of them.
  # `pages` is the Shared Pages Runner (a Docker runner) that picks these up.
  tags: [pages]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-pip ca-certificates >/dev/null
    # The materials vendorer needs these for the build-time pull + the live drift check; the
    # offline gate legs (validate_bundle's materials read) do not. Best-effort: if the install
    # fails, the pull is deps-guarded and falls back to the committed snapshots.
    - pip install --break-system-packages -q requests beautifulsoup4 markdownify lxml >/dev/null 2>&1 || true

test:
  <<: *with_python_node
  stage: test
  # Advisory gate: it reports, but a failure here never blocks the Pages deploy.
  allow_failure: true
  script:
    - python3 scripts/validate_layout.py --quiet
    - python3 scripts/skill_consistency.py
    - bash   scripts/run_engine.sh --self-test
    - python3 scripts/validate_bundle.py --scope ship
    # Live materials drift check: re-fetch the on-demand sources and compare to the committed
    # fingerprints. allow_failure keeps a drift/outage from blocking the deploy; it surfaces as a
    # red (complaining) job here, and as the materials section on the validator screen.
    - python3 scripts/pull_materials.py --check
  artifacts:
    when: always
    name: "gate-$CI_COMMIT_SHORT_SHA"
    paths:
      - docs/validation/
    expire_in: 30 days

pages:
  <<: *with_python_node
  stage: deploy
  needs: ["test"]
  script:
    - bash scripts/build_pages.sh public
  artifacts:
    paths:
      - public
  rules:
    # Run on the default branch (when this is its own extracted standalone repo) or on
    # nemoclaw-only (when the course is served from the shared s-fx-43-v1 repo, whose
    # default branch is the full bundle). GitLab Pages serves the latest pages artifact.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "nemoclaw-only"'
