# GitHub Pages for the "Building Agents" course: run the static gate, then build ./public
# and deploy to Pages. The link engine runs headless under node; no lab, GPU, or browser
# is needed in CI.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materials vendoring deps (for the live drift check)
        run: pip install requests beautifulsoup4 markdownify lxml
      - name: Static gate (layout, skill-meta, link-engine self-test, grounding)
        run: |
          python3 scripts/validation/validate_layout.py --quiet
          python3 scripts/skills/skill_consistency.py
          bash    scripts/runtime/run_engine.sh --self-test
          python3 scripts/validation/validate_bundle.py --scope ship
      - name: Materials drift check (advisory; complains on drift, never blocks the deploy)
        continue-on-error: true
        run: python3 scripts/materials/pull_materials.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: docs/validation/
          if-no-files-found: ignore

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materials vendoring deps (for the build-time pull)
        run: pip install requests beautifulsoup4 markdownify lxml
      - name: Build the client-side static site
        run: bash scripts/build/build_pages.sh public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
