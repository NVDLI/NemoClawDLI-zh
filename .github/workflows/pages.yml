# GitHub Pages for the "Building Agents" course: run the static gate, then build ./public
# and deploy to Pages. The link engine runs headless under node; no lab, GPU, or browser
# is needed in CI.
name: pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materials vendoring deps (for the live drift check)
        run: pip install requests beautifulsoup4 markdownify lxml
      - name: Static gate (layout, skill-meta, link-engine self-test, grounding)
        run: |
          python3 scripts/validation/validate_layout.py --quiet
          python3 scripts/skills/skill_consistency.py
          python3 scripts/skills/skill_contract.py
          python3 scripts/validation/ci_storage_audit.py
          python3 scripts/validation/branch_preview_manifest_audit.py --self-test
          python3 scripts/validation/learner_flow_audit.py --self-test
          python3 scripts/build/assemble_locale_overlay.py --self-test
          python3 scripts/validation/localization_audit.py --self-test
          python3 scripts/validation/localization_audit.py --locale pt-BR
          python3 scripts/validation/contribution_safety_audit.py --self-test
          python3 scripts/validation/contribution_safety_audit.py --report docs/validation/contribution-safety.json
          python3 scripts/compliance/source_gate.py
          python3 scripts/security/audit_python_dependencies.py
          python3 scripts/security/audit_vulnerability_waivers.py
          python3 scripts/build/package_release.py --self-test
          bash    scripts/runtime/run_engine.sh --self-test
          python3 scripts/validation/validate_bundle.py --scope ship
      - name: Pull request submission contract
        if: github.event_name == 'pull_request'
        env:
          CONTRIBUTION_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/validation/contribution_safety_audit.py --submission-env CONTRIBUTION_BODY
      - name: Materials drift check (advisory; complains on drift, never blocks the deploy)
        continue-on-error: true
        run: python3 scripts/materials/pull_materials.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: docs/validation/
          if-no-files-found: ignore

  build-and-deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify external publication approval
        run: python3 scripts/validation/contribution_safety_audit.py --require-publication-approved
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materials vendoring deps (for the build-time pull)
        run: pip install requests beautifulsoup4 markdownify lxml
      - name: Build the client-side static site
        run: bash scripts/build/build_pages.sh public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
