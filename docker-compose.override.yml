# ── Dev override: build images from source AND redirect the shared 'dli'
# ── volume to a bind-mount on the host repo root.  The base docker-compose.yml
# ── declares `dli` as a regular named volume; here we replace its driver
# ── with a local bind so dev edits propagate live to both lab and openclaw
# ── without any image rebuild.  In production this override is absent and
# ── `dli` is a normal named volume that lab seeds from its baked-in content.

volumes:
  dli:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}

services:

  # During development we want to build our Docker image from relevant
  # Dockerfiles, as opposed to pulling it from a repository somewhere.

  lab:
    build:
      # Context is the repo root so the image seeds the whole release: the browser
      # course under web/, the shared services under cpu/, and the surface hubs.
      # .dockerignore keeps the context lean (excludes secrets and generated bundles).
      context: .
      dockerfile: workspace/Dockerfile
    ## In dev, run the bind-mounted entrypoint instead of the baked image
    ## copy. Lets us edit `workspace/entrypoint.sh` and pick up the change
    ## with `docker compose restart lab`, no image rebuild required.
    entrypoint: ["/sandbox/dli/workspace/entrypoint.sh"]
    ports:
      - "${RAG_LAB_PORT:-8889}:8888"
    ## IN DEV MODE: Grant docker host access.
    ## NOTE: env_file is NOT set here, because API keys live only in llm_client. The lab
    ## reaches the LLM via http://llm_client:9000/v1 without direct key access.
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      ## The dli:/sandbox/dli:rw mount lives in the base docker-compose.yml.
      ## In dev mode, the 'dli' named volume is redirected to ${PWD} via
      ## driver_opts above, so no per-service bind mount is needed here.
      - /var/run/docker.sock:/var/run/docker.sock
    ## GPU passthrough is kept out of this override so the stack starts on any
    ## host; enable it with a GPU compose overlay when the NVIDIA runtime is present.

  # Single sandboxed gateway, reached as both `openclaw` and `openshell` via a
  # network alias in the base docker-compose.yml.
  openclaw:
    build:
      context: cpu/services/openclaw
      dockerfile: openclaw_shell.Dockerfile
      args:
        OPENCLAW_VERSION: 2026.5.28
    ## Dev-only host port. In prod openclaw is internal-only (base compose has
    ## no ports); students reach it via the token-gated nginx /openclaw route.
    ports:
      - "${OPENCLAW_HOST_PORT:-8995}:8995"
    ## No per-service /sandbox/dli mount is needed here, since it comes from the 'dli'
    ## named volume declared in base docker-compose.yml, which the override
    ## above redirects to a host bind mount of ${PWD} for live edits.

  nginx:
    ports:
      - "${DEV_NGINX_PORT:-80}:80"

  docker_router:
    build: 
      context: cpu/services/docker_router
      dockerfile: Dockerfile

  llm_client:
    build:
      context: cpu/services/llm_client
      dockerfile: llm_client.Dockerfile
    ## Dev-only host port for localhost debugging. Prod is internal-only
    ## (base compose has no ports); browser access is via nginx /api/llm/.
    ports:
      - "${LLM_CLIENT_PORT:-9000}:9000"
    env_file:
      - .env-dev
    environment:
      # Auto-enable Anthropic extended thinking for Bedrock-routed Claude
      # calls when the caller did not specify reasoning. This is the lever
      # that surfaces `reasoning_content` through the openclaw gateway
      # path (the gateway forwards `model=bedrock-proxy/...` without
      # propagating its own `thinking=adaptive` config into the body).
      # Set to "low" for dev so notebooks see reasoning by default;
      # production should override to "" (empty) to keep the old behavior.
      - LLM_CLIENT_BEDROCK_DEFAULT_REASONING=low

  # Dev overlay for the sandbox-admin control plane. Volumes and env shared with
  # prod live in docker-compose.yml; here we add the build context, the dev-only
  # host port (so the lab Jupyter can hit it on localhost:8099 for ad-hoc
  # debugging), and the dev auth token plus target container name. The prod
  # overlay uses an image: tag and reads SANDBOX_ADMIN_TOKEN /
  # SANDBOX_TARGET_CONTAINER from the deployment secrets file.
  sandbox-admin:
    build:
      ## Broader context so the Dockerfile can COPY the openclaw policy YAML.
      ## See cpu/services/sandbox_admin/Dockerfile for the COPY instruction.
      context: cpu/services
      dockerfile: sandbox_admin/Dockerfile
    environment:
      - SANDBOX_ADMIN_TOKEN=dli-openclaw-token
      - SANDBOX_TARGET_CONTAINER=${COMPOSE_PROJECT_NAME:-task1}-openclaw-1
    volumes:
      ## Dev-only: live-edit the sandbox policy without rebuilding.
      - ./cpu/services/openclaw:/policy:rw
    ports:
      - "${SANDBOX_ADMIN_PORT:-8099}:8099"
    restart: unless-stopped
