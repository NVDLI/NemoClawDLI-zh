<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="page-role" content="tool">
  <title>link-graph · course stack</title>
  <style>
    /* Chrome palette converged onto the course tokens (the values _shared.js and the framer use), so the
     link-graph matches the SKILL pages it sits beside; the viz-only colors (--ok/--dead/...) stay.
     Light theme flips the chrome on the shared data-theme + localStorage contract. */
    :root {
      --bg: #0d0d0d;
      --panel: #161616;
      --line: #2a2a2a;
      --tf: #f2f2f2;
      --mut: #b0b0b0;
      --g: #76b900;
      --gs: #8a8a8a;
      --ok: #3fb950;
      --dead: #f85149;
      --iso: #d29922;
      --cross: #a371f7;
      --cyc: #58a6ff;
      --stray: #ff7b72;
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --line: #e1e6eb;
      --tf: #1a1a1a;
      --mut: #57606a;
      --g: #76b900;
      --gs: #57606a;
      color-scheme: light;
    }

    @media(prefers-color-scheme:light) {
      :root:not([data-theme="dark"]):not([data-theme="light"]) {
        --bg: #ffffff;
        --panel: #f6f8fa;
        --line: #e1e6eb;
        --tf: #1a1a1a;
        --mut: #57606a;
        --g: #76b900;
        --gs: #57606a;
        color-scheme: light;
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
      color: var(--tf);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
    }

    /* Shared topbar matching the framer SKILL pages: NVIDIA DLI logo, up-link, crumb, theme toggle. */
    .sx-topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: .7rem clamp(1rem, 4vw, 2rem);
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    .sx-topbar .sx-logo {
      font-weight: 700;
      color: var(--g);
      letter-spacing: .04em;
      text-decoration: none
    }

    .sx-topbar .sx-up {
      color: var(--mut);
      text-decoration: none
    }

    .sx-topbar .sx-up:hover {
      color: var(--tf)
    }

    .sx-topbar .sx-crumb {
      color: var(--mut)
    }

    .sx-topbar .sx-theme {
      margin-left: auto;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      background: transparent;
      color: var(--mut);
      border: 1px solid var(--line);
      border-radius: 7px
    }

    #wrap {
      flex: 1;
      min-height: 0;
      display: flex
    }

    #side {
      width: 368px;
      flex: 0 0 368px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
      padding: 12px 13px 48px
    }

    #side h1 {
      font-size: 15px;
      margin: 0 0 2px;
      color: var(--tf)
    }

    #side .sub {
      color: var(--mut);
      font-size: 11px;
      margin-bottom: 10px;
      word-break: break-all
    }

    .stat {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px
    }

    .stat b {
      font-weight: 700
    }

    .pill {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700
    }

    .clean {
      background: rgba(63, 185, 80, .15);
      color: var(--ok)
    }

    .issues {
      background: rgba(248, 81, 73, .15);
      color: var(--dead)
    }

    .ctl {
      margin: 9px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: var(--bg)
    }

    .ctl h4 {
      margin: 0 0 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--mut)
    }

    .row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin: 3px 0
    }

    label.ck {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      cursor: pointer;
      color: var(--tf)
    }

    button,
    select,
    input {
      font: inherit;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--tf);
      border-radius: 6px;
      padding: 5px 8px
    }

    button {
      cursor: pointer
    }

    button:hover {
      border-color: var(--g);
      color: var(--tf)
    }

    button.go {
      background: var(--g);
      color: #000;
      font-weight: 700;
      border-color: var(--g)
    }

    button.go:hover {
      filter: brightness(1.12)
    }

    select,
    input {
      width: 100%
    }

    .row select,
    .row input {
      flex: 1 1 0;
      width: auto;
      min-width: 0
    }

    /* sit beside the label, not below it */
    .row>span {
      flex: 0 0 auto;
      color: var(--mut);
      font-size: 11px
    }

    #search {
      margin: 2px 0
    }

    details {
      margin-top: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden
    }

    summary {
      cursor: pointer;
      padding: 7px 10px;
      font-weight: 700;
      background: var(--line);
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px
    }

    summary::-webkit-details-marker {
      display: none
    }

    .cnt {
      font-size: 11px;
      padding: 0 7px;
      border-radius: 9px
    }

    .lst {
      max-height: 240px;
      overflow: auto
    }

    .item {
      padding: 5px 10px;
      border-top: 1px solid var(--line);
      cursor: pointer;
      font-size: 11px;
      word-break: break-all
    }

    .item:hover {
      background: var(--line)
    }

    .item.sel {
      background: rgba(88, 166, 255, .16);
      border-left: 2px solid var(--cyc);
      padding-left: 8px
    }

    .item .arr {
      color: var(--mut)
    }

    .item .b {
      color: var(--cross)
    }

    .item .why {
      color: var(--mut);
      font-size: 10.5px;
      display: block;
      margin-top: 1px
    }

    #legend {
      margin-top: 11px;
      font-size: 10.5px;
      color: var(--mut)
    }

    #legend span {
      display: inline-flex;
      align-items: center;
      margin-right: 9px
    }

    #legend i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px
    }

    #stage {
      flex: 1;
      position: relative;
      overflow: hidden
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab
    }

    #tip {
      position: absolute;
      pointer-events: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 11.5px;
      max-width: 380px;
      display: none;
      z-index: 5;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .5)
    }

    #tip .c {
      color: var(--mut)
    }

    #detail {
      border: 1px solid var(--ok);
      border-radius: 8px;
      padding: 9px 10px;
      margin: 9px 0;
      background: var(--panel);
      display: none
    }

    #detail h4 {
      margin: 0 0 5px;
      color: var(--tf);
      font-size: 12px;
      word-break: break-all
    }

    #detail .kv {
      font-size: 11px;
      margin: 2px 0;
      color: var(--tf)
    }

    #detail .kv span {
      color: var(--mut)
    }

    #detail .verdict {
      font-weight: 700;
      margin: 4px 0;
      padding: 3px 7px;
      border-radius: 6px;
      display: inline-block
    }

    #detail ul {
      margin: 4px 0;
      padding-left: 16px
    }

    #detail li {
      font-size: 10.5px;
      word-break: break-all;
      cursor: pointer
    }

    #detail li:hover {
      color: var(--tf)
    }

    #hint {
      position: absolute;
      left: 10px;
      bottom: 8px;
      color: var(--mut);
      font-size: 11px;
      z-index: 5
    }

    #banner {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11.5px;
      z-index: 6;
      display: none
    }
  </style>

        <h4>Compute · no python needed</h4>
        <div class="row">

      </div>

      <div class="ctl">

        <div class="row"><span style="font-size:11px;color:var(--mut)">course</span>

        </div>
        <div class="row"><span style="font-size:11px;color:var(--mut)">colour by</span>
          <select id="colorby">

            <option value="reach">SKILL reachability</option>
            <option value="component">component</option>

        </div>
        <div class="row">
          <label class="ck"><input type="checkbox" id="hide-strays"> hide strays</label>
          <label class="ck"><input type="checkbox" id="hide-iso"> hide isolated</label>
        </div>
        <div class="row">
          <label class="ck"><input type="checkbox" id="hide-assets" checked> hide assets</label>
          <label class="ck"><input type="checkbox" id="only-issues"> only issue nodes</label>
        </div>
        <div class="row">
          <label class="ck"><input type="checkbox" id="hide-bridges"
              title="Hide cross-cluster bridge edges (a node linking two course clusters) and drop them from the force, so clusters separate">
            hide bridges</label>
          <label class="ck"><input type="checkbox" id="mat-links"
              title="Overlay mats as nodes and link each page to the mats it shares a citation URL with (visualization + gravity). Off by default.">
            mat links</label>
        </div>
      </div>

      <div id="detail"></div>
      <div id="conn"></div>
      <div id="lists"></div>
      <div id="legend"></div>
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="tip"></div>
      <div id="banner"></div>
      <div id="hint">scroll = zoom · drag bg = pan · drag node = move · click node = explain · click list = focus</div>
    </div>
  </div>

    // ════════════════════════════════════════════════════════════════════════
    // The viewer no longer carries its own resolver: engine.js (loaded above) is the SINGLE
    // engine for resolution + graph + reachability, shared verbatim with CI (node) and the
    // browser here. The viewer only gathers the file tree + page texts (crawl/fetchText below)
    // and hands a cache-backed IO adapter to LinkEngine. One engine, no second logic to drift.
    const SKIP_DIR = /^(\.|__pycache__|node_modules|export|standalone|_paper_cache|repos_index|docstore_index|artifacts|skills-seed|generated_images|sample_videos|_offloaded_tracks|dist|build|venv|composer|validation)$/;
    const PAGE_RE = /\.(html?|md|ipynb)$/i;
    const CRAWL_TOP = ["web", "cpu", "docs", "scripts"];   // matches engine.iterPages (mats now recurse under web/)


    async function capi(path) {
      const u = (path ? ("/lab/api/contents/" + path) : "/lab/api/contents") + "?content=1";
      const r = await fetch(u, { credentials: "same-origin", cache: "no-store" }); if (!r.ok) throw new Error(r.status + " " + path);
      return r.json();
    }
    async function crawl(roots, onProg) {
      const files = []; const q = [...roots]; const seen = new Set();
      while (q.length) {
        const d = q.shift(); if (seen.has(d)) continue; seen.add(d);
        let j; try { j = await capi(d); } catch (e) { continue; }
        if (j.type !== "directory") continue;
        for (const it of (j.content || [])) {
          const nm = it.name;
          if (it.type === "directory") { if (!SKIP_DIR.test(nm)) q.push(it.path); }
          else if (PAGE_RE.test(nm)) files.push(it.path);
        }
        onProg && onProg(seen.size, files.length);
      }
      return files;
    }
    async function fetchText(path) {
      // Force RAW text: jupytext registers .md as a notebook, so a plain content=1 returns
      // parsed notebook JSON (cells[]), not markdown, so the link regexes find NOTHING and every
      // .md page looks edge-less. type=file&format=text bypasses the format handler.
      try {
        const r = await fetch("/lab/api/contents/" + path + "?content=1&type=file&format=text", { credentials: "same-origin", cache: "no-store" });
        if (r.ok) { const j = await r.json(); if (typeof j.content === "string") return j.content; }
      } catch (e) { }
      // fallback: if the server still hands back a notebook object, stitch its cell sources
      try {
        const j = await capi(path); const c = j.content;
        if (typeof c === "string") return c;
        if (c && Array.isArray(c.cells))
          return c.cells.map(x => Array.isArray(x.source) ? x.source.join("") : (x.source || "")).join("\n\n");
      } catch (e) { }
      return "";
    }

    async function liveAnalyze(onProg) {
      onProg("crawling…");
      // Crawl exactly the engine's roots (web/cpu/docs/scripts + root files; mats recurse under web/), load the
      // page texts plus the config files the resolver replays, then run the SINGLE engine on the
      // cache. Resolution, edges, dead links, and reachability are all engine.js, so the live view
      // is byte-identical to CI. No second analyzer to drift.
      const files = await crawl(CRAWL_TOP, (d, f) => onProg(`crawled ${d} dirs · ${f} pages`));
      try { const rootList = await capi(""); for (const it of (rootList.content || [])) if (it.type !== "directory" && PAGE_RE.test(it.name)) files.push(it.name); } catch (e) { }
      const cache = new Map(), pageset = new Set(files);
      const BATCH = 12; let done = 0;
      for (let i = 0; i < files.length; i += BATCH) {
        const slice = files.slice(i, i + BATCH);
        const texts = await Promise.all(slice.map(fetchText));
        slice.forEach((p, k) => cache.set(p, texts[k]));
        done += slice.length; onProg(`analyzed ${done}/${files.length} pages`);
      }
      // config the engine's resolver replays: nginx routes, extra_static_paths, compose topology
      for (const cf of ["nginx.conf", "docker-compose.yml", "docker-compose.override.yml", "workspace/entrypoint.sh"]) {
        try { cache.set(cf, await fetchText(cf)); } catch (e) { cache.set(cf, ""); }
      }
      const io = {
        root: "",
        read: (rel) => cache.has(rel) ? cache.get(rel) : null,
        exists: (rel) => pageset.has(rel) || cache.has(rel),
        walk: () => files.slice()
      };
      const proj = new LinkEngine.Projection(io);
      const data = LinkEngine.graphJson(proj);
      data.base = "(live crawl · engine.js)";
      return data;
    }

    // ── controls ──────────────────────────────────────────────────────────────
    function banner(msg) {
      const b = document.getElementById("banner"); b.textContent = msg; b.style.display = "block";
      clearTimeout(b._t); b._t = setTimeout(() => b.style.display = "none", 2200);
    }
    document.getElementById("search").addEventListener("input", e => { F.search = e.target.value.toLowerCase().trim(); hl = null; kick(); });
    document.getElementById("course-filter").addEventListener("change", e => { F.course = e.target.value; kick(); });
    document.getElementById("colorby").addEventListener("change", e => { F.colorby = e.target.value; kick(); });
    document.getElementById("hide-strays").addEventListener("change", e => { F.hideStrays = e.target.checked; kick(); });
    document.getElementById("hide-iso").addEventListener("change", e => { F.hideIso = e.target.checked; kick(); });
    document.getElementById("hide-assets").addEventListener("change", e => { F.hideAssets = e.target.checked; kick(); });
    document.getElementById("only-issues").addEventListener("change", e => { F.onlyIssues = e.target.checked; kick(); });
    document.getElementById("hide-bridges").addEventListener("change", e => { F.hideBridges = e.target.checked; kick(.45); });
    document.getElementById("mat-links").addEventListener("change", e => { F.matLinks = e.target.checked; kick(.7); });
    // Theme toggle: shared data-theme + localStorage contract; re-read the label colour and repaint.
    (function () {
      var b = document.querySelector(".sx-theme"); if (!b) return; var root = document.documentElement;
      function cur() { return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
      function paint() { var t = cur(); b.textContent = t === "light" ? "☾" : "☀"; b.title = t === "light" ? "Switch to dark theme" : "Switch to light theme"; }
      b.addEventListener("click", function () {
        var n = cur() === "light" ? "dark" : "light"; root.setAttribute("data-theme", n);
        try { localStorage.setItem("theme", n); } catch (e) { } paint(); refreshTheme(); kick();
      });
      paint();
    })();
    document.getElementById("btn-recompute").addEventListener("click", () => { computeTopology(); renderAll(); kick(1); banner("recomputed connectivity + relayout"); });
    document.getElementById("btn-fit").addEventListener("click", () => { fit(); kick(); });
    document.getElementById("btn-rescan").addEventListener("click", async () => {
      const st = document.getElementById("scan-status"); const btn = document.getElementById("btn-rescan");
      btn.disabled = true; const t0 = Date.now();
      try {
        const fresh = await liveAnalyze(msg => { st.textContent = msg; });
        DATA = fresh; build(); renderCourseFilter(); renderAll(); fit(); kick(1);
        st.textContent = `✓ live: ${DATA.nodes.length} pages · ${DATA.edges.length} links · dead ${DATA.issues.dead.length} · cross ${DATA.issues.cross_course.length} · ${((Date.now() - t0) / 1000).toFixed(1)}s`;
        banner("rescanned the live lab, found no python");
      } catch (e) { st.textContent = "✗ live crawl unavailable (" + e.message + "). Open this in the lab; using embedded data"; }
      finally { btn.disabled = false; }
    });

    build(); renderCourseFilter(); renderAll(); resize(); fit(); kick(1);
    // auto-rescan on load when served from the lab, so the default view is the LIVE truth.
    // never a stale embedded snapshot. Falls back silently to the embedded data when offline.
    (async () => { try { await capi(""); document.getElementById("btn-rescan").click(); } catch (e) { } })();
  </script>
</body>
