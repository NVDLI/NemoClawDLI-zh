  <p>A translation of this course is a <code>translate-&lt;lang&gt;</code> branch (the first is
     <code>translate-pt</code>) that overlays the source: the reader-facing prose under
     <code>web/</code> is rendered in the target language, and the code, assets, and every

     every build, gate, and deploy that runs on the source runs on the translation too.</p>
  <p>The sync abstraction is one marker, <a href="translation_base.json">translation_base.json</a>,
     recording the source commit the translation reflects. <a href="translation_status.py">translation_status.py</a>
     diffs the source against it and splits the change into a re-translate list (prose) and a
     merge-verbatim list (code, assets, the contract). Validate with
     <code>validate_bundle.py --scope ship --lang &lt;code&gt;</code>, which skips the English-prose
     style suites while the structural suites still gate.</p>
  <p>Read <a href="README.md">README.md</a> for the full process.</p>
