eight="41.5" rx="8" fill="var(--gfx-tint-green,#e6f3d4)" stroke="var(--gfx-green,#4a7a00)" stroke-width="1.6"/><text x="360" y="345.05" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="var(--gfx-green,#4a7a00)" text-anchor="middle" font-weight="700">a way out</text><text x="360" y="359.55" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="var(--gfx-sub,#5e5e5e)" text-anchor="middle">an outbound channel</text><circle cx="360" cy="220" r="42" fill="var(--gfx-red,#d1242f)" fill-opacity="0.95"/><text x="360" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="var(--gfx-bg,#ffffff)" text-anchor="middle" font-weight="800">BREACH</text><text x="360" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="var(--gfx-bg,#ffffff)" text-anchor="middle">all three</text></svg>
