<!-- @article{weng2023agent,
  title    = "LLM-powered Autonomous Agents",
  author   = "Weng, Lilian",
  journal  = "lilianweng.github.io",
  year     = "2023",
  month    = "Jun",
  url      = "https://lilianweng.github.io/posts/2023-06-23-agent/",
  abstract = "(No formal abstract: Adding beginning and end of blog for context) Building agents with LLM (large language model) as its core controller is a cool concept. Several proof-of-concepts demos, such as AutoGPT, GPT-Engineer and BabyAGI, serve as inspiring examples. The potentiality of LLM extends beyond generating well-written copies, stories, essays and programs; it can be framed as a powerful general problem solver. Agent System Overview. In a LLM-powered autonomous agent system, LLM functions as the agent’s brain, complemented by several key components. (1) Planning branches into (a) Subgoal and decomposition: The agent breaks down large tasks into smaller, manageable subgoals, enabling efficient handling of complex tasks; (b) Reflection and refinement: The agent can do self-criticism and self-reflection over past actions, learn from mistakes and refine them for future steps, thereby improving the quality of final results. (2) Memory branches into (a) Short-term memory: I would consider all the in-context learning (See Prompt Engineering) as utilizing short-term memory of the model to learn; (b) Long-term memory: This provides the agent with the capability to retain and recall (infinite) information over extended periods, often by leveraging an external vector store and fast retrieval. (3) Tool Use: The agent learns to call external APIs for extra information that is missing from the model weights (often hard to change after pre-training), including current information, code execution capability, access to proprietary information sources and more. Challenges: After going through key ideas and demos of building LLM-centered agents, I start to see a couple common limitations: Finite context length: The restricted context capacity limits the inclusion of historical information, detailed instructions, API call context, and responses. The design of the system has to work with this limited communication bandwidth, while mechanisms like self-reflection to learn from past mistakes would benefit a lot from long or infinite context windows. Although vector stores and retrieval can provide access to a larger knowledge pool, their representation power is not as powerful as full attention. Challenges in long-term planning and task decomposition: Planning over a lengthy history and effectively exploring the solution space remain challenging. LLMs struggle to adjust plans when faced with unexpected errors, making them less robust compared to humans who learn from trial and error. Reliability of natural language interface: Current agent system relies on natural language as an interface between LLMs and external components such as memory and tools. However, the reliability of model outputs is questionable, as LLMs may make formatting errors and occasionally exhibit rebellious behavior (e.g. refuse to follow an instruction). Consequently, much of the agent demo code focuses on parsing model output.",
} -->
<svg viewBox="0 0 940 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Faithful replication of Lilian Weng's original agent architecture blueprint." style="max-width:100%; background:#0d0d0d; border:1px solid #2a2a2a; border-radius:8px; padding:10px 0;">
  <defs>
    <!-- Sharp, modern arrowheads matching the code-theme context -->
    <marker id="arr-forward" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,5 L0,9 Z" fill="#6a6a6a"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7,5 L0,9 Z" fill="#76b900"/>
    </marker>
  </defs>

  <!-- ==================== CORE STRUCTURAL BACKBONE ==================== -->
  
  <!-- CENTER: THE CORE AGENT ENGINE (Highlighted Pink Replacement) -->
  <rect x="415" y="180" width="90" height="45" rx="4" fill="#112511" stroke="#76b900" stroke-width="2"/>
  <text x="460" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#aee23a" font-weight="700">Agent</text>

  <!-- TOP: MAIN MEMORY CONTROLLER -->
  <rect x="415" y="95" width="90" height="42" rx="4" fill="#161616" stroke="#444444" stroke-width="1.5"/>
  <text x="460" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Memory</text>

  <!-- BOTTOM: ACTION HUB -->
  <rect x="415" y="265" width="90" height="42" rx="4" fill="#161616" stroke="#444444" stroke-width="1.5"/>
  <text x="460" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Action</text>

  <!-- LEFT: TOOLS ROUTER -->
  <rect x="280" y="180" width="85" height="45" rx="4" fill="#161616" stroke="#444444" stroke-width="1.5"/>
  <text x="322" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Tools</text>

  <!-- RIGHT: PLANNING CONTROLLER -->
  <rect x="555" y="180" width="90" height="45" rx="4" fill="#161616" stroke="#444444" stroke-width="1.5"/>
  <text x="600" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Planning</text>


  <!-- ==================== HIGHER-LEVEL SUB-FORKS & LEAVES ==================== -->

  <!-- TOP FORK: MEMORY TYPES -->
  <rect x="260" y="30" width="160" height="36" rx="4" fill="#161616" stroke="#444444" stroke-width="1.5"/>
  <text x="340" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Short-term memory</text>

  <rect x="480" y="30" width="160" height="36" rx="4" fill="#161616" stroke="#444444" stroke-width="1.5"/>
  <text x="560" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Long-term memory</text>

  <!-- LEFT STACK: EXECUTABLE TOOLS -->
  <!-- Calendar() -->
  <rect x="40" y="86" width="170" height="32" rx="4" fill="#111111" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="55" y="107" font-family="ui-monospace, monospace" font-size="12.5" fill="#aee23a" font-weight="600">Calendar()</text>
  
  <!-- Calculator() -->
  <rect x="40" y="136" width="170" height="32" rx="4" fill="#111111" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="55" y="157" font-family="ui-monospace, monospace" font-size="12.5" fill="#aee23a" font-weight="600">Calculator()</text>

  <!-- CodeInterpreter() -->
  <rect x="40" y="186" width="170" height="32" rx="4" fill="#111111" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="55" y="207" font-family="ui-monospace, monospace" font-size="12.5" fill="#aee23a" font-weight="600">CodeInterpreter()</text>

  <!-- Search() -->
  <rect x="40" y="236" width="170" height="32" rx="4" fill="#111111" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="55" y="257" font-family="ui-monospace, monospace" font-size="12.5" fill="#aee23a" font-weight="600">Search()</text>

  <!-- ...more -->
  <rect x="40" y="286" width="170" height="32" rx="4" fill="#111111" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="70" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#888888">...more</text>

  <!-- RIGHT STACK: PLANNING MECHANISMS -->
  <rect x="710" y="140" width="190" height="32" rx="4" fill="#161616" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="725" y="161" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Reflection</text>

  <rect x="710" y="186" width="190" height="32" rx="4" fill="#161616" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="725" y="207" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Self-critics</text>

  <rect x="710" y="233" width="190" height="32" rx="4" fill="#161616" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="725" y="254" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Chain of thoughts</text>

  <rect x="710" y="280" width="190" height="32" rx="4" fill="#161616" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="725" y="301" font-family="Arial, sans-serif" font-size="13" fill="#e6e6e6">Subgoal decomposition</text>


  <!-- ==================== SOLID CONNECTIONS & PIPELINES ==================== -->
  
  <!-- Core Backbone Arrows -->
  <line x1="460" y1="175" x2="460" y2="144" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="460" y1="230" x2="460" y2="259" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="410" y1="202" x2="371" y2="202" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="510" y1="202" x2="549" y2="202" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>

  <!-- Top Memory Splitter Pipeline -->
  <path d="M 460 95 L 460 82 L 340 82 L 340 68" fill="none" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <path d="M 460 82 L 560 82 L 560 68" fill="none" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>

  <!-- Left Tools Bus & Distribution Forks -->
  <line x1="280" y1="202" x2="242" y2="202" stroke="#6a6a6a" stroke-width="1.5"/>
  <line x1="242" y1="102" x2="242" y2="302" stroke="#6a6a6a" stroke-width="1.5"/>
  <line x1="242" y1="102" x2="216" y2="102" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="242" y1="152" x2="216" y2="152" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="242" y1="202" x2="216" y2="202" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="242" y1="252" x2="216" y2="253" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="242" y1="302" x2="216" y2="302" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>

  <!-- Right Planning Bus & Distribution Forks -->
  <line x1="645" y1="202" x2="678" y2="202" stroke="#6a6a6a" stroke-width="1.5"/>
  <line x1="678" y1="156" x2="678" y2="296" stroke="#6a6a6a" stroke-width="1.5"/>
  <line x1="678" y1="156" x2="704" y2="156" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="678" y1="202" x2="704" y2="202" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="678" y1="250" x2="704" y2="250" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>
  <line x1="678" y1="296" x2="704" y2="296" stroke="#6a6a6a" stroke-width="1.5" marker-end="url(#arr-forward)"/>


  <!-- ==================== DASHED SECONDARY SIGNAL PATHS ==================== -->
  
  <!-- Memory Context Feedback Loops (Dashed lines to Planning & Reflection) -->
  <path d="M 505 116 L 600 116 L 600 174" fill="none" stroke="#6a6a6a" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arr-forward)"/>
  <path d="M 586 116 L 752 116 L 752 136" fill="none" stroke="#6a6a6a" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arr-forward)"/>

