<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="page-role" content="tool"/>
<title>Studio · 安全智能体</title>
<link rel="stylesheet" href="styles/_style.css"/>
<style>
:root{--studio-side:20rem;--studio-editor:30rem;--studio-top:3.25rem;--studio-min-control:2.25rem}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--sans)}
button,input,select,textarea{font:inherit}
.studio-topbar{height:var(--studio-top);display:flex;align-items:center;gap:.55rem;padding:0 max(1rem,calc((100vw - min(92rem,100%))/2));border-bottom:1px solid var(--bd);background:var(--bg);position:relative;z-index:20;overflow-x:auto;overflow-y:hidden;scrollbar-gutter:stable;overscroll-behavior-x:contain}.studio-topbar>*{flex-shrink:0}
.tb-brand{font-weight:800;color:var(--g);white-space:nowrap}.tb-brand span{color:var(--tx);font-weight:650}.tb-sep{width:1px;height:1.55rem;background:var(--bd);flex:0 0 auto}.tb-spacer{flex:1 0 1rem;min-width:1rem}.tb-select,.tb-input{height:var(--studio-min-control);border:1px solid var(--bd);border-radius:7px;background:var(--e1);color:var(--tx);padding:0 .65rem;flex:0 0 auto}.tb-select{width:clamp(10rem,18vw,16rem)}.tb-input{width:clamp(12rem,28vw,30rem)}.tb-btn{height:var(--studio-min-control);min-width:3.25rem;flex:0 0 auto;border:1px solid var(--bd);border-radius:7px;background:var(--e2);color:var(--td);padding:0 .7rem;cursor:pointer;white-space:nowrap}.tb-btn:hover{border-color:var(--g);color:var(--gs);background:var(--e3)}.tb-btn.active{background:var(--g);border-color:var(--g);color:#0a0a0a;font-weight:750}.tb-status{font-family:var(--mono);font-size:.75rem;color:var(--tf);white-space:nowrap;flex:0 0 auto;min-width:max-content}.tb-status.ok{color:var(--gs)}.tb-status.warn{color:var(--warn)}
.studio-layout{height:calc(100vh - var(--studio-top));display:flex;min-height:0}.studio-sidebar{width:var(--studio-side);min-width:min(16rem,72vw);max-width:82vw;flex:0 0 auto;border-right:1px solid var(--bd);background:var(--e1);display:flex;min-height:0;transition:width .16s ease}.studio-sidebar.collapsed{width:0;min-width:0;border-right:0;overflow:hidden}.sb-scroll{flex:1;overflow:auto;padding:.8rem;display:flex;flex-direction:column;gap:.75rem;min-height:0}.sb-section{border:1px solid var(--bd);border-radius:8px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;min-height:2.1rem;flex:0 0 auto}.sb-head{min-height:2.1rem;display:flex;align-items:center;gap:.5rem;padding:.45rem .7rem;background:var(--e2);border-bottom:1px solid var(--bd);font-size:.78rem;font-weight:800;color:var(--tx);cursor:pointer;flex:0 0 auto}.sb-head .badge{margin-left:auto;min-width:1.4rem;text-align:center;border-radius:999px;background:var(--g);color:#0a0a0a;font-family:var(--mono);font-size:.68rem;padding:.05rem .35rem}.sb-body{padding:.7rem;display:flex;flex-direction:column;gap:.65rem;min-height:0}.sb-body.hidden{display:none}.sb-note,.empty-hint{font-size:.76rem;color:var(--tf);line-height:1.45}.sb-row,.tog{display:flex;align-items:center;gap:.55rem;font-size:.8rem;color:var(--td);min-width:0}.tog-label{flex:1;min-width:0}.tog-sw{position:relative;width:2.1rem;height:1.1rem;cursor:pointer;flex:0 0 auto}.tog-sw input{display:none}.tog-track{position:absolute;inset:0;border-radius:999px;background:var(--e3);border:1px solid var(--bd)}.tog-thumb{position:absolute;top:.18rem;left:.18rem;width:.74rem;height:.74rem;border-radius:50%;background:var(--td);transition:left .14s,background .14s}.tog-sw input:checked~.tog-track{border-color:var(--g);background:rgba(118,185,0,.2)}.tog-sw input:checked~.tog-thumb{left:1.16rem;background:var(--g)}.sb-row input[type=number]{width:4.2rem;min-width:4.2rem;border:1px solid var(--bd);border-radius:6px;background:var(--e1);color:var(--tx);padding:.25rem .45rem}.sb-btn{min-height:2rem;flex:0 0 auto;border:1px solid var(--bd);border-radius:7px;background:var(--e2);color:var(--td);padding:.45rem .6rem;cursor:pointer;font-weight:700}.sb-btn:hover{border-color:var(--g);color:var(--gs)}.sb-btn.primary{background:var(--g);border-color:var(--g);color:#0a0a0a}.sb-btn:disabled{opacity:.45;cursor:default}#cmt-list,#ref-list,#test-list,#chg-list{min-height:7rem;max-height:clamp(7rem,30vh,20rem);overflow-y:auto;overscroll-behavior:contain;padding-right:.15rem}.cmt-item,.chg-item,.ref-item{border:1px solid var(--bd);border-radius:7px;padding:.55rem .6rem;background:var(--e1);font-size:.76rem}.cmt-item.done{opacity:.58;border-color:var(--tf)}.cmt-text,.chg-label{color:var(--td);line-height:1.4}.cmt-meta,.chg-diff,.ref-meta{display:flex;justify-content:space-between;gap:.5rem;color:var(--tf);font-size:.7rem;margin-top:.25rem}.cmt-resolve{border:0;background:transparent;color:var(--gs);cursor:pointer;font-weight:800}.chg-item{display:flex;gap:.5rem}.chg-item input{margin-top:.18rem}.ref-item a{display:block;text-decoration:none;color:var(--gs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ref-kind{font-family:var(--mono);text-transform:uppercase;font-size:.65rem;color:var(--tf)}.test-item{border:1px solid var(--bd);border-radius:7px;padding:.55rem .6rem;background:var(--e1);font-size:.76rem}.test-name{font-weight:800;color:var(--td);margin-bottom:.2rem}.test-desc{color:var(--tf);line-height:1.35;margin-bottom:.45rem}.test-cmd{display:block;max-width:100%;overflow:auto;white-space:nowrap;color:var(--gs);font-family:var(--mono);font-size:.68rem;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:.35rem}.test-copy{margin-top:.45rem;border:1px solid var(--bd);border-radius:6px;background:var(--e2);color:var(--td);padding:.3rem .5rem;cursor:pointer;font-size:.72rem}.test-copy:hover{border-color:var(--g);color:var(--gs)}
.studio-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}#studio-frame{flex:1;width:100%;height:100%;border:0;background:var(--bg)}.loading-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,13,13,.7);color:var(--td);font-family:var(--mono);z-index:15}.pick-overlay{position:absolute;inset:0;z-index:12;cursor:crosshair;background:rgba(118,185,0,.04);border:2px dashed var(--g);display:none}.pick-hint{position:absolute;top:.75rem;left:50%;transform:translateX(-50%);background:var(--g);color:#0a0a0a;font-weight:800;border-radius:999px;padding:.35rem .8rem;font-size:.78rem;white-space:nowrap}
.block-editor{width:0;flex:0 0 auto;overflow:hidden;border-left:1px solid var(--bd);background:var(--e1);display:flex;flex-direction:column;transition:width .16s ease}.block-editor.open{width:min(var(--studio-editor),42vw)}.be-header{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;border-bottom:1px solid var(--bd);background:var(--e2)}.be-badge{border:1px solid var(--bd);border-radius:6px;color:var(--gs);font-family:var(--mono);font-size:.68rem;padding:.1rem .4rem;text-transform:uppercase}.be-path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tf);font-family:var(--mono);font-size:.72rem}.be-close{border:0;background:transparent;color:var(--td);font-size:1.2rem;cursor:pointer}.be-editor-wrap{flex:1;min-height:0}.be-editor-wrap textarea{width:100%;height:100%;resize:none;border:0;outline:0;background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:.78rem;line-height:1.5;padding:.85rem}.be-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.6rem .7rem;border-top:1px solid var(--bd);background:var(--e2)}.be-btn{border:1px solid var(--bd);border-radius:7px;background:var(--e3);color:var(--td);padding:.4rem .65rem;cursor:pointer}.be-btn:hover{border-color:var(--g);color:var(--gs)}.be-btn.primary{background:var(--g);border-color:var(--g);color:#0a0a0a;font-weight:800}.be-btn.danger{border-color:var(--err);color:var(--err)}.be-spacer{flex:1}.be-msg{min-height:1.65rem;padding:.35rem .7rem;border-top:1px solid var(--bd);color:var(--tf);font-family:var(--mono);font-size:.72rem;background:var(--bg)}.be-msg.ok{color:var(--gs)}.be-msg.err{color:var(--err)}
.studio-pop{display:none;position:fixed;z-index:9999;background:var(--e1);border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 38px rgba(0,0,0,.45);padding:.8rem;width:min(20rem,calc(100vw - 2rem));font-size:.82rem}.studio-pop textarea{width:100%;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);padding:.5rem;resize:vertical}.pop-anchor{font-size:.75rem;color:var(--tf);margin-bottom:.45rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pop-actions{display:flex;gap:.5rem;margin-top:.55rem}.pop-actions button{flex:1;border:1px solid var(--bd);border-radius:7px;background:var(--e2);color:var(--td);padding:.4rem}.pop-actions button.primary{background:var(--g);border-color:var(--g);color:#0a0a0a;font-weight:800}
:root[data-theme="light"] .tb-btn.active,:root[data-theme="light"] .sb-btn.primary,:root[data-theme="light"] .be-btn.primary,:root[data-theme="light"] .pop-actions button.primary{color:#fff}
:root[data-theme="light"] .be-btn.danger{color:var(--err);border-color:var(--err)}
@media(max-width:900px){.tb-input{display:none}.tb-status{display:none}.studio-sidebar{width:17rem;min-width:min(15rem,78vw)}.block-editor.open{position:absolute;right:0;top:0;bottom:0;width:min(30rem,92vw);z-index:30}.studio-layout{position:relative}}
</style>
</head>
<body>
<div class="studio-topbar">
  <div class="tb-brand">Studio <span>安全智能体</span></div>
  <a class="tb-btn" href="localization.html">语言</a>
  <div class="tb-sep"></div>
  <select id="mod-sel" class="tb-select"><option value="">模块</option></select>
  <input id="url-bar" class="tb-input" type="text" placeholder="01a-loop.html"/>
  <button class="tb-btn" id="reload-btn" title="重新加载当前页面">重新加载</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="sidebar-btn" title="显示或隐藏侧边栏">侧边栏</button>
  <button class="tb-btn" id="comment-btn" title="添加定位批注">批注</button>
  <button class="tb-btn" id="edit-btn" title="切换编辑模式">编辑</button>
  <button class="tb-btn" id="run-btn" title="运行本页代码单元">全部运行</button>
  <button class="tb-btn" id="block-edit-btn" title="检查内容块">内容块</button>
  <button class="tb-btn" id="lite-btn" title="切换浅色导出样式">浅色</button>
  <div class="tb-spacer"></div>
  <span class="tb-status" id="tb-status">选择模块</span>
</div>
<main class="studio-layout">
  <aside class="studio-sidebar" id="sidebar"><div class="sb-scroll">
    <div class="sb-section"><div class="sb-head" data-sec="refresh">刷新</div><div class="sb-body" id="sec-refresh">
      <div class="tog"><span class="tog-label">轮询文件变更</span><label class="tog-sw"><input type="checkbox" id="poll-on"/><span class="tog-track"></span><span class="tog-thumb"></span></label></div>
      <div class="sb-row"><span>间隔</span><input type="number" id="poll-secs" value="8" min="3" max="300"/><span>s</span></div>
      <div class="sb-note" id="lm-row">尚未检查写入权限。</div><button class="sb-btn" id="jump-btn" disabled>跳转到变更处</button>
    </div></div>
    <div class="sb-section"><div class="sb-head" data-sec="comments">批注 <span class="badge" id="cmt-badge" style="display:none">0</span></div><div class="sb-body" id="sec-comments"><div id="cmt-list"><div class="empty-hint">本页暂无批注。</div></div><button class="sb-btn primary" id="add-cmt-btn">添加定位批注</button></div></div>
    <div class="sb-section"><div class="sb-head" data-sec="refs">参考资料</div><div class="sb-body" id="sec-refs"><div id="ref-list"><div class="empty-hint">加载页面后即可检查引用。</div></div></div></div>
    <div class="sb-section"><div class="sb-head" data-sec="run">运行</div><div class="sb-body" id="sec-run"><div class="tog"><span class="tog-label">加载后自动运行</span><label class="tog-sw"><input type="checkbox" id="autorun-on"/><span class="tog-track"></span><span class="tog-thumb"></span></label></div><div class="tog"><span class="tog-label">注解输出</span><label class="tog-sw"><input type="checkbox" id="autoannotate-on"/><span class="tog-track"></span><span class="tog-thumb"></span></label></div><div class="sb-note" id="run-note">尚未运行</div></div></div>
    <div class="sb-section"><div class="sb-head" data-sec="tests">测试</div><div class="sb-body" id="sec-tests"><div class="sb-note">复制用于静态环境、浏览器容器和实验环境栈的验证命令。</div><div id="test-list"><div class="empty-hint">正在加载测试命令。</div></div></div></div>
    <div class="sb-section"><div class="sb-head" data-sec="edit">编辑</div><div class="sb-body" id="sec-edit"><div class="tog"><span class="tog-label">编辑文本和代码</span><label class="tog-sw"><input type="checkbox" id="editmode-on"/><span class="tog-track"></span><span class="tog-thumb"></span></label></div><div class="sb-note" id="write-note">静态预览为只读；需要 Jupyter contents API 才能写入。</div><div id="chg-list"><div class="empty-hint">暂无待保存的编辑。</div></div><button class="sb-btn primary" id="save-sel-btn" disabled>保存已勾选项</button></div></div>
  </div></aside>
  <div class="studio-main" id="smain"><div class="loading-overlay" id="loading" style="display:none">正在加载</div><div class="pick-overlay" id="pick-ov"><div class="pick-hint">点击元素以定位批注</div></div><iframe id="studio-frame"></iframe></div>
  <div class="block-editor" id="block-editor"><div class="be-header"><span class="be-badge html" id="be-badge">html</span><span class="be-path" id="be-path">在框架中点击一个内容块</span><button class="be-close" id="be-close" title="关闭">x</button></div><div class="be-editor-wrap" id="be-editor-wrap"><textarea id="be-ta" spellcheck="false"></textarea></div><div class="be-actions"><button class="be-btn primary" id="be-apply">应用</button><button class="be-btn" id="be-save">保存文件</button><button class="be-btn" id="be-revert">撤销</button><div class="be-spacer"></div><button class="be-btn danger" id="be-close2">关闭</button></div><div class="be-msg" id="be-msg"></div></div>
</main>
<div id="studio-pop" class="studio-pop"><div id="pop-anchor" class="pop-anchor"></div><textarea id="pop-ta" rows="4" placeholder="批注"></textarea><div class="pop-actions"><button id="pop-save" class="primary">保存</button><button id="pop-cancel">取消</button></div></div>
<script type="module" src="scripts/studio_main.js"></script>
</body>
</html>
