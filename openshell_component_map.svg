<svg viewBox="0 0 900 740" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>OpenShell component map — local WSL2+Docker deployment</title>
  <desc>Architecture diagram: Browser on Windows, proxy/gateway services in WSL2, openshell-sandbox container with isolated and default namespaces (OpenClaw gateway, gRPC API, Squid, OPA, openshell_router), and integrate.api.nvidia.com outside the Docker network</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="var(--border-color,#999)"/>
    </marker>
    <marker id="arr-dashed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="var(--border-color,#bbb)"/>
    </marker>
    <marker id="arr-left" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════════
       LAYER 1 — WINDOWS HOST
  ══════════════════════════════════════════════════════ -->
  <rect x="15" y="15" width="870" height="68" rx="8"
        fill="none" stroke="var(--border-color,#ccc)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="28" y="31" font-family="ui-monospace,monospace" font-size="10" font-weight="700"
        fill="var(--text-secondary,#52514e)">WINDOWS HOST</text>
  <rect x="370" y="35" width="160" height="34" rx="5"
        fill="var(--accent-secondary,#e8f0fe)" stroke="var(--accent,#4a6fa5)" stroke-width="1.2"/>
  <text x="450" y="57" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">Browser</text>

  <!-- ══════════════════════════════════════════════════════
       LAYER 2 — WSL2 HOST PROCESS SPACE
  ══════════════════════════════════════════════════════ -->
  <rect x="15" y="98" width="870" height="195" rx="8"
        fill="none" stroke="var(--border-color,#ccc)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="28" y="114" font-family="ui-monospace,monospace" font-size="10" font-weight="700"
        fill="var(--text-secondary,#52514e)">WSL2 HOST PROCESS SPACE</text>

  <!-- http.server -->
  <rect x="30" y="120" width="140" height="52" rx="5"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1.2"/>
  <text x="100" y="138" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">http.server</text>
  <text x="100" y="153" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">course pages</text>
  <text x="100" y="165" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">WSL2 :8081</text>

  <!-- cors_proxy.py -->
  <rect x="185" y="120" width="148" height="52" rx="5"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1.2"/>
  <text x="259" y="138" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">cors_proxy.py</text>
  <text x="259" y="153" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">NVIDIA NIM CORS bridge</text>
  <text x="259" y="165" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">WSL2 :8010</text>

  <!-- openclaw_proxy.py -->
  <rect x="348" y="120" width="168" height="52" rx="5"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1.2"/>
  <text x="432" y="138" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">openclaw_proxy.py</text>
  <text x="432" y="153" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">OpenClaw gateway CORS</text>
  <text x="432" y="165" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">WSL2 :8011</text>

  <!-- policy_proxy.py -->
  <rect x="530" y="120" width="155" height="52" rx="5"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1.2"/>
  <text x="607" y="138" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">policy_proxy.py</text>
  <text x="607" y="153" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">live policy bridge</text>
  <text x="607" y="165" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">WSL2 :8012</text>

  <text x="380" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="var(--text-secondary,#888)">↑ all four started by start_proxies.sh</text>

  <!-- openshell forward service (LEFT) -->
  <rect x="30" y="200" width="265" height="70" rx="5"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1.2"/>
  <text x="162" y="219" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">openshell forward service</text>
  <text x="162" y="234" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">gRPC tunnel (UI traffic path)</text>
  <text x="162" y="247" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">WSL2 :18789 → container isolated NS</text>

  <!-- openshell-docker-gateway (RIGHT) -->
  <rect x="600" y="200" width="265" height="70" rx="5"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1.2"/>
  <text x="732" y="219" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">openshell-docker-gateway</text>
  <text x="732" y="234" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">WSL2 management daemon</text>
  <text x="732" y="247" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">polls container gRPC API via Docker bridge</text>
  <text x="732" y="261" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="var(--text-secondary,#888)">(NOT the OpenClaw gateway)</text>

  <!-- ══════════════════════════════════════════════════════
       LAYER 3 — DOCKER NETWORK + CONTAINER
  ══════════════════════════════════════════════════════ -->
  <rect x="15" y="308" width="870" height="370" rx="8"
        fill="none" stroke="var(--accent,#4a6fa5)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="28" y="324" font-family="ui-monospace,monospace" font-size="10" font-weight="700"
        fill="var(--text-secondary,#52514e)">openshell-docker  (Docker custom bridge network · br-XXXX · 172.18.x.x/16)</text>

  <!-- Container boundary -->
  <rect x="35" y="334" width="840" height="334" rx="8"
        fill="none" stroke="var(--border-color,#bbb)" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="48" y="350" font-family="ui-monospace,monospace" font-size="10" font-weight="700"
        fill="var(--text-secondary,#52514e)">openshell-sandbox container  (openshell-my-assistant-{uuid})</text>

  <!-- OpenClaw gateway — isolated namespace -->
  <rect x="50" y="360" width="295" height="295" rx="6"
        fill="var(--accent-secondary,#e8f0fe)" stroke="var(--accent,#4a6fa5)" stroke-width="1.2"/>
  <text x="197" y="378" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">OpenClaw gateway</text>
  <text x="197" y="393" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">isolated network namespace</text>
  <text x="197" y="408" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">0.0.0.0:18789  (inside namespace)</text>
  <text x="197" y="428" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">• runs the agent loop</text>
  <text x="197" y="443" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">• GetInferenceBundle / GetSandboxConfig</text>
  <text x="197" y="458" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="var(--text-secondary,#888)">(one-time config at agent startup)</text>
  <text x="197" y="476" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">• routes tool calls → Squid</text>
  <text x="197" y="500" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="var(--text-secondary,#888)">UI path: reached via forward service</text>
  <text x="197" y="518" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="var(--text-secondary,#888)">also serves GetInferenceBundle to</text>
  <text x="197" y="533" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="var(--text-secondary,#888)">openshell_router via cross-NS socket</text>

  <!-- Default NS — gRPC API -->
  <rect x="365" y="360" width="210" height="65" rx="6"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1.2"/>
  <text x="470" y="378" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">gRPC API</text>
  <text x="470" y="393" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">default namespace · :8080</text>
  <text x="470" y="408" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">status / config / sandbox ops</text>
  <text x="470" y="420" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="var(--text-secondary,#888)">mgmt path: Docker bridge 172.18.x.x</text>

  <!-- Default NS — Squid proxy -->
  <rect x="365" y="478" width="210" height="65" rx="6"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1.2"/>
  <text x="470" y="496" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">Squid proxy</text>
  <text x="470" y="511" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">default namespace · 10.200.0.1:3128</text>
  <text x="470" y="526" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">enforces egress policy via OPA</text>
  <text x="470" y="538" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="#e06c00">⚠ iptables conntrack fix required</text>

  <!-- Default NS — OPA -->
  <rect x="365" y="558" width="210" height="55" rx="6"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="470" y="576" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">OPA</text>
  <text x="470" y="591" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">Open Policy Agent · default namespace</text>
  <text x="470" y="606" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">evaluates egress allow / deny verdicts</text>

  <!-- Default NS — openshell_router -->
  <rect x="595" y="360" width="255" height="145" rx="6"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1.2"/>
  <text x="722" y="378" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11"
        font-weight="700" fill="var(--text-primary,#0b0b0b)">openshell_router</text>
  <text x="722" y="393" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">default namespace</text>
  <text x="722" y="408" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">intercepts CONNECT inference.local:443</text>
  <text x="722" y="423" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">calls GetInferenceBundle per request</text>
  <text x="722" y="438" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="var(--text-secondary,#888)">(gets real API key via cross-NS socket)</text>
  <text x="722" y="456" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9"
        fill="var(--text-secondary,#52514e)">→ direct HTTPS to NVIDIA endpoint</text>
  <text x="722" y="496" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="#e06c00">⚠ needs iptables conntrack rule</text>

  <!-- ══════════════════════════════════════════════════════
       EXTERNAL — integrate.api.nvidia.com (outside Docker)
  ══════════════════════════════════════════════════════ -->
  <rect x="595" y="698" width="255" height="36" rx="5"
        fill="var(--surface-secondary,#f5f5f5)" stroke="var(--border-color,#aaa)" stroke-width="1"
        stroke-dasharray="3,2"/>
  <text x="722" y="719" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5"
        fill="var(--text-primary,#0b0b0b)">integrate.api.nvidia.com  (Internet)</text>

  <!-- ══════════════════════════════════════════════════════
       ARROWS
  ══════════════════════════════════════════════════════ -->

  <!-- Browser → http.server -->
  <line x1="390" y1="69" x2="170" y2="120"
        stroke="var(--border-color,#bbb)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-dashed)"/>
  <text x="263" y="87" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        fill="#2563eb">serves pages</text>

  <!-- Browser → openclaw_proxy.py -->
  <line x1="442" y1="69" x2="432" y2="120"
        stroke="var(--border-color,#999)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="460" y="98" font-family="ui-monospace,monospace" font-size="8.5" fill="#2563eb">HTTP/WS</text>

  <!-- Browser → cors_proxy (dashed) -->
  <line x1="415" y1="69" x2="310" y2="120"
        stroke="var(--border-color,#bbb)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-dashed)"/>

  <!-- Browser → policy_proxy (dashed) -->
  <line x1="470" y1="69" x2="607" y2="120"
        stroke="var(--border-color,#bbb)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-dashed)"/>

  <!-- openclaw_proxy → forward service -->
  <line x1="348" y1="150" x2="295" y2="210"
        stroke="var(--border-color,#999)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="298" y="176" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        fill="#2563eb">HTTP/WS</text>

  <!-- policy_proxy → openshell-docker-gateway -->
  <line x1="685" y1="163" x2="716" y2="200"
        stroke="var(--border-color,#bbb)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-dashed)"/>
  <text x="726" y="185" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8"
        font-style="italic" fill="var(--text-secondary,#888)">openshell policy get</text>

  <!-- forward service → OpenClaw gateway (near-straight down, UI path) -->
  <line x1="162" y1="270" x2="162" y2="300"
        stroke="var(--border-color,#999)" stroke-width="1.5"/>
  <line x1="162" y1="300" x2="197" y2="300"
        stroke="var(--border-color,#999)" stroke-width="1.5"/>
  <line x1="197" y1="300" x2="197" y2="360"
        stroke="var(--border-color,#999)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="295" font-family="ui-monospace,monospace" font-size="8.5"
        fill="#2563eb">gRPC :18789 (isolated NS) · UI path</text>

  <!-- openshell-docker-gateway → gRPC API (dashed, right to mid) -->
  <line x1="732" y1="270" x2="732" y2="288"
        stroke="var(--border-color,#bbb)" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="732" y1="288" x2="470" y2="288"
        stroke="var(--border-color,#bbb)" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="470" y1="288" x2="470" y2="360"
        stroke="var(--border-color,#bbb)" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-dashed)"/>
  <text x="604" y="283" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        font-style="italic" fill="#2563eb">Docker bridge :8080 · mgmt path</text>

  <!-- OpenClaw gateway → Squid (CONNECT) -->
  <line x1="345" y1="510" x2="365" y2="510"
        stroke="var(--border-color,#999)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="328" y="505" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5"
        fill="#2563eb">CONNECT</text>

  <!-- Squid → OPA -->
  <line x1="470" y1="543" x2="470" y2="558"
        stroke="var(--border-color,#999)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="510" y="554" font-family="ui-monospace,monospace" font-size="8.5"
        fill="#2563eb">consults</text>

  <!-- Squid → openshell_router (inference.local, after OPA allows) -->
  <line x1="575" y1="510" x2="595" y2="445"
        stroke="var(--border-color,#999)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="613" y="480" font-family="ui-monospace,monospace" font-size="8.5"
        fill="#2563eb">inference.local</text>

  <!-- openshell_router ◄──► OpenClaw gateway (cross-NS socket, GetInferenceBundle) -->
  <!-- Bi-directional: openshell_router sends request, OpenClaw gateway returns API key + endpoint -->
  <line x1="354" y1="450" x2="586" y2="450"
        stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4,2"/>
  <!-- Arrowhead at OpenClaw gateway end (left) — request direction -->
  <polygon points="345,450 354,445 354,455" fill="#7c3aed"/>
  <!-- Arrowhead at openshell_router end (right) — response direction -->
  <polygon points="595,450 586,445 586,455" fill="#7c3aed"/>
  <!-- Label -->
  <text x="470" y="442" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8"
        fill="#7c3aed">GetInferenceBundle (cross-NS socket)</text>
  <text x="470" y="461" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8"
        font-style="italic" fill="#7c3aed">◄── request · response (API key + endpoint) ──►</text>

  <!-- openshell_router → integrate.api.nvidia.com (exits Docker box) -->
  <line x1="722" y1="505" x2="722" y2="698"
        stroke="var(--border-color,#999)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="740" y="610" font-family="ui-monospace,monospace" font-size="8.5"
        fill="#2563eb">HTTPS</text>

</svg>
