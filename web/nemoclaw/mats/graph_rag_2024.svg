<!-- @misc{edge2025localglobalgraphrag,
  title={From Local to Global: A Graph RAG Approach to Query-Focused Summarization}, 
  author={Darren Edge and Ha Trinh and Newman Cheng and Joshua Bradley and Alex Chao and Apurva Mody and Steven Truitt and Dasha Metropolitansky and Robert Osazuwa Ness and Jonathan Larson},
  year={2025},
  eprint={2404.16130},
  archivePrefix={arXiv},
  primaryClass={cs.CL},
  url={https://arxiv.org/abs/2404.16130}, 
  abstract={The use of retrieval-augmented generation (RAG) to retrieve relevant information from an external knowledge source enables large language models (LLMs) to answer questions over private and/or previously unseen document collections. However, RAG fails on global questions directed at an entire text corpus, such as "What are the main themes in the dataset?", since this is inherently a query-focused summarization (QFS) task, rather than an explicit retrieval task. Prior QFS methods, meanwhile, do not scale to the quantities of text indexed by typical RAG systems. To combine the strengths of these contrasting methods, we propose GraphRAG, a graph-based approach to question answering over private text corpora that scales with both the generality of user questions and the quantity of source text. Our approach uses an LLM to build a graph index in two stages: first, to derive an entity knowledge graph from the source documents, then to pregenerate community summaries for all groups of closely related entities. Given a question, each community summary is used to generate a partial response, before all partial responses are again summarized in a final response to the user. For a class of global sensemaking questions over datasets in the 1 million token range, we show that GraphRAG leads to substantial improvements over a conventional RAG baseline for both the comprehensiveness and diversity of generated answers.}
} -->
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Graph RAG pipeline with clean paper-style representations</title>
  <desc id="desc">A cleaned Graph RAG pipeline figure with rounded boxes, arrows, backgrounded edge labels, and paper-style clip art for documents, chunks, entities, graph, communities, summaries, and answers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
        <style>
      .background{fill:#ffffff;}
      .box{stroke:#111;stroke-width:2.2;}
      .index{fill:#eaf2ff;}
      .query{fill:#e5f5e8;}
      .label{font-family:'Times New Roman',Times,serif;font-size:22px;text-anchor:middle;dominant-baseline:middle;fill:#111;}
      .stage{font-family:'Times New Roman',Times,serif;font-size:22px;font-style:italic;text-anchor:middle;dominant-baseline:middle;fill:#111;}
      .stage-title{font-family:'Times New Roman',Times,serif;font-size:22px;font-weight:bold;dominant-baseline:middle;fill:#111;}
      .edge{stroke:#222;stroke-width:1.85;fill:none;marker-end:url(#arrow);}
      .edge-label{font-family:'Times New Roman',Times,serif;font-size:15.5px;fill:#111;text-anchor:middle;dominant-baseline:middle;}
      .edge-back{fill:#ffffff;stroke:#b8b8b8;stroke-width:1.0;}
      .paper{fill:#fffdf8;stroke:#2b2b2b;stroke-width:1.5;}
      .paper-line{stroke:#756f61;stroke-width:1.35;stroke-linecap:round;opacity:0.7;}
      .blue{fill:#dbeaff;stroke:#2b2b2b;stroke-width:1.25;}
      .green{fill:#daf2df;stroke:#2b2b2b;stroke-width:1.25;}
      .gold{fill:#fff0bf;stroke:#2b2b2b;stroke-width:1.25;}
      .node{fill:#fffdf8;stroke:#222;stroke-width:1.35;}
      .graph-edge{stroke:#444;stroke-width:1.35;fill:none;opacity:0.85;}
      .small-text{font-family:'Times New Roman',Times,serif;font-size:11px;fill:#555;text-anchor:middle;}
      .pin{fill:#222;opacity:0.18;}
    </style>
  </defs>

  <rect class="background" x="0" y="0" width="1120" height="700"/>

  <!-- main pipeline: faithful two-column structure -->
  <rect class="box index" rx="8" ry="8" x="170" y="35" width="280" height="58"/>
  <text class="label" x="310" y="64">Source Documents</text>

  <rect class="box index" rx="8" ry="8" x="170" y="155" width="280" height="58"/>
  <text class="label" x="310" y="184">Text Chunks</text>

  <rect class="box index" rx="8" ry="8" x="170" y="275" width="280" height="58"/>
  <text class="label" x="310" y="304">Entities &amp; Relationships</text>

  <rect class="box index" rx="8" ry="8" x="170" y="395" width="280" height="58"/>
  <text class="label" x="310" y="424">Knowledge Graph</text>

  <rect class="box index" rx="8" ry="8" x="650" y="395" width="280" height="58"/>
  <text class="label" x="790" y="424">Graph Communities</text>

  <rect class="box index" rx="8" ry="8" x="650" y="275" width="280" height="58"/>
  <text class="label" x="790" y="304">Community Summaries</text>

  <rect class="box query" rx="8" ry="8" x="650" y="155" width="280" height="58"/>
  <text class="label" x="790" y="184">Community Answers</text>

  <rect class="box query" rx="8" ry="8" x="650" y="35" width="280" height="58"/>
  <text class="label" x="790" y="64">Global Answer</text>

  <rect class="box index" rx="8" ry="8" x="170" y="535" width="280" height="58"/>
  <text class="stage" x="310" y="564">Indexing Time</text>

  <rect class="box query" rx="8" ry="8" x="650" y="535" width="280" height="58"/>
  <text class="stage" x="790" y="564">Query Time</text>

  <text class="stage-title" x="482" y="564">Pipeline Stage</text>

  <!-- edges with clean label backgrounds -->
  <path class="edge" d="M310 95 L310 153"/>
  <rect class="edge-back" rx="7" ry="7" x="230" y="104" width="160" height="42"/>
  <text class="edge-label" x="310" y="117"><tspan x="310" dy="0">text extraction</tspan><tspan x="310" dy="18">and chunking</tspan></text>

  <path class="edge" d="M310 215 L310 273"/>
  <rect class="edge-back" rx="7" ry="7" x="221" y="224" width="178" height="42"/>
  <text class="edge-label" x="310" y="237"><tspan x="310" dy="0">domain-tailored</tspan><tspan x="310" dy="18">summarization</tspan></text>

  <path class="edge" d="M310 335 L310 393"/>
  <rect class="edge-back" rx="7" ry="7" x="221" y="344" width="178" height="42"/>
  <text class="edge-label" x="310" y="357"><tspan x="310" dy="0">domain-tailored</tspan><tspan x="310" dy="18">summarization</tspan></text>

  <path class="edge" d="M452 424 L648 424"/>
  <rect class="edge-back" rx="7" ry="7" x="477" y="398" width="146" height="42"/>
  <text class="edge-label" x="550" y="411"><tspan x="550" dy="0">community</tspan><tspan x="550" dy="18">detection</tspan></text>

  <path class="edge" d="M790 393 L790 335"/>
  <rect class="edge-back" rx="7" ry="7" x="701" y="344" width="178" height="42"/>
  <text class="edge-label" x="790" y="357"><tspan x="790" dy="0">domain-tailored</tspan><tspan x="790" dy="18">summarization</tspan></text>

  <path class="edge" d="M790 273 L790 215"/>
  <rect class="edge-back" rx="7" ry="7" x="701" y="224" width="178" height="42"/>
  <text class="edge-label" x="790" y="237"><tspan x="790" dy="0">query-focused</tspan><tspan x="790" dy="18">summarization</tspan></text>

  <path class="edge" d="M790 153 L790 95"/>
  <rect class="edge-back" rx="7" ry="7" x="701" y="104" width="178" height="42"/>
  <text class="edge-label" x="790" y="117"><tspan x="790" dy="0">query-focused</tspan><tspan x="790" dy="18">summarization</tspan></text>

  <!-- left-side paper clip-art, centered beside corresponding stages -->
  <g transform="translate(46,31)">
    <rect class="paper" x="18" y="9" width="52" height="64" rx="4" transform="rotate(-6 44 41)"/>
    <rect class="paper" x="36" y="3" width="52" height="64" rx="4" transform="rotate(3 62 35)"/>
    <line class="paper-line" x1="45" y1="23" x2="75" y2="23"/><line class="paper-line" x1="45" y1="35" x2="78" y2="35"/><line class="paper-line" x1="45" y1="47" x2="68" y2="47"/>
    <polygon class="gold" points="76,3 88,15 76,15"/>
    <text class="small-text" x="56" y="88">source files</text>
  </g>

  <g transform="translate(41,153)">
    <rect class="paper" x="18" y="4" width="82" height="70" rx="5"/>
    <rect class="blue" x="29" y="15" width="60" height="10" rx="3"/>
    <rect class="blue" x="29" y="31" width="45" height="10" rx="3"/>
    <rect class="blue" x="29" y="47" width="55" height="10" rx="3"/>
    <text class="small-text" x="59" y="88">chunked text</text>
  </g>

  <g transform="translate(36,270)">
    <rect class="paper" x="16" y="12" width="94" height="76" rx="6"/>
    <path class="graph-edge" d="M39 34 L73 27 L89 58 L52 68 L39 34 M73 27 L52 68"/>
    <circle class="blue" cx="39" cy="34" r="8"/><circle class="green" cx="73" cy="27" r="8"/><circle class="node" cx="89" cy="58" r="8"/><circle class="blue" cx="52" cy="68" r="8"/>
    <text class="small-text" x="63" y="103">entities &amp; edges</text>
  </g>

  <g transform="translate(36,391)">
    <rect class="paper" x="15" y="10" width="96" height="82" rx="6"/>
    <path class="graph-edge" d="M36 41 L62 24 L91 40 L80 70 L50 73 L36 41 M62 24 L80 70 M91 40 L50 73"/>
    <circle class="blue" cx="36" cy="41" r="7"/><circle class="green" cx="62" cy="24" r="7"/><circle class="node" cx="91" cy="40" r="7"/><circle class="blue" cx="80" cy="70" r="7"/><circle class="green" cx="50" cy="73" r="7"/>
    <rect class="gold" x="26" y="82" width="37" height="10" rx="3"/>
    <text class="small-text" x="63" y="106">graph index</text>
  </g>

  <!-- right-side paper clip-art, centered beside corresponding stages -->
  <g transform="translate(948,31)">
    <rect class="paper" x="8" y="5" width="92" height="72" rx="6"/>
    <path class="gold" d="M54 14 L62 35 L85 35 L66 48 L73 69 L54 57 L35 69 L42 48 L23 35 L46 35 Z"/>
    <line class="paper-line" x1="28" y1="83" x2="80" y2="83"/>
    <text class="small-text" x="54" y="99">global answer</text>
  </g>

  <g transform="translate(946,151)">
    <rect class="paper" x="10" y="8" width="94" height="72" rx="6"/>
    <rect class="green" x="22" y="21" width="58" height="18" rx="8"/>
    <rect class="blue" x="38" y="47" width="54" height="18" rx="8"/>
    <circle class="green" cx="86" cy="24" r="4"/><circle class="blue" cx="30" cy="62" r="4"/>
    <text class="small-text" x="57" y="96">community answers</text>
  </g>

  <g transform="translate(948,270)">
    <rect class="paper" x="18" y="10" width="76" height="78" rx="5" transform="rotate(2 56 49)"/>
    <line class="paper-line" x1="30" y1="28" x2="78" y2="28"/><line class="paper-line" x1="30" y1="41" x2="70" y2="41"/><line class="paper-line" x1="30" y1="54" x2="82" y2="54"/>
    <rect class="green" x="31" y="66" width="44" height="11" rx="3"/>
    <text class="small-text" x="57" y="103">summaries</text>
  </g>

  <g transform="translate(942,390)">
    <rect class="paper" x="14" y="11" width="100" height="84" rx="6"/>
    <ellipse class="blue" cx="47" cy="46" rx="24" ry="18"/>
    <ellipse class="green" cx="80" cy="44" rx="24" ry="18"/>
    <ellipse class="gold" cx="65" cy="69" rx="24" ry="18"/>
    <circle class="node" cx="40" cy="44" r="4"/><circle class="node" cx="54" cy="52" r="4"/><circle class="node" cx="78" cy="38" r="4"/><circle class="node" cx="88" cy="51" r="4"/><circle class="node" cx="61" cy="69" r="4"/><circle class="node" cx="73" cy="76" r="4"/>
    <text class="small-text" x="64" y="109">communities</text>
  </g>

  <!-- small, non-overlapping transition sketch under the cross-column edge -->
  <g transform="translate(488,454)">
    <rect class="paper" x="0" y="0" width="124" height="54" rx="6"/>
    <path class="graph-edge" d="M23 28 L43 15 L61 29 L45 42 L23 28"/>
    <path class="graph-edge" d="M75 27 L95 15 L109 38 L83 42 L75 27"/>
    <circle class="blue" cx="23" cy="28" r="5.5"/><circle class="blue" cx="43" cy="15" r="5.5"/><circle class="blue" cx="61" cy="29" r="5.5"/>
    <circle class="green" cx="75" cy="27" r="5.5"/><circle class="green" cx="95" cy="15" r="5.5"/><circle class="green" cx="109" cy="38" r="5.5"/>
    <line class="paper-line" x1="68" y1="9" x2="68" y2="45"/>
    <text class="small-text" x="62" y="70">partitioned graph</text>
  </g>
</svg>