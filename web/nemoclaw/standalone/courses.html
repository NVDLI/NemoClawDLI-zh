<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Securing Agents</title>
<style>
/* ─── nemoclaw web shared stylesheet ──────────────────────────── */
:root {
  --g:   #76b900;
  --gd:  #4a7a00;
  --gs:  #aee23a;
  --bg:  #0d0d0d;
  --e1:  #161616;
  --e2:  #1e1e1e;
  --e3:  #262626;
  --bd:  #2a2a2a;
  --tx:  #f2f2f2;
  --td:  #b0b0b0;
  --tf:  #6a6a6a;
  --acc: #3b82f6;
  --err: #ef4444;
  --r:   8px;
  --mono: ui-monospace, "SF Mono", Consolas, "Cascadia Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: #0d0d0d;
  background: var(--bg);
  color: #f2f2f2;
  color: var(--tx);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Top bar ────────────────────────────────────────────────────────────────── */
/* Minimal: brand on the left, key-pill on the right, nothing in between.
 * All in-course navigation lives in the journey-map widget below this bar.
 * Contents centre over `main`'s fluid width on wide screens via the
 * max(gutter, fill) padding pattern. */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center;
  height: 52px;
  padding-left:  max(28px, calc((100vw - min(71.25rem, 100%)) / 2));
  padding-right: max(28px, calc((100vw - min(71.25rem, 100%)) / 2));
  background: #0d0d0d;
  background: var(--bg);
  border-bottom: 1px solid #2a2a2a;
  border-bottom-color: var(--bd);
}
.topbar .logo {
  flex-shrink: 0;
  font-weight: 700; font-size: 1rem;
  color: #76b900; color: var(--g);
  text-decoration: none; white-space: nowrap;
  letter-spacing: .01em;
}
.topbar .logo:hover { color: var(--gs); }
/* The <nav> slot is intentionally empty (see buildNav). It still serves as the
 * flex spacer that pushes the key-pill to the right edge. */
.topbar nav { flex: 1; min-width: 0; }
.topbar .spacer { flex: 0 0 auto; min-width: 8px; }
#py-mode-topbar-container { display: flex; align-items: center; flex-shrink: 0; margin-right: 12px; }
.topbar .key-pill {
  flex-shrink: 0;
  font-size: .78rem; font-family: var(--mono);
  padding: 5px 12px;
  border-radius: 999px; border: 1px solid #2a2a2a; border-color: var(--bd);
  color: #6a6a6a; color: var(--tf); cursor: pointer;
  background: transparent;
  transition: color .15s, border-color .15s;
}
.topbar .key-pill:hover { color: var(--td); border-color: var(--tf); }
.topbar .key-pill.set { color: #aee23a; color: var(--gs); border-color: #4a7a00; border-color: var(--gd); }

@media (max-width: 640px) {
  .topbar { height: 48px; }
  .topbar .logo { font-size: .9rem; }
}

/* ── Page layout ─────────────────────────────────────────────────────────────── */
main { max-width: min(71.25rem, 100%); margin: 0 auto; padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem) 100px; }
.hero { margin-bottom: 48px; }
.hero .eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: #76b900; color: var(--g); font-weight: 700; margin-bottom: .4em; }
.hero h1 { font-size: 2.2rem; line-height: 1.2; font-weight: 800; margin-bottom: .6em; color: #f2f2f2; color: var(--tx); }
.hero h1 span { color: #76b900; color: var(--g); }
.hero .lead { font-size: 1.05rem; color: #b0b0b0; color: var(--td); line-height: 1.7; }

h2 { font-size: 1.3rem; font-weight: 700; margin: 2.5em 0 .8em; color: #f2f2f2; color: var(--tx); }
h3 { font-size: 1.05rem; font-weight: 600; margin: 1.8em 0 .6em; color: #aee23a; color: var(--gs); }
p { margin: .7em 0; color: #b0b0b0; color: var(--td); }
p strong { color: #f2f2f2; color: var(--tx); }
a { color: #76b900; color: var(--g); }
ul, ol { margin: .6em 0 .6em 1.4em; color: #b0b0b0; color: var(--td); }
li { margin: .3em 0; }

/* ── Inline code chips in prose ─────────────────────────────────────────────
   Any <code> not inside a <pre> block gets a subtle chip: green text on a
   dark background with light padding so identifiers stand out in running
   prose. <pre><code> blocks (highlight.js) are unaffected. */
:not(pre) > code {
  background: #1a1a1a;
  padding: 1px 6px;
  border-radius: 3px;
  color: var(--gs);
  font-family: var(--mono);
  font-size: .88em;
  border: 1px solid #2a2a2a;
}
a > code { color: inherit; }

/* ── Code cells ─────────────────────────────────────────────────────────────── */
.cell {
  margin: 1.6em 0;
  border: 1px solid #2a2a2a; border-color: var(--bd);
  border-radius: var(--r);
  overflow: hidden;
  background: #161616; background: var(--e1);
}
.cell-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  background: #1e1e1e; background: var(--e2);
  border-bottom: 1px solid #2a2a2a; border-bottom-color: var(--bd);
}
.cell-label { font-size: .72rem; font-family: var(--mono); color: #6a6a6a; color: var(--tf); text-transform: uppercase; letter-spacing: .08em; }
.cell-run {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 14px; border-radius: 6px;
  background: #76b900; background: var(--g);
  color: #000; font-size: .8rem; font-weight: 700;
  border: none; cursor: pointer;
}
.cell-run:hover { background: #aee23a; background: var(--gs); }
.cell-run:disabled { background: #262626; background: var(--e3); color: #6a6a6a; color: var(--tf); cursor: not-allowed; }
.cell pre {
  margin: 0; padding: 16px;
  font-family: var(--mono); font-size: .82rem; line-height: 1.55;
  overflow-x: auto;
  background: transparent;
  color: #f2f2f2; color: var(--tx);
}
.cell-output {
  border-top: 1px solid #2a2a2a; border-top-color: var(--bd);
  padding: 14px 16px;
  font-family: var(--mono); font-size: .82rem; line-height: 1.55;
  color: #b0b0b0; color: var(--td);
  white-space: pre-wrap; word-break: break-word;
  min-height: 40px; max-height: 500px; overflow-y: auto;
  background: #161616; background: var(--e1);
}
.cell-output.empty { color: #6a6a6a; color: var(--tf); font-style: italic; }
.cell-output.error { color: #ef4444; color: var(--err); }
.cell-output.streaming { color: #f2f2f2; color: var(--tx); }

/* ── Syntax highlighting (self-contained, needs no external CDN) ─────────── */
/* Base token color (anything hljs doesn't explicitly class) */
.hljs { background: transparent !important; padding: 0 !important; color: #abb2bf; }
.hljs-keyword,
.hljs-selector-tag   { color: #c792ea; }
.hljs-string,
.hljs-attr           { color: #c3e88d; }
.hljs-comment,
.hljs-quote          { color: #6a6a6a; font-style: italic; }
.hljs-title,
.hljs-function .hljs-title,
.hljs-title.function_{ color: #82aaff; }
.hljs-number,
.hljs-literal        { color: #f78c6c; }
.hljs-built_in,
.hljs-type           { color: #89ddff; }
.hljs-params,
.hljs-variable,
.hljs-template-variable { color: #a6accd; }
.hljs-operator,
.hljs-punctuation    { color: #89ddff; }
.hljs-meta           { color: #6a6a6a; }
.hljs-selector-class,
.hljs-selector-id    { color: #82aaff; }
.hljs-deletion       { color: #ef4444; }
.hljs-addition       { color: #c3e88d; }

/* ── Callout boxes ───────────────────────────────────────────────────────────── */
.callout {
  border-left: 3px solid #76b900; border-left-color: var(--g);
  background: rgba(118,185,0,.06);
  padding: 12px 16px; border-radius: 0 var(--r) var(--r) 0;
  margin: 1.4em 0; font-size: .9rem; color: #b0b0b0; color: var(--td);
}
.callout strong { color: #f2f2f2; color: var(--tx); }
.callout.warn { border-left-color: #f59e0b; background: rgba(245,158,11,.06); }
.callout.info { border-left-color: #3b82f6; border-left-color: var(--acc); background: rgba(59,130,246,.06); }

/* ── Module cards (index) ────────────────────────────────────────────────────── */
.module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  margin: 2em 0;
}
/* 4 cards in a row default to 3-up + 1 orphan on this page width. Force 2x2. */
.module-grid:has(> .module-card:nth-child(4):last-child) {
  grid-template-columns: repeat(2, 1fr);
}
@media (max-width: 640px) {
  .module-grid:has(> .module-card:nth-child(4):last-child) {
    grid-template-columns: 1fr;
  }
}
.module-card {
  display: block; padding: 22px 24px;
  background: #161616; background: var(--e1);
  border: 1px solid #2a2a2a; border-color: var(--bd);
  border-radius: var(--r); text-decoration: none;
}
.module-card:hover { border-color: #4a7a00; border-color: var(--gd); background: #1e1e1e; background: var(--e2); }
.module-card .num {
  font-size: .7rem; font-family: var(--mono); font-weight: 700;
  color: #76b900; color: var(--g); text-transform: uppercase; letter-spacing: .1em;
  margin-bottom: .4em;
}
.module-card h3 { margin: 0 0 .5em; font-size: 1rem; color: #f2f2f2; color: var(--tx); }
.module-card p { margin: 0; font-size: .84rem; color: #b0b0b0; color: var(--td); line-height: 1.5; }

/* ── Key setup panel ─────────────────────────────────────────────────────────── */
.key-panel {
  background: #161616; background: var(--e1);
  border: 1px solid #2a2a2a; border-color: var(--bd);
  border-radius: var(--r); padding: 28px 32px; margin: 2em 0;
}
.key-panel label { display: block; margin-bottom: .4em; font-size: .85rem; color: #b0b0b0; color: var(--td); }
.key-panel input {
  width: 100%; padding: 10px 14px;
  background: #1e1e1e; background: var(--e2);
  border: 1px solid #2a2a2a; border-color: var(--bd);
  border-radius: 6px;
  color: #f2f2f2; color: var(--tx);
  font-family: var(--mono); font-size: .9rem;
  outline: none;
  -webkit-appearance: none; appearance: none;
}
.key-panel input:focus { border-color: #76b900; border-color: var(--g); }
.key-panel .btn {
  margin-top: 12px; padding: 10px 24px;
  background: #76b900; background: var(--g);
  color: #000; font-weight: 700; font-size: .9rem;
  border: none; border-radius: 6px; cursor: pointer;
}
.key-panel .btn:hover { background: #aee23a; background: var(--gs); }
.key-panel .status { margin-top: 10px; font-size: .82rem; }
.key-panel .status.ok { color: #aee23a; color: var(--gs); }
.key-panel .status.err { color: #ef4444; color: var(--err); }

/* ── Cell prompt (editable input above Run button) ───────────────────────────── */
.cell-prompt {
  padding: 10px 14px 0;
  background: #161616; background: var(--e1);
  border-bottom: 1px solid #2a2a2a; border-bottom-color: var(--bd);
}
.cell-prompt label {
  display: block; font-size: .72rem;
  color: #6a6a6a; color: var(--tf);
  text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 5px; font-family: var(--mono);
}
.cell-prompt input,
.cell-prompt textarea {
  width: 100%;
  background: #1e1e1e; background: var(--e2);
  border: 1px solid #2a2a2a; border-color: var(--bd);
  border-radius: 4px;
  color: #f2f2f2; color: var(--tx);
  font-family: var(--mono); font-size: .85rem;
  padding: 7px 10px; outline: none; resize: vertical;
  -webkit-appearance: none; appearance: none;
}
.cell-prompt input:focus,
.cell-prompt textarea:focus { border-color: #76b900; border-color: var(--g); }

/* ── Diagrams (mermaid) ──────────────────────────────────────────────────────── */
.mermaid-wrap {
  margin: 1.6em auto;
  background: #1e1e1e; background: var(--e2);
  border: 1px solid #2a2a2a; border-color: var(--bd);
  border-radius: var(--r); padding: 20px;
  text-align: center;
}

/* ── Progress bar ────────────────────────────────────────────────────────────── */
.page-progress { display: flex; gap: 6px; margin: 2em 0 3em; }
.page-progress span { flex: 1; height: 3px; border-radius: 2px; background: #262626; background: var(--e3); }
.page-progress span.done { background: #76b900; background: var(--g); }
.page-progress span.active { background: #aee23a; background: var(--gs); }

/* ── Per-module References tail ─────────────────────────────────────────────── */
/* A small block at the bottom of every module page that lists the 3-5 papers
   / specs / blog posts that module directly builds on. Each entry: linked
   title + author/year + a one-line relevance note. Cross-links to the
   going-further hub for the comprehensive list. */
.references {
  margin: 3em 0 2em;
  padding-top: 1.4em;
  border-top: 1px solid var(--bd);
}
.references h3 {
  color: var(--gs);
  font-size: .82rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  font-weight: 700;
  margin: 0 0 .9em;
}
.references ul { margin: 0; padding-left: 22px; list-style: square; }
.references li { margin: .55em 0; color: var(--td); font-size: .92rem; line-height: 1.55; }
.references li a { color: var(--gs); text-decoration: none; font-weight: 600; }
.references li a:hover { text-decoration: underline; color: var(--g); }
.references li em { color: var(--tx); font-style: italic; }
.references-note {
  margin: 1.1em 0 0; font-size: .82rem; color: var(--tf);
}
.references-note a { color: var(--gs); }

/* ── Footer nav ─────────────────────────────────────────────────────────────── */
.foot-nav {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 4em; padding-top: 2em;
  border-top: 1px solid #2a2a2a; border-top-color: var(--bd);
}
.foot-nav a {
  padding: 10px 22px; border-radius: 6px;
  border: 1px solid #2a2a2a; border-color: var(--bd);
  color: #b0b0b0; color: var(--td);
  text-decoration: none; font-size: .88rem;
  background: transparent;
}
.foot-nav a:hover { border-color: #76b900; border-color: var(--g); color: #76b900; color: var(--g); }
.foot-nav a.next {
  background: #76b900; background: var(--g);
  color: #000; font-weight: 700;
  border-color: transparent;
}
.foot-nav a.next:hover { background: #aee23a; background: var(--gs); }

@media(max-width:640px) {
  main { padding: 24px 16px 80px; }
  .hero h1 { font-size: 1.6rem; }
  .topbar { padding: 0 14px; gap: 10px; }
  .topbar nav a { padding: 5px 8px; font-size: .75rem; }
}



/* ── mountCanvasFlow: canvas at top, code panels below ─────────────────────── */
.cf-wrap {
  background:
    radial-gradient(circle at 20% 0%, rgba(118,185,0,0.04) 0%, transparent 50%),
    #0a0a0a;
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 14px 16px 16px;
  margin: 1.4em 0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.cf-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 10px;
}
.cf-label {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: .76rem; color: var(--gs);
  text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
}
.cf-actions { display: flex; gap: 8px; }

/* Kernel indicator: only visible in Python mode; shows which kernel this
   canvas claims for its Python cells. */
.cf-kernel-indicator {
  display: none;
  font-family: var(--mono);
  font-size: .72rem;
  color: #c4b5fd;
  padding: 3px 8px;
  border: 1px solid rgba(130,80,223,.3);
  border-radius: 4px;
  background: rgba(130,80,223,.06);
}
body.python-mode .cf-kernel-indicator { display: inline-block; }
body.python-mode .cf-kernel-indicator:empty::before {
  content: "no kernel yet";
  color: var(--tf);
}

/* Reset-kernel button: only visible in Python mode */
.cf-btn-reset-kernel { display: none; }
body.python-mode .cf-btn-reset-kernel {
  display: inline-block;
  font-size: .78rem;
  color: #c4b5fd;
  background: rgba(130,80,223,.08);
  border-color: rgba(130,80,223,.3);
}
body.python-mode .cf-btn-reset-kernel:hover:not([disabled]) {
  background: rgba(130,80,223,.18);
  border-color: rgba(130,80,223,.6);
}

.cf-btn {
  background: #161616; color: var(--tx);
  border: 1px solid var(--bd); padding: 7px 14px; border-radius: 6px;
  font-weight: 600; font-size: .82rem; cursor: pointer;
  font-family: ui-monospace, monospace;
  transition: border-color .12s, background .12s, transform .08s;
}
.cf-btn:hover:not([disabled]) { border-color: var(--g); }
.cf-btn:active { transform: translateY(1px); }
.cf-btn[disabled] { opacity: .6; cursor: not-allowed; }
.cf-btn-run {
  background: linear-gradient(180deg, #8fcd00 0%, #76b900 100%);
  color: #000; border-color: #4a7a00;
  box-shadow: 0 2px 6px rgba(118,185,0,0.3);
}
.cf-btn-run:hover:not([disabled]) {
  background: linear-gradient(180deg, #a3dd1f 0%, #8fcd00 100%);
  border-color: #76b900;
}
.cf-intro {
  font-size: .82rem; color: var(--td); line-height: 1.55;
  margin: 4px 0 14px;
  padding: 6px 0 6px 12px;
  border-left: 2px solid var(--bd);
}

/* The stage: relative wrapper for the SVG layer + grid of node cards */
.cf-stage {
  position: relative;
  background-color: #0d0d0d;
  background-image: radial-gradient(circle, #1c1c1c 1px, transparent 1px);
  background-size: 22px 22px;
  border: 1px solid #1e1e1e;
  border-radius: 10px;
  padding: 28px 32px;
  overflow: visible;
}
.cf-svg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  pointer-events: none; z-index: 0;
}
.cf-canvas {
  position: relative; z-index: 1;
  display: grid;
  gap: 60px 80px;
  justify-items: center;
  align-items: stretch;
}
.cf-edge {
  fill: none; stroke: #4a7a00; stroke-width: 2.2;
  opacity: 0.5; transition: opacity .25s, stroke .25s;
}
.cf-edge.flowing {
  stroke: #aee23a; opacity: 1;
  stroke-dasharray: 6 5; animation: cf-edge-flow 1s linear infinite;
}
@keyframes cf-edge-flow { to { stroke-dashoffset: -22; } }

/* Compact node cards on the canvas */
.cf-node {
  background: linear-gradient(180deg, #1c1c1c 0%, #141414 100%);
  border: 1.5px solid var(--bd);
  border-radius: 8px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  padding: 14px 18px;
  display: inline-flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
  font: inherit; color: inherit;
  min-width: 0; white-space: nowrap;
  transition: border-color .15s, transform .12s, box-shadow .15s;
  position: relative;
}
.cf-node:hover {
  transform: translateY(-2px); border-color: #4a7a00;
  box-shadow: 0 8px 22px rgba(0,0,0,0.6),
              0 0 0 1px rgba(118,185,0,0.15) inset;
}
.cf-node.active {
  border-color: var(--g);
  box-shadow: 0 6px 22px rgba(0,0,0,0.6),
              0 0 0 1px rgba(118,185,0,0.4) inset;
}
.cf-node.running {
  border-color: #d49c2c;
  animation: cf-pulse 1.5s ease-in-out infinite;
}
@keyframes cf-pulse {
  0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 0 0 rgba(212,156,44,0.6); }
  50%      { box-shadow: 0 4px 14px rgba(0,0,0,0.5), 0 0 0 6px rgba(212,156,44,0); }
}
.cf-node.complete { border-color: var(--g); }
.cf-node.error    { border-color: #d74e4e; }

.cf-node-icon { font-size: 1.4rem; line-height: 1;
  filter: drop-shadow(0 0 4px rgba(118,185,0,0.3)); }
.cf-node-title { font-weight: 700; color: var(--tx); font-size: .92rem; }
.cf-node-status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #4a4a4a;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
}
.cf-node-status-dot.running {
  background: #d49c2c;
  animation: cf-dot-pulse 1s ease-in-out infinite;
}
.cf-node-status-dot.complete { background: var(--g); box-shadow: 0 0 8px rgba(118,185,0,0.6); }
.cf-node-status-dot.error    { background: #d74e4e; box-shadow: 0 0 8px rgba(215,78,78,0.6); }
@keyframes cf-dot-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.4); opacity: 0.7; }
}

.cf-status-bar {
  margin: 10px 2px;
  font-family: ui-monospace, monospace; font-size: .78rem;
  color: var(--tf); min-height: 1em;
}
.cf-status-bar.ok  { color: var(--gs); }
.cf-status-bar.err { color: #ff6b6b; }

/* Code panels stack below the canvas in declared (run) order. */
.cf-panels {
  display: flex; flex-direction: column; gap: 14px;
  margin-top: 6px;
}
.cf-panel {
  background: #0f0f0f;
  border: 1px solid var(--bd); border-radius: 8px;
  padding: 12px 14px 14px;
  scroll-margin-top: 80px;
  transition: border-color .2s, box-shadow .2s;
}
.cf-panel.focus {
  border-color: var(--g);
  box-shadow: 0 0 0 1px rgba(118,185,0,0.3) inset;
}
.cf-panel.running { border-color: #d49c2c; }
.cf-panel.complete { border-color: rgba(118,185,0,0.4); }
.cf-panel.error    { border-color: #d74e4e; }

.cf-panel-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px; flex-wrap: wrap;
}
.cf-panel-icon { font-size: 1.3rem; line-height: 1; }
.cf-panel-title {
  font-weight: 700; color: var(--gs); font-size: .94rem;
}
.cf-panel-summary {
  font-size: .8rem; color: var(--td); line-height: 1.45;
  flex: 1; min-width: 200px;
}
.cf-panel-status-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: #4a4a4a;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
}
.cf-panel-status-dot.running  { background: #d49c2c; animation: cf-dot-pulse 1s infinite; }
.cf-panel-status-dot.complete { background: var(--g); box-shadow: 0 0 8px rgba(118,185,0,0.6); }
.cf-panel-status-dot.error    { background: #d74e4e; box-shadow: 0 0 8px rgba(215,78,78,0.6); }

.cf-panel-runone {
  background: #161616; color: var(--gs);
  border: 1px solid #4a7a00; border-radius: 5px;
  padding: 5px 12px; font-size: .78rem; cursor: pointer;
  font-family: ui-monospace, monospace; font-weight: 600;
}
.cf-panel-runone:hover { background: #1a2912; color: var(--tx); border-color: var(--g); }

/* ── Helpers reference (between intro and stage) ─────────────────────────── */
.cf-helpers {
  margin: 10px 0 14px;
  border: 1px solid var(--bd);
  border-radius: 6px;
  background: #0f0f0f;
  overflow: hidden;
}
.cf-helpers[open] { border-color: rgba(118,185,0,0.35); }
.cf-helpers > summary {
  cursor: pointer;
  padding: 10px 14px;
  display: flex; align-items: center; gap: 12px;
  user-select: none;
  list-style: none;
}
.cf-helpers > summary::-webkit-details-marker,
.cf-helpers > summary::marker { display: none; content: ""; }
.cf-helpers > summary::before {
  content: ""; display: inline-block;
  width: 6px; height: 6px;
  border-right: 1.5px solid var(--gs);
  border-bottom: 1.5px solid var(--gs);
  transform: rotate(-45deg); margin-right: 2px;
  transition: transform .18s ease;
}
.cf-helpers[open] > summary::before { transform: rotate(45deg); }
.cf-helpers > summary:hover { background: rgba(118,185,0,0.04); }
.cf-helpers-chip {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: .7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  padding: 3px 9px; border-radius: 4px;
  background: rgba(118,185,0,0.14); color: var(--gs);
  border: 1px solid rgba(118,185,0,0.35);
}
.cf-helpers-sig {
  font-size: .82rem; color: var(--td);
  flex: 1; min-width: 0;
}
.cf-helpers-sig code { background: #1a1a1a; padding: 1px 5px; border-radius: 3px; font-size: .82em; color: var(--gs); }
.cf-helpers-meta {
  font-size: .74rem; color: var(--tf);
  white-space: nowrap;
}
.cf-helpers-meta code { background: #1a1a1a; padding: 1px 5px; border-radius: 3px; font-size: .9em; color: var(--gs); }
/* Horizontal scroll wrapper around the helpers table. When the canvas is
   embedded in a narrow frame (edX iframe, mobile) the two-column table
   would otherwise overflow and cut off the descriptions. */
.cf-helpers-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.cf-helpers-table {
  width: 100%; border-collapse: collapse;
  font-size: .82rem; line-height: 1.5;
  border-top: 1px solid var(--bd);
  min-width: 560px;
}
.cf-helpers-table td {
  padding: 8px 14px;
  border-bottom: 1px solid #161616;
  vertical-align: top;
  color: var(--td);
}
.cf-helpers-table tr:last-child td { border-bottom: 0; }
.cf-helpers-table td:first-child {
  font-family: ui-monospace, monospace;
  color: var(--gs);
  white-space: nowrap;
  background: #0a0a0a;
  width: 200px;
}
.cf-helpers-table code {
  background: #1a1a1a; padding: 1px 5px; border-radius: 3px;
  font-size: .9em; color: var(--gs);
}
.cf-helpers-table tr[data-helper] { cursor: pointer; transition: background .12s; }
.cf-helpers-table tr[data-helper]:hover { background: rgba(118,185,0,0.04); }
.cf-helpers-table tr[data-helper].selected { background: rgba(118,185,0,0.10); }
.cf-helpers-table tr[data-helper].selected td:first-child { color: var(--gs); box-shadow: inset 3px 0 0 var(--g); }

/* ── Helpers menu: inline source row that drops directly under its helper ── */
.cf-helpers-section-head td {
  padding: 8px 12px 4px;
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #5a5a5a;
  border-bottom: 1px solid #1e1e1e;
}
.cf-helpers-section-head td code {
  background: transparent;
  color: #888;
  padding: 0;
}
.cf-helpers-source-row > td {
  padding: 0 !important;
  background: #0a0a0a;
  border-bottom: 1px solid var(--bd) !important;
}
.cf-helpers-src-head {
  font-family: ui-monospace, monospace; font-size: .74rem;
  color: var(--tf); padding: 8px 14px;
  text-transform: uppercase; letter-spacing: .08em;
  background: #0d0d0d; border-bottom: 1px solid var(--bd);
  display: flex; align-items: center; gap: 10px;
}
.cf-helpers-src-head code { color: var(--gs); text-transform: none; letter-spacing: 0; }
.cf-helpers-apply,
.cf-helpers-revert {
  margin-left: auto;
  background: #131313;
  color: var(--td);
  border: 1px solid var(--bd);
  font-family: var(--mono);
  font-size: .72rem;
  text-transform: none;
  letter-spacing: 0;
  padding: 3px 9px;
  border-radius: 4px;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.cf-helpers-apply { margin-left: auto; }
.cf-helpers-revert { margin-left: 0; }
.cf-helpers-apply:hover  { background: #1a2912; color: var(--gs); border-color: var(--g); }
.cf-helpers-revert:hover { background: #1a1a1a; color: var(--tx); border-color: var(--tf); }
.cf-helpers-status {
  font-family: var(--mono); font-size: .72rem;
  text-transform: none; letter-spacing: 0;
  color: var(--td);
}
.cf-helpers-status.ok  { color: var(--gs); }
.cf-helpers-status.err { color: var(--err); }
.cf-helpers-src-editor {
  width: 100%; min-height: 60px; max-height: 320px;
  background: #0a0a0a; color: #f8f8f2;
  border: 0;
  padding: 8px 10px;
  font-family: var(--mono); font-size: .8rem;
  line-height: 1.55; box-sizing: border-box; resize: vertical;
  outline: none;
}
/* Helper-source editor: grow to content but cap and SCROLL internally. The cap +
   overflow must live on .CodeMirror-scroll (the inner scroller), not on .CodeMirror
   itself. That placement is the canonical CodeMirror auto-height pattern. Putting
   max-height on .CodeMirror just clips, which is why longer sources (e.g. fetch) did not scroll. */
.cf-helpers-source-row .CodeMirror {
  border: 0;
  border-radius: 0;
  font-size: .82rem;
  line-height: 1.55;
  height: auto;
}
/* The page-level rule `.CodeMirror-scroll{overflow-y:hidden!important}` is meant for
   the node cells (which auto-size to their content). Override it here with higher
   specificity so the capped helper-source editor scrolls instead of clipping. */
.cf-helpers-source-row .CodeMirror-scroll {
  max-height: 340px;
  overflow-y: auto !important;
}
.cf-helpers-source-row .CodeMirror-vscrollbar { display: block !important; }

/* ── Panel details (code / results) ────────────────────────────────────── */
.cf-panel-det {
  margin: 8px 0 0;
  border: 1px solid var(--bd);
  border-radius: 6px;
  background: #0c0c0c;
  overflow: hidden;
}
.cf-panel-det[open] {
  border-color: rgba(118,185,0,0.4);
  box-shadow: 0 0 0 1px rgba(118,185,0,0.08) inset;
}
.cf-panel-det > summary {
  cursor: pointer;
  padding: 9px 14px;
  display: flex; align-items: center; gap: 12px;
  user-select: none;
  list-style: none;
  background: linear-gradient(90deg, rgba(118,185,0,0.04) 0%, transparent 60%);
  transition: background .15s;
}
/* Kill ALL native disclosure markers across browsers */
.cf-panel-det > summary::-webkit-details-marker,
.cf-panel-det > summary::marker {
  display: none; content: "";
}
.cf-panel-det > summary:hover { background: linear-gradient(90deg, rgba(118,185,0,0.08) 0%, transparent 60%); }
/* CSS-only chevron via border tricks. Only ONE arrow ever rendered. */
.cf-panel-det > summary::before {
  content: ""; display: inline-block;
  width: 7px; height: 7px;
  border-right: 1.6px solid var(--gs);
  border-bottom: 1.6px solid var(--gs);
  transform: rotate(-45deg); flex-shrink: 0;
  transition: transform .2s ease;
}
.cf-panel-det[open] > summary::before { transform: rotate(45deg); }

.cf-det-chip {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: .68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .12em;
  padding: 3px 10px; border-radius: 4px;
  background: rgba(118,185,0,0.16); color: var(--gs);
  border: 1px solid rgba(118,185,0,0.35);
  flex-shrink: 0;
}
.cf-det-chip-alt {
  background: rgba(88,166,255,0.14); color: #8ec5ff;
  border-color: rgba(88,166,255,0.35);
}
.cf-det-chip-py {
  background: rgba(130,80,223,0.16); color: #c4b5fd;
  border-color: rgba(130,80,223,0.35);
}
.cf-py-actions {
  display: flex; align-items: center; gap: 8px; margin-left: auto;
}
.cf-py-copy-btn {
  font-family: var(--mono); font-size: .68rem; font-weight: 700;
  padding: 2px 8px; border-radius: 4px; cursor: pointer;
  background: rgba(130,80,223,.16); color: #c4b5fd;
  border: 1px solid rgba(130,80,223,.35);
  transition: background .15s;
}
.cf-py-copy-btn:hover { background: rgba(130,80,223,.3); }
.cf-py-nb-link {
  font-family: var(--mono); font-size: .68rem; font-weight: 700;
  padding: 2px 8px; border-radius: 4px;
  background: rgba(118,185,0,.1); color: var(--gs);
  border: 1px solid rgba(118,185,0,.3);
  text-decoration: none; white-space: nowrap;
}
.cf-py-nb-link:hover { background: rgba(118,185,0,.2); text-decoration: none; }
.cf-panel-python-pre {
  margin: 0; padding: 10px 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: .82rem; line-height: 1.55;
  background: #0d0d0d; color: #f8f8f2;
  border-top: 1px solid var(--bd);
  white-space: pre; overflow-x: auto;
}
.cf-det-sig {
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  font-size: .8rem; color: var(--td);
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cf-det-meta {
  font-size: .72rem; color: var(--tf);
  font-family: ui-monospace, monospace;
  white-space: nowrap;
  padding: 2px 8px; border-radius: 3px;
  background: #161616; border: 1px solid var(--bd);
}
.cf-det-meta.running { color: #f0a500; border-color: rgba(240,165,0,0.4); }
.cf-det-meta.ok      { color: var(--gs); border-color: rgba(118,185,0,0.4); }
.cf-det-meta.err     { color: #ff6b6b; border-color: rgba(215,78,78,0.4); }

.cf-panel-code,
.cf-panel-code-py {
  width: 100%; min-height: 60px;
  background: #0d0d0d; color: #f8f8f2;
  border: 0; border-top: 1px solid var(--bd);
  padding: 8px 10px;
  font-family: ui-monospace, monospace; font-size: .82rem;
  line-height: 1.55; box-sizing: border-box; resize: vertical;
  outline: none;
}
.cf-panel-det .CodeMirror {
  border: 0; border-top: 1px solid var(--bd);
  border-radius: 0;
  font-size: .84rem; line-height: 1.55;
}

/* Streaming view: tokens flow in as the call progresses. */
.cf-panel-stream {
  margin: 0;
  padding: 10px 14px;
  font-family: ui-monospace, monospace; font-size: .84rem;
  color: var(--tx);
  line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
  background: #0d0d0d;
  border-top: 1px solid var(--bd);
  max-height: 320px; overflow-y: auto;
}
.cf-panel-stream:empty { display: none; }

.cf-panel-log {
  margin: 0;
  padding: 8px 14px;
  font-family: ui-monospace, monospace; font-size: .78rem;
  color: var(--gs);
  background: #0a0a0a;
  border-top: 1px solid var(--bd);
}
.cf-panel-log:empty { display: none; }
.cf-panel-log-line {
  padding: 2px 0 2px 10px;
  border-left: 2px solid #4a7a00;
  margin: 2px 0;
  white-space: pre-wrap; word-break: break-word;
}

.cf-panel-output { padding: 0; margin: 0; }
.cf-panel-output:empty { display: none; }
.cf-panel-output-pre {
  background: #0d0d0d;
  border-top: 1px solid var(--bd);
  border-left: 3px solid var(--g);
  padding: 12px 14px; margin: 0; border-radius: 0;
  font-family: ui-monospace, monospace; font-size: .84rem;
  color: var(--tx); line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
  max-height: 360px; overflow-y: auto;
}
.cf-panel-error {
  background: rgba(215,78,78,0.08);
  border-top: 1px solid var(--bd);
  border-left: 3px solid #d74e4e;
  padding: 10px 14px; margin: 0;
  color: #ff6b6b;
  font-family: ui-monospace, monospace; font-size: .84rem;
  white-space: pre-wrap;
}

/* ── CodeMirror error-line highlighting ─────────────────────────────────────── */
.cm-err-line  { background: rgba(215,78,78,.13) !important; }
.cm-err-wrap  { border-left: 2px solid #d74e4e; }
.cm-err-gutter::before { content: '●'; color: #d74e4e; font-size: 9px; line-height: 1; }

/* ── Debug info collapsible ──────────────────────────────────────────────────── */
.cf-debug-det {
  background: rgba(215,78,78,.05);
  border-left: 3px solid #d74e4e;
  margin: 0;
}
.cf-debug-sum {
  padding: 5px 14px;
  font-family: ui-monospace, monospace; font-size: .74rem; font-weight: 700;
  color: #d74e4e; cursor: pointer; user-select: none; letter-spacing: .04em;
  list-style: none;
}
.cf-debug-sum:hover { color: #ff6b6b; }
.cf-debug-sum::marker, .cf-debug-sum::-webkit-details-marker { display: none; }
.cf-debug-sum::before { content: '▶ '; font-size: .65rem; transition: transform .15s; }
.cf-debug-det[open] > .cf-debug-sum::before { content: '▼ '; }
.cf-debug-type {
  padding: 4px 14px 6px;
  font-family: ui-monospace, monospace; font-size: .8rem;
  color: #ff9a9a; white-space: pre-wrap;
}
.cf-debug-snippet {
  border-top: 1px solid rgba(215,78,78,.18);
  border-bottom: 1px solid rgba(215,78,78,.18);
  padding: 3px 0; font-family: ui-monospace, monospace; font-size: .76rem;
  background: rgba(0,0,0,.12);
}
.cf-debug-codeline {
  display: flex; gap: 10px; padding: 1px 14px;
  color: #6a6a6a; white-space: pre; line-height: 1.55;
}
.cf-debug-codeline-err { background: rgba(215,78,78,.18); color: #ffaaaa; }
.cf-debug-lineno {
  flex-shrink: 0; width: 22px; text-align: right;
  color: #4a4a4a; user-select: none;
}
.cf-debug-codeline-err .cf-debug-lineno { color: #d74e4e; font-weight: 700; }
.cf-debug-stack {
  padding: 5px 14px; margin: 0;
  font-family: ui-monospace, monospace; font-size: .7rem;
  color: #5a5a5a; white-space: pre-wrap; word-break: break-all;
  border-top: 1px solid rgba(215,78,78,.12);
}

@media (max-width: 720px) {
  .cf-canvas { gap: 40px 30px; }
  .cf-node { padding: 10px 12px; }
  .cf-node-title { font-size: .82rem; }
}

/* Always-visible "wrote into state" overview between panel header and details. */
.cf-panel-overview {
  margin: 6px 0 0;
  padding: 0;
  display: flex; flex-direction: column;
}
.cf-panel-overview:empty { display: none; }
.cf-overview-label {
  font-family: ui-monospace, monospace; font-size: .68rem;
  color: var(--tf); text-transform: uppercase; letter-spacing: .08em;
  padding: 4px 0 4px 2px;
}
.cf-overview-row {
  display: grid; grid-template-columns: 160px 1fr; gap: 10px;
  padding: 3px 0;
  font-family: ui-monospace, monospace; font-size: .8rem;
  border-top: 1px solid #161616;
}
.cf-overview-row:first-of-type { border-top: 0; }
.cf-overview-key { color: var(--gs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cf-overview-val {
  color: var(--td); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-style: normal;
}

/* Per-call header inside the stream view (multiple chatStream calls in one cell) */
.cf-panel-stream-head {
  font-family: ui-monospace, monospace; font-size: .72rem;
  color: var(--tf); padding: 6px 0 2px;
  text-transform: uppercase; letter-spacing: .08em;
}
.cf-panel-stream-head:first-child { padding-top: 0; }
.cf-panel-stream-tokens { display: inline; }
/* Inline HTML/SVG appended via log.html needs breathing room. */
.cf-panel-log-html {
  margin: 6px 0 4px;
  padding: 4px 0;
  color: var(--td);
}
.cf-panel-log-html svg { display: block; max-width: 100%; height: auto; }

/* ── Python mode toggle ──────────────────────────────────────────────────── */
.py-mode-toggle-wrap {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: #0f0f0f;
  border: 1px solid var(--bd);
  border-radius: 8px;
  margin: 10px 0 14px;
}

/* Topbar variant: compact, no card chrome, since it lives inline with other controls */
#py-mode-topbar-container {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
#py-mode-topbar-container .py-mode-toggle-wrap {
  padding: 4px 10px;
  margin: 0;
  background: transparent;
  border: 1px solid transparent;
  gap: 8px;
}
#py-mode-topbar-container .py-mode-toggle-wrap:hover {
  background: #131313;
  border-color: var(--bd);
}
#py-mode-topbar-container .py-mode-caption { display: none; }

.py-mode-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
}

.py-mode-icon {
  font-family: var(--mono);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--tf);
  transition: color .2s;
}

.py-mode-label .js-icon { color: var(--gs); }
.py-mode-label.on .js-icon { color: var(--tf); }
.py-mode-label.on .py-icon { color: #c4b5fd; }

.py-mode-track {
  position: relative;
  width: 38px;
  height: 20px;
  background: #2a2a2a;
  border-radius: 10px;
  border: 1px solid #3a3a3a;
  transition: background .2s, border-color .2s;
}

.py-mode-label.on .py-mode-track {
  background: rgba(130,80,223,.35);
  border-color: rgba(130,80,223,.6);
}

.py-mode-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  background: var(--gs);
  border-radius: 50%;
  transition: transform .2s ease, background .2s;
}

.py-mode-label.on .py-mode-thumb {
  transform: translateX(18px);
  background: #c4b5fd;
}

.py-mode-caption {
  font-family: var(--mono);
  font-size: .74rem;
  color: var(--td);
  letter-spacing: .04em;
}

/* ── Code panel: single <details> that view-switches between JS and Python ── */
/* Hide the inactive language. The switch is CSS-only and swaps no DOM.
   Nodes without a Python equivalent (data-has-python="0") keep showing JS
   even in Python mode, since hiding it would leave them blank. */
body:not(.python-mode) [data-lang="python"] { display: none; }
body.python-mode .cf-panel[data-has-python="1"] [data-lang="js"] { display: none; }

/* Code panel body wraps the JS textarea, the Python textarea, and the floating
   copy button. */
.cf-panel-code-body {
  position: relative;
}
.cf-panel-no-python {
  padding: 14px 16px;
  font-style: italic;
  color: var(--td);
  background: #0f0f0f;
  border-radius: 0 0 var(--r) var(--r);
}

/* Floating copy button, visible on hover. Top-right of the code body. */
.cf-code-copy {
  position: absolute;
  top: 8px; right: 8px;
  z-index: 5;
  background: rgba(20,20,20,.75);
  border: 1px solid var(--bd);
  color: var(--td);
  font-size: .9rem;
  width: 28px; height: 28px;
  border-radius: 6px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .12s ease, background .12s ease, color .12s ease;
  display: flex; align-items: center; justify-content: center;
}

.cf-jm-wrap {

  border: 1px solid var(--bd);
  border-radius: 10px;
  overflow: hidden;
}

  display: flex;
  align-items: stretch;
  min-height: 56px;
}

/* Left: Module / Section banner button. Clickable; toggles the full map. */
.cf-jm-mod {
  display: flex; align-items: center; gap: 8px;
  padding: 0 18px;
  background: rgba(118, 185, 0, .10);
  border: none;
  border-right: 1px solid var(--bd);
  color: var(--g);
  font-family: var(--mono);
  font-size: .82rem; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;

.cf-jm-mod-chevron { font-size: .85rem; opacity: .75; transition: transform .15s; }

/* Middle: current page identifier + title + sub. */
.cf-jm-current {
  flex: 1; min-width: 0;

  gap: 1px;

  font-size: 1rem; font-weight: 700;
  color: var(--tx); line-height: 1.25;

.cf-jm-current-sub {
  font-size: .8rem; color: var(--td); line-height: 1.3;

}

/* Right: prev + next nav. */
.cf-jm-nav-group {
  display: flex; align-items: stretch;
  border-left: 1px solid var(--bd);
  flex-shrink: 0;
}
.cf-jm-prev, .cf-jm-next {
  display: flex; align-items: center; gap: 10px;
  padding: 0 18px;

/* ── lite overlay ── */
/* ─── Lite-mode overlay ────────────────────────────────────────────────────
   Only inlined by scripts/build/bundle_standalone.py for the iframe-ready single-
   file exports. The lab view (web/*.html served behind nginx) stays on the
   dark theme; the bundled view flips the CSS variables to a light theme so
   the page reads in an iframe / edX / external static host.
*/

:root {
  /* Light theme. Overrides the dark-theme vars in _style.css. */
  --g:   #76b900;
  --gd:  #2f6a00;
  --gs:  #4a7a00;
  --bg:  #ffffff;
  --e1:  #f6f8fa;
  --e2:  #eef1f4;
  --e3:  #e1e6eb;
  --bd:  #d0d7de;
  --tx:  #1a1a1a;
  --td:  #3b3b3b;
  --tf:  #57606a;
  --acc: #0969da;
  --err: #d1242f;
}

/* GFX graphics: force the light palette in the standalone.
   _style.css defines --gfx-* only under `.gfx-dark`, and the bundler strips
   that class from inline figure bodies, so the var() fallbacks (the light
   values) take over. This block is belt-and-braces. If any gfx node keeps
   its class (a parent wrapper, a future figure the stripper misses, a
   runtime-injected diagram), its vars still resolve to these light values
   instead of the dark pastels (#bd9cf7, #5aa8ff, #ff6b6b) that wash out on a
   white card. The lab view never loads this overlay, so its dark palette in
   _style.css stays intact.
   NOTE: keep the literal token s-v-g out of this comment; the bundler's
   recolor pass scans for figure open-tags and a stray one here would drag
   the head style block into the substitution. */
.gfx-dark {
  --gfx-ink:#1a1a1a; --gfx-ink2:#3b3b3b; --gfx-sub:#5e5e5e; --gfx-faint:#8b949e;
  --gfx-line:#d0d7de; --gfx-panel:#f6f8fa; --gfx-bg:#ffffff;
  --gfx-blue:#0969da; --gfx-green:#4a7a00; --gfx-purple:#6f42c1; --gfx-amber:#9a6700; --gfx-teal:#0d9488; --gfx-red:#d1242f;
  --gfx-tint-blue:#dfeaf5; --gfx-tint-green:#e6f3d4; --gfx-tint-purple:#eadfff;
  --gfx-tint-amber:#f7e9cf; --gfx-tint-teal:#d6f1ee; --gfx-tint-red:#fadcdc; --gfx-tint-sub:#eef1f4;
}

/* Body rules that flip the canvas to light. */
body {
  background: #ffffff;
  color: #1a1a1a;
}

/* Topbar gone in the export. No nav, no JupyterLab link, no python-toggle. */
.topbar { display: none !important; }

/* Journey map gone. Each export page stands alone with no cross-page nav. */
#journey-map { display: none !important; }

/* Foot-nav (prev/next) is kept in the bundle, restyled for light mode.
   The lite link-bridge intercepts clicks on these anchors and routes
   them through the parent navigator's setActive(), so the journey bar
   stays in sync. */
.foot-nav {

  padding-top: 1.6em !important;
  margin-top: 3em !important;
}
.foot-nav a {

}
.foot-nav a:hover {

  color: #2f6a00 !important;
  background: #f6f8fa !important;
}
.foot-nav a.next {

  color: #000 !important;
  border-color: #4a7a00 !important;
}
.foot-nav a.next:hover { background: #5a8e00 !important; color: #ffffff !important; }

/* edX LMS chrome is only present when the bundled file is iframed inside the
   edX course. The selectors are no-ops elsewhere (no matching nodes). */
.navigation_arrows_div {
  visibility: hidden;
}
.bookmark-button-wrapper {

  margin: 0 !important;
  height: 0px;
}
.content-wrapper.main-container {

  margin: 0 auto;
  padding: 0 20px;
}

/* Re-theme the hero as a left-rule module header. */
.hero {

  padding: 20px 0 20px 18px;
  margin: 28px 0 32px;

}
.hero h1 {

  font-weight: 800;
  line-height: 1.2;
  color: #1a1a1a;

}
.hero h1 span { color: #76b900; }

/* Headings & body text. */
h2 { color: #1a1a1a; }

p, li { color: #3b3b3b; }
p strong { color: #1a1a1a; }

/* Callouts. */
.callout {

}
.callout.warn { border-left-color: #bf8700; background: #fff8c5; }
.callout.info { border-left-color: #0969da; background: #ddf4ff; }
.callout strong { color: #1a1a1a; }

/* ── Code blocks ──────────────────────────────────────────────────────────
   When the bundle is loaded standalone, none of these `!important` flags
   matter. The reason they exist is the edX HtmlBlock context: edX's own
   CSS bleeds into the rendered block with rules like

     code { color: #000 !important; font-size: 14px !important; }
     .xmodule_display.xmodule_HtmlBlock pre { color: #313131; white-space: pre-wrap; }
     .xmodule_display.xmodule_HtmlBlock code { color:#313131; background:none; padding:0; }
     *, *::before, *::after { margin: 0; padding: 0; }

   That cascade overrides our chip background (chips become naked black
   text), forces CodeMirror's <pre class="CodeMirror-line"> to dark gray
   on a near-black panel ("black on black"), and strips code-panel
   padding. To win we need `!important` *and* high enough specificity. */

code,
:not(pre) > code {
  background: #f6f8fa !important;
  color: #1f2328 !important;
  padding: .12em .4em !important;
  border-radius: 3px !important;
  border: 1px solid #d0d7de !important;
  font-family: var(--mono) !important;
  font-size: .9em !important;
}

pre {
  background: #f6f8fa !important;
  color: #1f2328 !important;
  border: 1px solid #d0d7de !important;
  border-radius: 6px !important;
  padding: 14px 16px !important;
  margin: 1em 0 !important;
  font-family: var(--mono) !important;
  font-size: .85rem !important;
  line-height: 1.55 !important;
  /* Wrap long lines instead of per-cell horizontal scroll. Horizontal
     scrollbars inside <pre> blocks look wrong nested inside an iframe,
     and they hide content from a non-scrolling reader. */
  overflow-x: visible !important;
  white-space: pre-wrap !important;
  word-break: break-word !important;
}

pre code {
  background: transparent !important;
  border: none !important;
  padding: 0 !important;
  font-size: inherit !important;
  color: inherit !important;
}

/* CodeMirror has to defend against edX forcing `pre { color: #313131 }` on
   every <pre>, which would include each `<pre class="CodeMirror-line">`
   and kill the monokai theme. We push the container's dark backdrop,
   keep line backgrounds transparent (so they inherit it), and force
   color inheritance so token-color spans still win. Reset padding/margin
   so edX's universal `* { margin:0; padding:0 }` doesn't squash the
   editor, and pin line-height against edX's `* { line-height: 1.4em }`. */
.cm-s-monokai.CodeMirror,
.CodeMirror.cm-s-monokai {
  background: #0d0d0d !important;
  color: #f8f8f2 !important;
  line-height: 1.55 !important;
}
.cm-s-monokai pre.CodeMirror-line,
.cm-s-monokai pre.CodeMirror-line-like,
.CodeMirror pre.CodeMirror-line,
.CodeMirror pre.CodeMirror-line-like {
  background: transparent !important;
  color: inherit !important;
  border: none !important;
  border-radius: 0 !important;
  padding: 0 4px !important;
  margin: 0 !important;
  white-space: pre !important;
  font-size: inherit !important;
}
.CodeMirror-gutters { background: #0d0d0d !important; }
.CodeMirror-linenumber { color: #6a6a6a !important; }

/* Run-output panels. edX's `.xmodule_HtmlBlock pre { color: #313131 }` makes
   our dark output streams unreadable. Force light text on the dark backdrop. */
.cf-panel-output-pre,
.cf-panel-stream,
.cf-panel-log,
.cell-output {
  background: #0d0d0d !important;
  color: #f2f2f2 !important;
  white-space: pre-wrap !important;
  font-family: var(--mono) !important;
  line-height: 1.55 !important;
}
.cell-output.empty   { color: #6a6a6a !important; font-style: italic; }
.cell-output.error   { color: #ef4444 !important; }

/* (cf-helpers-table styling lives in the lite repaint block below.) */

/* Tables. */
table { border-color: #d0d7de; }
table th, table td { border-color: #d0d7de !important; color: #3b3b3b !important; }
table th { background: #f6f8fa; color: #1a1a1a !important; }

/* Module cards (used on index.html). */
.module-card {
  background: #f6f8fa;
  border: 1px solid #d0d7de;
  color: #1a1a1a;
}
.module-card:hover { background: #eef1f4; border-color: #76b900; }
.module-card h3 { color: #1a1a1a; }
.module-card p { color: #3b3b3b; }
.module-card .num { color: #57606a; }

/* Buttons. */
.btn, .action-btn {
  background: #76b900;
  color: #fff;
}
.btn:hover, .action-btn:hover { background: #5a8e00; }
.action-btn.secondary {
  background: #f6f8fa;
  color: #1a1a1a;
  border: 1px solid #d0d7de;
}

/* Key panel (lite-mode inline form). Override the dark .key-panel rule
   from _style.css so the outer container doesn't double up its own
   dark background around our inner .key-form. */
.key-panel, #key-panel {
  background: transparent !important;
  border: none !important;
  padding: 0 !important;
  margin: 0 0 28px !important;
}
.key-form {
  background: #f6f8fa;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  padding: 16px 20px;
}
.key-form label {
  display: block;
  font-weight: 600;
  font-size: .9rem;
  color: #1a1a1a;
  margin-bottom: 6px;
}
.key-form input {
  width: 100%;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: .88rem;
  border: 1px solid #d0d7de;
  border-radius: 4px;
  background: #fff;
  color: #1a1a1a;
  margin-bottom: 10px;
}
.key-form button {
  padding: 7px 16px;
  background: #76b900;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-weight: 600;
  cursor: pointer;
}
.key-form button:hover { background: #5a8e00; }
.key-form .key-hint { margin-top: 8px; font-size: .78rem; color: #57606a; }
.key-form .key-ok { color: #2e7d32; font-size: .82rem; margin-top: 6px; }
.key-form .key-err { color: #d1242f; font-size: .82rem; margin-top: 6px; }
.key-form .key-note { font-size: .85rem; color: #57606a; padding: 8px 0; }

/* SVG figures: drop the dark backdrop, use a quiet card. The bundler also
   substitutes specific dark fills/strokes inside SVG element bodies so
   diagrams stay legible on a light background. */
svg[style*="background:#0d0d0d"],
svg[style*="background: #0d0d0d"] {
  background: #f6f8fa !important;
  border: 1px solid #d0d7de !important;
}

/* OpenClaw workspace file-tree (03b): an HTML block with a hardcoded
   `background:#0d0d0d`, so the SVG recolor never touches it. In export its
   text flips to dark-on-light via the :root vars above, leaving dim text on a
   black box. Flip the backdrop to the same light card; the file names
   (--gs -> green) and types (--tf -> gray) stay readable from those vars. */
.file-tree {
  background: #f6f8fa !important;
  border-color: #d0d7de !important;
  color: #1f2328 !important;
}

/* Pages that style their SVGs via a page-local <style> block (e.g. cert.html's
   `.topo-svg svg { background:#0d0d0d }`) don't get the substitution above,
   because those rules win on specificity. Patch with !important per-page selector. */
.topo-svg svg {
  background: #f6f8fa !important;
  border: 1px solid #d0d7de !important;
}

/* Cert-page exercise card grid. The `.cert` variant used a light-purple
   text color authored for a dark backdrop; flip it to a darker purple
   that reads on a light bg. */
.nb-card { background: #f6f8fa !important; border-color: #d0d7de !important; color: #3b3b3b !important; }
.nb-card:hover { border-color: #76b900 !important; color: #1a1a1a !important; }
.nb-card .mod  { color: #57606a !important; }
.nb-card .name { color: #4a7a00 !important; }
.nb-card .svcs { color: #57606a !important; }
.nb-card.cert       { border-left-color: #6f42c1 !important; }
.nb-card.cert .name { color: #6f42c1 !important; }

/* Cert callout. The purple tint stays, but force readable text in light mode. */
.cert-callout {
  background: #f3eeff !important;
  border-color: rgba(111,66,193,0.35) !important;
  border-left-color: #6f42c1 !important;
}
.cert-callout .py-label { color: #6f42c1 !important; }
.cert-callout p         { color: #3b3b3b !important; }
.cert-callout p strong  { color: #1a1a1a !important; }
.cert-callout code      { background: #ffffff !important; color: #1f2328 !important; border-color: #d0d7de !important; }

/* Service topology table. The dark `var(--gs)` mono cells in the source CSS
   become #4a7a00 in lite mode automatically via the var override, but the
   row borders use `var(--e2)` which lite redefines too; just nudge the
   monospace first-col color to stay green on white. */
.svc-table td:first-child { color: #4a7a00 !important; }
.svc-table td   { color: #3b3b3b !important; }
.svc-table th   { color: #57606a !important; }

/* Cell containers (code panels). */
.cf-cell, .cell {
  background: #ffffff;
  border: 1px solid #d0d7de;
  color: #1a1a1a;
}
.cf-cell-header, .cell-header {
  background: #f6f8fa;
  border-bottom: 1px solid #d0d7de;
  color: #57606a;
}

/* ─── mountCanvasFlow light theme repaint ───────────────────────────────
   The original cf-* surfaces are dark (designed for the lab's dark page).
   In the export we want a light look matching the page, so every surface
   gets repainted. The !important flags are not for the standalone case
   (nothing competes there); they are because the edX HtmlBlock cascade
   forces black-on-black on prose colors and we need to win for inline
   text inside these elements too. CodeMirror and output streams stay
   dark so monokai stays usable and terminal-style output stays legible. */

.cf-wrap {
  background: #f6f8fa !important;
  border: 1px solid #d0d7de !important;
  box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04) !important;
}
.cf-label { color: #4a7a00 !important; }
.cf-intro {
  color: #3b3b3b !important;
  border-left-color: #d0d7de !important;
}

/* Stage: light gray backdrop with darker gray dots, per the user's spec */
.cf-stage {
  background-color: #eef1f4 !important;
  background-image: radial-gradient(circle, #999 1px, transparent 1px) !important;
  background-size: 22px 22px !important;
  border: 1px solid #d0d7de !important;
}

/* Workflow nodes: light gray cards with subtle gradient */
.cf-node {
  background: linear-gradient(180deg, rgb(241,241,241) 0%, rgb(228,228,228) 100%) !important;
  border: 1.5px solid #d0d7de !important;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06) !important;
  color: #1a1a1a !important;
}
.cf-node:hover {
  border-color: #4a7a00 !important;
  box-shadow: 0 6px 16px rgba(0,0,0,0.10), 0 0 0 1px rgba(118,185,0,0.20) inset !important;
}
.cf-node.active   { border-color: #76b900 !important; box-shadow: 0 4px 14px rgba(0,0,0,0.10), 0 0 0 1px rgba(118,185,0,0.40) inset !important; }
.cf-node.complete { border-color: #76b900 !important; }
.cf-node.error    { border-color: #d1242f !important; }
.cf-node-title    { color: #1a1a1a !important; }
.cf-node-icon     { filter: none !important; }
.cf-node-status-dot { background: #b0b8c0 !important; box-shadow: 0 0 0 1px rgba(0,0,0,0.05) !important; }
.cf-node-status-dot.complete { background: #76b900 !important; box-shadow: 0 0 8px rgba(118,185,0,0.5) !important; }
.cf-node-status-dot.error    { background: #d1242f !important; box-shadow: 0 0 8px rgba(215,78,78,0.5) !important; }

/* Edges between nodes */
.cf-edge         { stroke: #4a7a00 !important; opacity: 0.55 !important; }
.cf-edge.flowing { stroke: #76b900 !important; opacity: 1 !important; }

/* Code panels. These are the containers below the canvas, separate from
   .cf-panel-code-det, which is the inner code editor. */
.cf-panel {
  background: #ffffff !important;
  border: 1px solid #d0d7de !important;
  box-shadow: 0 1px 0 rgba(0,0,0,0.03) !important;
}
.cf-panel.focus    { border-color: #76b900 !important; box-shadow: 0 0 0 1px rgba(118,185,0,0.30) inset !important; }
.cf-panel.complete { border-color: rgba(118,185,0,0.50) !important; }
.cf-panel.error    { border-color: #d1242f !important; }
.cf-panel-title    { color: #4a7a00 !important; }
.cf-panel-summary  { color: #3b3b3b !important; }
.cf-panel-status-dot { background: #b0b8c0 !important; }
.cf-panel-status-dot.complete { background: #76b900 !important; }
.cf-panel-status-dot.error    { background: #d1242f !important; }

/* Helpers section */
.cf-helpers {
  background: #ffffff !important;
  border: 1px solid #d0d7de !important;
}
.cf-helpers > summary:hover { background: rgba(118,185,0,0.06) !important; }
.cf-helpers > summary::before {
  border-right-color: #4a7a00 !important;
  border-bottom-color: #4a7a00 !important;
}
.cf-helpers-chip {
  background: rgba(118,185,0,0.10) !important;
  color: #4a7a00 !important;
  border-color: rgba(118,185,0,0.40) !important;
}
.cf-helpers-sig  { color: #3b3b3b !important; }
.cf-helpers-meta { color: #57606a !important; }
/* All inline code chips render neutral (dark gray on light gray) for
   readability. Green is reserved for cell-level affordances (chip
   badges, row hover/active, selected state) and is never used on running
   prose text, where it lowers contrast. */
.cf-helpers-sig code,
.cf-helpers-meta code,
.cf-helpers-table code,
.cf-helpers-src-head code {
  background: #f6f8fa !important;
  color: #1f2328 !important;
  border: 1px solid #d0d7de !important;
  padding: 1px 5px !important;
}
/* First column of the helpers table still reads as "this is a helper
   name". Convey that via the cell background tint, not the text color. */
.cf-helpers-table td:first-child {
  background: #f0f9e0 !important;     /* faint green tint */
  color: #1f2328 !important;
  font-weight: 600 !important;
}
.cf-helpers-table td:first-child code {
  background: transparent !important;
  border: none !important;
  font-weight: 600 !important;
  padding: 0 !important;
}
.cf-helpers-table       { border-top-color: #d0d7de !important; }
.cf-helpers-table td    { color: #3b3b3b !important; border-bottom: 1px solid #eef1f4 !important; }
.cf-helpers-table td:first-child {
  background: #f6f8fa !important;
  color: #4a7a00 !important;
}
.cf-helpers-table tr[data-helper]:hover            { background: rgba(118,185,0,0.06) !important; }
.cf-helpers-table tr[data-helper].selected         { background: rgba(118,185,0,0.12) !important; }
.cf-helpers-table tr[data-helper].selected td:first-child {
  color: #4a7a00 !important;
  box-shadow: inset 3px 0 0 #76b900 !important;
}
.cf-helpers-section-head td {
  color: #57606a !important;
  border-bottom-color: #d0d7de !important;
}
.cf-helpers-section-head td code {
  background: transparent !important;
  color: #57606a !important;
  border: none !important;
}

/* Helpers source editor row */
.cf-helpers-source-row > td {
  background: #f6f8fa !important;
  border-bottom-color: #d0d7de !important;
}
.cf-helpers-src-head {
  background: #eef1f4 !important;
  border-bottom-color: #d0d7de !important;
  color: #57606a !important;
}
.cf-helpers-src-head code {
  background: transparent !important;
  color: #4a7a00 !important;
  border: none !important;
}
.cf-helpers-apply,
.cf-helpers-revert {
  background: #ffffff !important;
  color: #3b3b3b !important;
  border: 1px solid #d0d7de !important;
}
.cf-helpers-apply:hover  { background: rgba(118,185,0,0.10) !important; color: #4a7a00 !important; border-color: #76b900 !important; }
.cf-helpers-revert:hover { background: #eef1f4 !important; color: #1a1a1a !important; border-color: #57606a !important; }
.cf-helpers-status       { color: #3b3b3b !important; }
.cf-helpers-status.ok    { color: #4a7a00 !important; }

/* Panel <details> (code/results inside each cell) */
.cf-panel-det {
  background: #ffffff !important;
  border-color: #d0d7de !important;
}
.cf-panel-det[open] {
  border-color: rgba(118,185,0,0.5) !important;
  box-shadow: 0 0 0 1px rgba(118,185,0,0.10) inset !important;
}
.cf-panel-det > summary {
  background: linear-gradient(90deg, rgba(118,185,0,0.06) 0%, transparent 60%) !important;
}
.cf-det-chip {
  background: #f6f8fa !important;
  color: #4a7a00 !important;
  border: 1px solid #d0d7de !important;
}
.cf-det-sig  { color: #3b3b3b !important; }
/* The "done in 1.23s" / "streaming…" / "error" status chip lives at the
   right edge of every panel summary. Source CSS gives it `background:
   #161616` (dark) which leaves the green/red text invisible on light. */
.cf-det-meta {
  background: #f6f8fa !important;
  border-color: #d0d7de !important;
  color: #57606a !important;
}
.cf-det-meta.running { color: #b8730d !important; background: #fff4d6 !important; border-color: rgba(184,115,13,0.4) !important; }
.cf-det-meta.ok      { color: #2f6a00 !important; background: #e6f3d4 !important; border-color: rgba(118,185,0,0.4) !important; }
.cf-det-meta.err     { color: #d1242f !important; background: #ffe1e1 !important; border-color: rgba(209,36,47,0.4) !important; }

/* Buttons */
.cf-btn {
  background: #ffffff !important;
  color: #1a1a1a !important;
  border: 1px solid #d0d7de !important;
  padding: 7px 14px !important;
  border-radius: 6px !important;
  font-weight: 600 !important;
  font-size: .82rem !important;
  font-family: ui-monospace, monospace !important;
  cursor: pointer !important;
  line-height: 1.2 !important;
}
.cf-btn:hover:not([disabled]) { border-color: #76b900 !important; background: #f6f8fa !important; }
.cf-btn-run {
  background: linear-gradient(180deg, #8fcd00 0%, #76b900 100%) !important;
  color: #000 !important;
  border: 1px solid #4a7a00 !important;
  box-shadow: 0 2px 6px rgba(118,185,0,0.25) !important;
}
.cf-btn-run:hover:not([disabled]) {
  background: linear-gradient(180deg, #a3dd1f 0%, #8fcd00 100%) !important;
  border-color: #76b900 !important;
}
.cf-panel-runone {
  background: #f6f8fa !important;
  color: #4a7a00 !important;
  border: 1px solid #76b900 !important;
  padding: 5px 12px !important;
}
.cf-panel-runone:hover {
  background: rgba(118,185,0,0.10) !important;
  color: #2f6a00 !important;
  border-color: #2f6a00 !important;
}

/* Status / overview */
.cf-status-bar       { color: #57606a !important; }
.cf-status-bar.ok    { color: #4a7a00 !important; }
.cf-status-bar.err   { color: #d1242f !important; }
.cf-panel-overview   { background: #f6f8fa !important; border-color: #d0d7de !important; }
.cf-overview-label   { color: #57606a !important; }
.cf-overview-key     { color: #4a7a00 !important; }
.cf-overview-val     { color: #1a1a1a !important; }

/* Output panels stay dark on purpose. Terminal-style output reads better
   on a dark backdrop. Force light text/border to win against edX's
   `pre { color: #313131 }`. The earlier defenses already set this; the
   block below is just the canonical place. */
.cf-panel-stream     { background: #0d0d0d !important; color: #f2f2f2 !important; border-top: 1px solid #2a2a2a !important; }
.cf-panel-log        { background: #0a0a0a !important; color: #b0b0b0 !important; border-top: 1px solid #2a2a2a !important; }
.cf-panel-output-pre { background: #0d0d0d !important; color: #f2f2f2 !important; border-left-color: #76b900 !important; border-top-color: #2a2a2a !important; }
.cf-panel-no-python  { background: #f6f8fa !important; color: #57606a !important; }
.cf-panel-stream-head { color: #57606a !important; }
.cf-panel-error       { background: #fff0f0 !important; color: #d1242f !important; border-color: #d1242f !important; }

/* ── Syntax-highlight palette for light mode ──────────────────────────────
   The lab source ships a dark "one-dark"-ish hljs palette (`.hljs-string`
   is `#c3e88d` pale green etc.). On a light prose page those colors are
   nearly invisible. Override with a github-light-ish palette that reads
   on `#f6f8fa` and below. It is used both for prose <pre><code> blocks AND
   for the cf-panel-output-pre when it renders a JSON return value. */
pre code.hljs,
pre .hljs                { color: #1f2328 !important; background: transparent !important; }
.hljs-keyword,
.hljs-selector-tag,
.hljs-tag                { color: #d73a49 !important; font-weight: 600 !important; }
.hljs-string,
.hljs-attr,
.hljs-template-tag       { color: #032f62 !important; }
.hljs-comment,
.hljs-quote              { color: #6a737d !important; font-style: italic !important; }
.hljs-title,
.hljs-title.function_,
.hljs-function .hljs-title,
.hljs-section            { color: #6f42c1 !important; }
.hljs-number,
.hljs-literal            { color: #005cc5 !important; }
.hljs-built_in,
.hljs-type,
.hljs-class .hljs-title  { color: #e36209 !important; }
.hljs-params,
.hljs-variable,
.hljs-template-variable  { color: #24292e !important; }
.hljs-operator,
.hljs-punctuation        { color: #24292e !important; }
.hljs-meta               { color: #6a737d !important; }
.hljs-selector-class,
.hljs-selector-id        { color: #6f42c1 !important; }
.hljs-deletion           { color: #b31d28 !important; background: #ffeef0 !important; }
.hljs-addition           { color: #22863a !important; background: #f0fff4 !important; }
.hljs-name               { color: #22863a !important; }
.hljs-symbol,
.hljs-bullet             { color: #005cc5 !important; }

/* Output pane: when the panel renders a JSON-shaped return value, the
   bundler-side JS gives it `code.language-json` inside the pre. Light
   text on the dark output backdrop, light-palette token colors. */
.cf-panel-output-pre code,
.cf-panel-output-pre code.hljs,
.cf-panel-output-pre .hljs       { color: #e6edf3 !important; background: transparent !important; border: 0 !important; }
/* Belt-and-braces: every span hljs emits gets the same base color,
   even the hljs-punctuation spans for `{ } [ ] , :`, so we never inherit
   edX's `code { color: #000 !important }` for tokens we didn't
   explicitly recolour below. */
.cf-panel-output-pre code *      { color: inherit !important; }
.cf-panel-output-pre .hljs-string,
.cf-panel-output-pre .hljs-attr  { color: #9ecbff !important; }
.cf-panel-output-pre .hljs-number,
.cf-panel-output-pre .hljs-literal { color: #f0883e !important; }
.cf-panel-output-pre .hljs-keyword { color: #ff7b72 !important; }
.cf-panel-output-pre .hljs-comment { color: #8b949e !important; font-style: italic !important; }
.cf-panel-output-pre .hljs-title,
.cf-panel-output-pre .hljs-name    { color: #d2a8ff !important; }
.cf-panel-output-pre .hljs-punctuation,
.cf-panel-output-pre .hljs-operator { color: #c9d1d9 !important; }

/* Helpers scroll wrapper (defined in _style.css). edX may apply
   margin: 0 to the table; keep the wrapper handling overflow. */
.cf-helpers-scroll { overflow-x: auto !important; }
.cf-helpers-table  { min-width: 560px !important; }

/* Floating copy button: keep visible on hover of light code panel */
.cf-code-copy {
  background: rgba(255,255,255,0.85) !important;
  color: #57606a !important;
  border: 1px solid #d0d7de !important;
}
.cf-code-copy:hover { background: #ffffff !important; color: #4a7a00 !important; border-color: #76b900 !important; }

</style>

<body>
<main>

<div class="hero">
  <h1>Securing <span>Agents</span></h1>
  <p class="lead">
    This page has moved. Head back to the course and pick up where you
    left off.
  </p>
</div>

<div class="callout" style="margin-top: 18px;">
  <a href="index.html">Return to the course home &rarr;</a>
</div>

</main>
<script>
// ── Lite-mode bridge (iframe export only) ───────────────────────────────
// When iframed, the parent (edX navigator) listens for two message types:
//
//   { type: "fx43-iframe-size",  height: <px> }     ← from autosize loop
//   { type: "fx43-navigate",     file: "<x>.html" } ← from link interceptor
//
// The autosize keeps iframe.height == content height (no scrollbar). The
// link interceptor catches clicks on sibling .html anchors (foot-nav
// prev/next, in-prose cross-references, etc.) so the navigator routes
// them through its own setActive() and the journey bar stays in sync.
// Both IIFEs no-op when the page is loaded standalone (window.parent
// === window).
(function _liteAutosize() {
  if (window.parent === window) return;            // standalone tab, no parent

  // BREAK THE FEEDBACK LOOP: the lab CSS sets `body { min-height: 100vh }`.
  // Inside an iframe, 100vh == the iframe's own viewport. When the parent
  // grows the iframe (even by 1px), the body's min-height grows with it,
  // body.scrollHeight reports the new larger value, parent grows again …
  // we'd loop forever. Pin html/body to natural height inside the iframe.
  function pinSize() {
    if (document.documentElement) {
      document.documentElement.style.setProperty("min-height", "0", "important");
      document.documentElement.style.setProperty("height", "auto", "important");
    }
    if (document.body) {
      document.body.style.setProperty("min-height", "0", "important");
      document.body.style.setProperty("height", "auto", "important");
    }
  }
  pinSize();

  // Track only INCREASES that come from genuine content additions (a
  // CodeMirror mount, a helpers row open, a late image load). We never
  // shrink. Once we've reported a height, the parent owns it; subsequent
  // smaller measurements are ignored, which keeps us out of the loop
  // even if pinSize() races with a stylesheet that resets min-height.
  var reported = 0;
  function measureContent() {
    // Use the rendered content's bottom edge, not body.scrollHeight (which
    // is biased by min-height). We probe the actual children of <main> /
    // <body> and take the maximum bottom-y.
    var body = document.body;
    if (!body) return 0;
    var max = 0;
    var nodes = body.children;
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      var bottom = r.bottom + window.scrollY;
      if (bottom > max) max = bottom;
    }
    return Math.ceil(max);
  }
  function emit() {
    pinSize();                        // re-apply, defensive
    var h = measureContent();
    if (h > reported + 4) {           // grow-only, ignore tiny jitter
      reported = h;
      try {
        window.parent.postMessage({ type: "fx43-iframe-size", height: h, url: location.href }, "*");
      } catch (_) {}
    }
  }

  function start() {
    emit();
    window.addEventListener("load", emit);
    // ResizeObserver / MutationObserver catch real layout additions such as
    // CodeMirror mounts, <details> open, and helpers source-row reveal.
    // Throttled via requestAnimationFrame to coalesce bursts.
    var rafScheduled = false;
    function schedule() {
      if (rafScheduled) return;
      rafScheduled = true;
      requestAnimationFrame(function () { rafScheduled = false; emit(); });
    }
    try { new ResizeObserver(schedule).observe(document.body); } catch (_) {}
    try {
      new MutationObserver(schedule).observe(document.body, {
        childList: true, subtree: true, attributes: true,
        attributeFilter: ["open", "hidden", "class"]
      });
    } catch (_) {}
    // A short post-load burst for content that lands a beat after load
    // (highlight.js, CodeMirror, viz drawing). After that, observers
    // carry the rest. A long-running interval is avoided, since that is what
    // caused the indefinite-growth perception.
    var burst = 0;
    var bid = setInterval(function () {
      emit();
      if (++burst >= 15) clearInterval(bid);    // ~2.2s of 150ms ticks
    }, 150);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

// ── Lite-mode link interceptor (iframe export only) ─────────────────────
// Catch clicks on sibling .html anchors and hand them up to the parent
// navigator. Source of truth for the link target is the actual <a href>
// in the page, so no separate map needs to be maintained. Capture-phase
// listener so we beat any page-level click handlers.
(function _liteLinkBridge() {
  if (window.parent === window) return;

  function fileFromHref(a) {
    if (!a || !a.href || a.target === "_blank") return null;
    var url;
    try { url = new URL(a.href, location.href); } catch (_) { return null; }
    if (url.origin !== location.origin) return null;     // external
    var dir = location.pathname.replace(/[^/]*$/, "");
    if (!url.pathname.startsWith(dir)) return null;      // out of bundle dir
    var rest = url.pathname.slice(dir.length);
    if (!rest || rest.indexOf("/") >= 0) return null;    // subdir, not a sibling
    if (!/\.html(\?.*)?$/i.test(rest)) return null;
    return { file: rest.replace(/\?.*$/, ""), hash: url.hash || "" };
  }

  document.addEventListener("click", function (ev) {
    if (ev.defaultPrevented) return;
    if (ev.button !== 0) return;                 // only left-click
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    var a = ev.target;
    while (a && a !== document.body && a.tagName !== "A") a = a.parentElement;
    if (!a || a.tagName !== "A") return;
    var t = fileFromHref(a);
    if (!t) return;
    // Self-link? Let it fall through to natural anchor scroll.
    if (t.file === location.pathname.split("/").pop()) return;
    ev.preventDefault();
    try {
      window.parent.postMessage({
        type: "fx43-navigate",
        file: t.file,
        hash: t.hash,
      }, "*");
    } catch (_) {}
  }, true);
})();
</script>
