  <line x1="580" y1="212" x2="580" y2="239" stroke="#76b900" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="450" y="240" width="260" height="32" rx="4" fill="#0d0d0d" stroke="#2a3a2a" stroke-width="1.2"/>
  <text x="580" y="260" font-family="ui-monospace, monospace" font-size="11" fill="#cccccc" text-anchor="middle">MCP Server (Tools &amp; Resources)</text>

  <text x="580" y="295" font-family="Arial, sans-serif" font-size="11" fill="#6a7a6a" text-anchor="middle">Standardizes multi-vendor runtime contracts</text>


  <rect x="780" y="25" width="350" height="300" rx="8" fill="#111c11" stroke="#76b900" stroke-width="2"/>
  <text x="955" y="48" font-family="ui-monospace, monospace" font-size="11" fill="#76b900" text-anchor="middle" font-weight="700">WEBSOCKET · PERSISTENT STATE</text>
  <line x1="790" y1="56" x2="1120" y2="56" stroke="#1e3a1e" stroke-width="1"/>
  
  <text x="955" y="80" font-family="Arial, sans-serif" font-size="15" fill="#aee23a" text-anchor="middle" font-weight="800">agent runtime</text>
  <text x="955" y="95" font-family="ui-monospace, monospace" font-size="10" fill="#6a7a6a" text-anchor="middle">continuous connection state</text>

  <rect x="825" y="120" width="260" height="32" rx="4" fill="#0d0d0d" stroke="#224422" stroke-width="1.2"/>
  <text x="955" y="140" font-family="ui-monospace, monospace" font-size="11" fill="#cccccc" text-anchor="middle">ws:// interactive duplex gateway</text>
  
  <line x1="955" y1="152" x2="955" y2="179" stroke="#76b900" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="825" y="180" width="260" height="32" rx="4" fill="#0d0d0d" stroke="#224422" stroke-width="1.2"/>
  <text x="955" y="200" font-family="ui-monospace, monospace" font-size="11" fill="#a5a5a5" text-anchor="middle">→ chat.send({ sessionKey })</text>

  <line x1="955" y1="212" x2="955" y2="239" stroke="#76b900" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="825" y="240" width="260" height="32" rx="4" fill="#1e321e" stroke="#76b900" stroke-width="1.2"/>
  <text x="955" y="260" font-family="Arial, sans-serif" font-size="11" fill="#aee23a" text-anchor="middle" font-weight="700">← live stream: tool_calls · events</text>

  <text x="955" y="295" font-family="Arial, sans-serif" font-size="11" fill="#6a7a6a" text-anchor="middle">Connection remains alive indefinitely</text>


  <text x="580" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5e5e5e" font-style="italic">
    Network abstraction topologies: From stateless and server-orchestrated HTTP REST exchanges yielding response byproducts,
  </text>
  <text x="580" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5e5e5e" font-style="italic">
