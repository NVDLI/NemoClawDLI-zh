  <text x="205" y="48" font-family="ui-monospace, monospace" font-size="11" fill="#888888" text-anchor="middle" font-weight="700">HTTP · REST ENDPOINTS</text>
  <line x1="40" y1="56" x2="370" y2="56" stroke="#2a2a2a" stroke-width="1"/>
  
  <text x="205" y="80" font-family="Arial, sans-serif" font-size="15" fill="#e6e6e6" text-anchor="middle" font-weight="800">model endpoints</text>
  <text x="205" y="95" font-family="ui-monospace, monospace" font-size="10" fill="#6a6a6a" text-anchor="middle">short-lived connection lifecycle</text>

  <rect x="45" y="115" width="150" height="65" rx="4" fill="#0d0d0d" stroke="#3a3a3a" stroke-width="1.2"/>
