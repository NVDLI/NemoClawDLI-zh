<!-- This schematic maps the networking paradigms and interface layers used to deploy modern LLM applications and multi-turn autonomous agents, breaking production systems into three distinct architectural layers:

1. The Transactional HTTP Layer (Model Endpoints)
The baseline infrastructure communicates entirely over stateless request-response web protocols. Applications choose between two primary REST-based strategies:

Chat Completions API (/v1/completions): Direct, low-level, and completely stateless. The model endpoint processes each request in absolute isolation. The client-side application must store, maintain, and append the entire multi-turn conversation log, transmitting the full history payload to the server on every single invocation.

Responses API (/v1/responses): A stateful orchestrator wrapper operating over the same HTTP/REST transport. Instead of requiring massive history payload transfers from the client, the conversation history is persisted server-side. The client simply transmits the newest message along with a persistent token tracking reference (previous_response_id). The server dynamically resolves context memory, triggers the underlying stateless inference execution core, handles agentic sub-loops (such as native web search or code execution tracking), and returns the final delivery packet back as an atomic REST response byproduct over the ephemeral connection.

2. The Abstracted Abstraction Layer (Model Context Protocol)
The integration tier acts as an architectural firewall, decoupling the underlying model engine from specialized environment extensions via the open Model Context Protocol (MCP). Running over generic communication buses (such as standard input/output streams or standard JSON-RPC wrappers), it eliminates hardcoded integration debt.

The host framework operates an internal protocol client that connects seamlessly to standardized tool servers. This standardizes how access layers, security contexts, business APIs, and real-time knowledge graphs are queried, preventing platform lock-in and simplifying runtime deployment.

3. The Stateful Gateway Layer (Persistent Agent Runtimes)
The production runtime layer bypasses discrete request-response roundtrips in favor of continuous, event-driven agent orchestration (e.g., NemoClaw or OpenClaw architectures). Rather than continuously re-establishing short-lived HTTP handshakes, the application establishes a long-lived, full-duplex WebSocket connection (ws://).

The session's context is bound directly to a secure tracking identifier (sessionKey), unlocking immediate, real-time bi-directional telemetry. High-frequency agent actions, step-by-step reasoning streams, intermediate execution logs, and reactive tool interventions flow uninterrupted across a single network channel without the latency overhead of state serialization and re-injection. -->
<svg class="gfx-dark" viewBox="0 0 1160 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three distinct access protocol layers: Transactional HTTP REST interfaces (Chat Completions vs. stateful Responses API), the Model Context Protocol (MCP) tool abstraction layer, and the persistent, stateful WebSocket runtime gateway." preserveAspectRatio="xMidYMid meet" style="width:100%; height:auto; display:block; background:#0d0d0d; border:1px solid #2a2a2a; border-radius:8px; padding:14px; max-width:1400px; margin:1.5rem auto">
