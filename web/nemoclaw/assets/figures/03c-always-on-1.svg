<svg class="gfx-dark" viewBox="0 0 820 478" xmlns="http://www.w3.org/2000/svg" role="img" 
    aria-label="A single per-turn loop sits nested inside slower triggers, where skills fire inside the turn while heartbeats, cron, and sub-agent spawns are the outer rhythms."
    preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:8px;padding:14px;max-width:1040px;margin:1.5rem auto">
      <circle cx="300" cy="234" r="190" fill="none" stroke="var(--gfx-green,#9bd14a)" stroke-width="2.2"/>
      <polygon points="306,38 306,50 318,44" fill="var(--gfx-green,#9bd14a)"/>
      <line x1="400" y1="70" x2="516" y2="49" stroke="var(--gfx-faint,#6b7177)" stroke-dasharray="2 3"/>
      <text x="524" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="var(--gfx-green,#9bd14a)" font-weight="700">sub-agent</text>
      <text x="524" y="67" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="var(--gfx-sub,#9aa0a6)">the parent spawns and holds the handle</text>
      <circle cx="300" cy="234" r="142" fill="none" stroke="var(--gfx-purple,#bd9cf7)" stroke-width="2.2"/>
      <polygon points="306,86 306,98 318,92" fill="var(--gfx-purple,#bd9cf7)"/>
      <line x1="388" y1="120" x2="516" y2="97" stroke="var(--gfx-faint,#6b7177)" stroke-dasharray="2 3"/>
      <text x="524" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="var(--gfx-purple,#bd9cf7)" font-weight="700">cron</text>
      <text x="524" y="115" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="var(--gfx-sub,#9aa0a6)">a schedule spawns a fresh session (daily)</text>
      <circle cx="300" cy="234" r="94" fill="none" stroke="var(--gfx-amber,#e3b341)" stroke-width="2.2"/>
      <polygon points="306,134 306,146 318,140" fill="var(--gfx-amber,#e3b341)"/>
      <line x1="370" y1="170" x2="516" y2="145" stroke="var(--gfx-faint,#6b7177)" stroke-dasharray="2 3"/>
      <text x="524" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="var(--gfx-amber,#e3b341)" font-weight="700">heartbeat</text>
      <text x="524" y="163" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="var(--gfx-sub,#9aa0a6)">a timer ticks the same session (minutes)</text>
      <circle cx="300" cy="234" r="46" fill="none" stroke="var(--gfx-teal,#3fd0c0)" stroke-width="2.2"/>
      <polygon points="306,182 306,194 318,188" fill="var(--gfx-teal,#3fd0c0)"/>
      <line x1="346" y1="220" x2="516" y2="193" stroke="var(--gfx-faint,#6b7177)" stroke-dasharray="2 3"/>
      <text x="524" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="var(--gfx-teal,#3fd0c0)" font-weight="700">turn</text>
      <text x="524" y="211" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="var(--gfx-sub,#9aa0a6)">read, reason, act, write back (seconds)</text>
      <text x="300" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="var(--gfx-green,#9bd14a)">agent</text>
      <text x="410" y="458" text-anchor="middle" font-size="13.5" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" fill="var(--gfx-sub,#9aa0a6)">One per-turn loop nested inside slower triggers: skills, heartbeats, cron, sub-agents.</text>
      
    </svg>
