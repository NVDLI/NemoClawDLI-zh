# ═══════════════════════════════════════════════════════════════════════════
# DLI OpenClaw Sandbox Policy (OpenShell YAML format)
#
# Replaces the old OPA Rego + JSON policy pair.
# The openshell-sandbox binary loads this via --policy-data.
# ═══════════════════════════════════════════════════════════════════════════

version: 1

# ── Static: locked at sandbox creation ────────────────────────────────────

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /bin
    - /run
    - /dev/urandom
    - /proc
    - /var/log
  read_write:
    - /sandbox
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# ── Dynamic: network policies ─────────────────────────────────────────────
# Each block pairs allowed (binary, endpoint) pairs.
# Endpoints without protocol/tls use TCP passthrough.
#
# Docker Compose service names resolve via Docker DNS on the host
# side of the network namespace. However, OpenClaw/Node.js may
# pre-resolve hostnames to IPs before the CONNECT request reaches
# the proxy, so we list both the Docker hostname AND the veth host
# IP (10.200.0.1) for each internal service.
#
# allowed_ips overrides the built-in SSRF block on private ranges.
# Loopback (127.x) and link-local (169.254.x) are always blocked.

network_policies:

  # ── Docker Bridge (container rebuild/restart API) ────────────────────
  docker-router:
    name: docker-bridge
    endpoints:
      - host: docker-router
        port: 8070
        allowed_ips: ["172.16.0.0/12", "10.0.0.0/8"]
      - host: "10.200.0.1"
        port: 8070
        allowed_ips: ["10.200.0.0/16"]
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/curl }

  # ── LLM inference (llm_client proxy on Docker network) ──────────────
  llm_inference:
    name: llm-inference
    endpoints:
      - host: llm_client
        port: 9000
        allowed_ips: ["172.16.0.0/12", "10.0.0.0/8"]
      - host: "10.200.0.1"
        port: 9000
        allowed_ips: ["10.200.0.0/16"]
      - host: "172.18.0.1"          # Docker bridge gateway
        port: 9000
        allowed_ips: ["172.16.0.0/12"]
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }

  # ── OpenClaw pricing metadata ────────────────────────────────────────
  openclaw_pricing:
    name: openclaw-pricing
    endpoints:
      - { host: openrouter.ai, port: 443 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }

  # ── Lab services (JupyterLab + nginx + docker-bridge on Docker network) ─
  lab_services:
    name: lab-services
    endpoints:
      - host: lab
        port: 8888
        allowed_ips: ["172.16.0.0/12", "10.0.0.0/8"]
      - host: lab
        port: 8070
        allowed_ips: ["172.16.0.0/12", "10.0.0.0/8"]
      - host: nginx
        port: 80
        allowed_ips: ["172.16.0.0/12", "10.0.0.0/8"]
      - host: "10.200.0.1"
        port: 8888
        allowed_ips: ["10.200.0.0/16"]
      - host: "10.200.0.1"
        port: 8070
        allowed_ips: ["10.200.0.0/16"]
      - host: "10.200.0.1"
        port: 80
        allowed_ips: ["10.200.0.0/16"]
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/curl }

  # ── npm registry (for openclaw plugin installs) ──────────────────────
  npm_registry:
    name: npm-registry
    endpoints:
      - { host: registry.npmjs.org, port: 443 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/local/bin/npm }

  # ── PyPI (for student pip installs) ──────────────────────────────────
  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }
      - { path: /usr/local/bin/pip3 }
      - { path: /usr/local/bin/uv }
      - { path: "/sandbox/.uv/python/**" }