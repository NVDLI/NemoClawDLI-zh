# ═══════════════════════════════════════════════════════════════════════════
# DLI OpenClaw Sandbox Policy. Permissive variant for the NB03 contrast.
#
# Status: opt-in for the NB03 strict-vs-permissive exercise. To activate,
# stage this file as `sandbox-policy.yaml` (NB03 Part 4 does this with
# `shutil.copy2(PERMISSIVE, STRICT)`) and restart openclaw via docker_router.
#
# This is NOT a deployable default. It exists so the course can show the
# contrast between "almost no sandbox" and the real lab default. Compared to
# the strict baseline:
#   - filesystem read_write widened to include /tmp and /var/tmp
#   - network policy adds an explicitly enumerated allow-list of public
#     destinations (broader than the strict baseline, narrower than "any host
#     anywhere"). The openshell-sandbox validator rejects bare `host: "*"`
#     wildcards and requires either specific hostnames or `*.<domain>`
#     patterns rooted in a real domain.
#   - process still drops to the sandbox user; we do not run as root.
#
# If your workshop needs to reach a destination not in this allow-list,
# add it here and re-stage. That's the entire point of being explicit
# about what "permissive" means.
# ═══════════════════════════════════════════════════════════════════════════

version: 1

# ── Static: locked at sandbox creation ────────────────────────────────────

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
    - /bin
    - /run
    - /dev/urandom
    - /proc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /var/tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# ── Dynamic: network policies ─────────────────────────────────────────────
# The baseline (internal) allows from the strict policy are duplicated here
# so the agent can still reach llm_client, docker_router, etc. Public-web
# allows are enumerated below. The header comment explains the rationale.

network_policies:

  llm_inference:
    name: llm-inference
    endpoints:
      - host: llm_client
        port: 9000
        allowed_ips: ["172.16.0.0/12", "10.0.0.0/8"]
      - host: "10.200.0.1"
        port: 9000
        allowed_ips: ["10.200.0.0/16"]
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }

  docker-router:
    name: docker-bridge
    endpoints:
      - host: docker_router
        port: 8070
        allowed_ips: ["172.16.0.0/12", "10.0.0.0/8"]
      - host: "10.200.0.1"
        port: 8070
        allowed_ips: ["10.200.0.0/16"]
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/curl }

  # ── PERMISSIVE: enumerated public destinations ────────────────────────
  # The course's "permissive" stance is not "any host anywhere". It covers
  # the specific destinations the workshop exercises touch, plus the most
  # common reference sources a curious agent might want. Adding more is a
  # one-line edit.
  public_web:
    name: public-web
    endpoints:
      - { host: example.com,                port: 443 }
      - { host: example.com,                port: 80  }
      - { host: example.org,                port: 443 }
      - { host: httpbin.org,                port: 443 }
      - { host: pypi.org,                   port: 443 }
      - { host: files.pythonhosted.org,     port: 443 }
      - { host: registry.npmjs.org,         port: 443 }
      - { host: github.com,                 port: 443 }
      - { host: raw.githubusercontent.com,  port: 443 }
      - { host: api.github.com,             port: 443 }
      - { host: openrouter.ai,              port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }
      - { path: /usr/local/bin/pip3 }
      - { path: /usr/local/bin/uv }
      - { path: /usr/local/bin/npm }
